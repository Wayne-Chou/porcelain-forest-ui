<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="../img/logo.png" />
    <link rel="apple-touch-icon" href="../img/logo.png" />
    <title>建豐健康科技 - 鑑測首頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css"
    />
    <style>
      /* =========================================================
       * 瓷白森林 Porcelain Forest — 專為 iPad 13 吋直式（1032 × 1376）設計
       * ========================================================= */
      :root {
        --bg: #ece7df; /* 暖瓷白：頁面底色 */
        --card: #f7f4ee; /* 卡片底色 */
        --card-deep: #e6dccb; /* 圖示底 */
        --line: #d9cfbe; /* 邊框 */
        --line-soft: #c7bba6; /* 虛線、未選中指示點 */
        --forest: #1f3b33; /* 森林綠：主色 */
        --brass: #b08d57; /* 黃銅：重點色 */
        --brass-text: #8f6e3c; /* 淺底上的黃銅文字（較深，比較清楚） */
        --ink: #1a2420; /* 主要文字 */
        --muted: #6f6656; /* 次要文字（加深，提升清晰度） */
        --nav-off: #6f6656; /* 導航未選中 */
        --on-forest: #f6f1e8; /* 森林綠上的文字 */

        --font-sans: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
        --font-serif: "Noto Serif TC", "Songti TC", serif;
        /* 縮放單位：iPad 13 吋直式（1032 × 1376）時 1 --u = 1px；較小的 iPad 依「寬度」與「高度 × 0.75」中較小者等比縮小 */
        --u: calc(min(100vw, 100dvh * 0.75) / 1032);
        /* 橫式等內容比 1032 --u 寬時，左右各留白這麼多，內容置中 */
        --gutter: max(0px, calc((100vw - 1032 * var(--u)) / 2));
        /* 字級：四頁共用，同一種用途用同一個變數（其他字級以這些變數加減或倍數表示）
         * 大小順序：small < body < button < lead < title < display；card-name、hero-num 為大字專用 */
        --fs-display: max(16px, calc(72 * var(--u))); /* 頁面大標題：問候語、登入、場域名稱、受測者管理 */
        --fs-hero-num: max(16px, calc(88 * var(--u))); /* 大數字：今日數據、進度數字 */
        --fs-card-name: max(16px, calc(84 * var(--u))); /* 測驗卡片名稱 */
        --fs-title: max(16px, calc(44 * var(--u))); /* 面板與對話框標題 */
        --fs-lead: max(16px, calc(32 * var(--u))); /* 重要內文：人員姓名、場域名稱、欄位輸入文字、影像上傳標題 */
        --fs-button: max(18px, calc(30 * var(--u))); /* 按鈕文字、導航文字、toast */
        --fs-body: max(16px, calc(26 * var(--u))); /* 一般內文、說明、欄位標籤、分段切換、搜尋框 */
        --fs-small: max(16px, calc(24 * var(--u))); /* 輔助小字：日期、編號・年齡・性別、時間、徽章、小標籤、錯誤訊息 */

        --pad: calc(64 * var(--u));
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        overflow-x: hidden;
      }
      .serif {
        font-family: var(--font-serif);
      }
      /* 表單元素與 placeholder 繼承頁面字型（瀏覽器預設不會繼承） */
      input,
      textarea,
      select,
      input::placeholder,
      textarea::placeholder {
        font: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
      }

      /* 進場動畫 */
      .rise {
        animation: rise 0.9s calc(var(--d, 0) * 1s) var(--ease-out) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(calc(40 * var(--u)));
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== App 外層：開啟場域面板時整個退到後面（iOS 卡片式視窗） ===== */
      body.sheet-open {
        background: var(--ink);
      }
      .app {
        position: fixed;
        inset: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--bg);
        transform-origin: 50% 50%;
        transition:
          transform 0.5s var(--ease-out),
          border-radius 0.5s var(--ease-out),
          filter 0.5s var(--ease-out);
      }
      body.sheet-open .app {
        transform: scale(0.94);
        border-radius: calc(40 * var(--u));
        filter: brightness(0.9);
        overflow: hidden;
      }

      /* ===== 版面 ===== */
      /* 整頁高度 100dvh；畫面比 13 吋長時，多出來的空間平均分配到各區塊之間（13 吋剛好放滿，不會多出空間） */
      .home {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: calc(calc(56 * var(--u)) + env(safe-area-inset-top)) var(--gutter) calc(219 * var(--u)); /* 底部 219 = 原本 180 ＋ 13 吋上原本留在底部的 39 */
      }

      /* 頂部：Logo、日期、問候語、今日數據 */
      .hero {
        padding: 0 var(--pad);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: calc(24 * var(--u));
      }
      .brand-row {
        display: flex;
        align-items: center;
        gap: calc(22 * var(--u));
      }
      .logo {
        width: calc(84 * var(--u));
        height: calc(84 * var(--u));
        padding: calc(12 * var(--u));
        border-radius: calc(24 * var(--u));
        background: var(--card);
        border: 2px solid var(--line);
        object-fit: contain;
      }
      .hero-date {
        font-size: max(16px, calc(var(--fs-small) + calc(4 * var(--u))));
        letter-spacing: 0.12em;
        color: var(--muted);
        font-weight: 500;
      }
      .hero-title {
        margin: calc(18 * var(--u)) 0 0;
        font-size: max(16px, calc(var(--fs-display) + calc(4 * var(--u))));
        font-weight: 600;
        line-height: 1.22;
      }
      .stats {
        display: flex;
        gap: calc(52 * var(--u));
        text-align: right;
        padding-bottom: calc(8 * var(--u));
      }
      .stat-num {
        font-size: max(16px, var(--fs-hero-num));
        line-height: 1.05;
        font-weight: 600;
      }
      .stat-num.brass {
        color: var(--brass);
      }
      .stat-num.forest {
        color: var(--forest);
      }
      .stat-label {
        margin-top: calc(4 * var(--u));
        font-size: max(16px, var(--fs-body));
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
      }

      /* 測驗卡片輪播 */
      .tests {
        margin-top: calc(48 * var(--u));
        display: flex;
        gap: calc(28 * var(--u));
        padding: 0 var(--pad);
        scroll-padding: 0 var(--pad);
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .tests::-webkit-scrollbar {
        display: none;
      }
      .test-card {
        flex: 0 0 auto;
        width: calc(560 * var(--u));
        height: calc(540 * var(--u));
        scroll-snap-align: start;
        position: relative;
        overflow: hidden;
        border-radius: calc(48 * var(--u));
        border: 2px solid var(--line);
        background: var(--card);
        padding: calc(44 * var(--u));
        display: flex;
        flex-direction: column;
        text-align: left;
        transition:
          background 0.6s var(--ease-out),
          color 0.6s var(--ease-out),
          border-color 0.6s,
          transform 0.25s var(--ease-out);
      }
      .test-card:last-child {
        scroll-snap-align: end;
      }
      .test-card:active {
        transform: scale(0.97);
      }
      .test-card .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: calc(16 * var(--u));
      }
      .test-card .no {
        font-size: max(16px, calc(var(--fs-small) + calc(4 * var(--u))));
        font-weight: 700;
        color: var(--brass-text);
        transition: color 0.6s;
      }
      .test-card .no em {
        font-style: normal;
        font-weight: 500;
        color: var(--muted);
        margin-right: calc(14 * var(--u));
        padding-right: calc(14 * var(--u));
        border-right: 2px solid var(--line-soft);
        transition:
          color 0.6s,
          border-color 0.6s;
      }
      .test-card .top i {
        font-size: max(16px, calc(var(--fs-body) * 2));
        color: var(--forest);
        transition: color 0.6s;
      }
      .test-card .name {
        margin-top: auto;
        font-size: max(16px, var(--fs-card-name));
        line-height: 1.15;
        font-weight: 600;
        white-space: nowrap;
      }
      .test-card .desc {
        margin-top: calc(10 * var(--u));
        font-size: max(16px, var(--fs-lead));
        font-weight: 500;
        color: var(--muted);
        transition: color 0.6s;
      }
      .test-card .time {
        margin-top: calc(10 * var(--u));
        display: flex;
        align-items: center;
        gap: calc(10 * var(--u));
        font-size: max(16px, calc(var(--fs-small) + calc(6 * var(--u))));
        font-weight: 700;
        color: var(--muted);
        transition: color 0.6s;
      }
      .test-card .time i {
        font-size: 1.1333em;
      }
      .test-card .start {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: calc(14 * var(--u));
        border-radius: calc(999 * var(--u));
        background: var(--brass);
        color: var(--forest);
        font-size: max(18px, calc(var(--fs-button) + calc(4 * var(--u))));
        font-weight: 700;
        padding: 0 calc(44 * var(--u));
        max-height: 0;
        margin-top: 0;
        opacity: 0;
        overflow: hidden;
        transition: all 0.5s var(--ease-out);
      }
      .test-card .start i {
        font-size: 1.0588em;
      }

      /* 選中的卡片：森林綠 */
      .test-card.is-active {
        background: var(--forest);
        border-color: var(--forest);
        color: var(--on-forest);
      }
      .test-card.is-active .no {
        color: var(--brass);
      }
      .test-card.is-active .no em {
        color: rgba(246, 241, 232, 0.75);
        border-color: rgba(246, 241, 232, 0.35);
      }
      .test-card.is-active .top i {
        color: var(--brass);
      }
      .test-card.is-active .name {
        font-size: max(16px, calc(var(--fs-card-name) + calc(12 * var(--u))));
      }
      .test-card.is-active .name.long {
        font-size: max(16px, calc(var(--fs-card-name) + calc(4 * var(--u))));
      }
      .test-card.is-active .desc,
      .test-card.is-active .time {
        color: rgba(246, 241, 232, 0.88);
      }
      .test-card.is-active .start {
        max-height: calc(140 * var(--u));
        padding-top: calc(24 * var(--u));
        padding-bottom: calc(24 * var(--u));
        margin-top: calc(32 * var(--u));
        opacity: 1;
        overflow: visible;
        animation: halo 2.4s 1.2s ease-out infinite;
      }
      @keyframes halo {
        from {
          box-shadow: 0 0 0 0 rgba(176, 141, 87, 0.55);
        }
        to {
          box-shadow: 0 0 0 calc(22 * var(--u)) rgba(176, 141, 87, 0);
        }
      }
      .test-card.is-active::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 45%;
        background: linear-gradient(
          100deg,
          transparent,
          rgba(255, 255, 255, 0.14),
          transparent
        );
        transform: translateX(-120%) skewX(-12deg);
        animation: sheen 7s 1.5s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes sheen {
        0% {
          transform: translateX(-120%) skewX(-12deg);
        }
        28%,
        100% {
          transform: translateX(330%) skewX(-12deg);
        }
      }

      /* 指示點 */
      .dots {
        margin-top: calc(28 * var(--u));
        display: flex;
        justify-content: center;
        gap: calc(14 * var(--u));
      }
      .dot {
        width: calc(14 * var(--u));
        height: calc(14 * var(--u));
        border-radius: calc(7 * var(--u));
        background: var(--line-soft);
        transition:
          width 0.5s var(--ease-spring),
          background 0.4s;
      }
      .dot.is-active {
        width: calc(56 * var(--u));
        background: var(--forest);
      }

      /* 影像上傳 */
      .sync {
        margin-top: calc(36 * var(--u));
        padding: 0 var(--pad);
      }
      .sync-card {
        width: 100%;
        display: flex;
        align-items: center;
        gap: calc(28 * var(--u));
        padding: calc(26 * var(--u)) calc(30 * var(--u));
        border-radius: calc(36 * var(--u));
        background: var(--card);
        border: 2px solid var(--line);
        text-align: left;
        transition: transform 0.25s var(--ease-out);
      }
      .sync-card:active {
        transform: scale(0.98);
      }
      .sync-ico {
        position: relative;
        flex: 0 0 auto;
        width: calc(92 * var(--u));
        height: calc(92 * var(--u));
        border-radius: calc(28 * var(--u));
        background: var(--card-deep);
        color: var(--brass-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: max(16px, calc(var(--fs-lead) * 1.5));
      }
      .sync-badge {
        position: absolute;
        top: calc(-12 * var(--u));
        right: calc(-12 * var(--u));
        min-width: calc(44 * var(--u));
        height: calc(44 * var(--u));
        padding: 0 calc(12 * var(--u));
        border-radius: calc(22 * var(--u));
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(16px, var(--fs-small));
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        border: calc(4 * var(--u)) solid var(--card);
      }
      .sync-text {
        flex: 1;
        min-width: 0;
      }
      .sync-title {
        font-size: max(16px, calc(var(--fs-lead) + calc(6 * var(--u))));
        font-weight: 700;
      }
      .sync-btn {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: calc(12 * var(--u));
        padding: calc(22 * var(--u)) calc(40 * var(--u));
        border-radius: calc(999 * var(--u));
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(18px, calc(var(--fs-button) + 2px));
        font-weight: 700;
      }
      .sync-btn i {
        font-size: 1.0625em;
      }
      .sync-done {
        flex: 0 0 auto;
        font-size: max(16px, calc(var(--fs-body) + calc(4 * var(--u))));
        font-weight: 500;
        color: var(--muted);
      }
      .sync-card.is-done .sync-ico {
        color: var(--forest);
      }
      .sync-card.is-done .sync-btn {
        display: none;
      }
      .sync-card:not(.is-done) .sync-done {
        display: none;
      }

      /* ===== 底部膠囊導航 ===== */
      .nav {
        position: fixed;
        left: 50%;
        bottom: calc(calc(36 * var(--u)) + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: calc(10 * var(--u));
        padding: calc(14 * var(--u));
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: calc(999 * var(--u));
        box-shadow: 0 calc(12 * var(--u)) calc(40 * var(--u)) rgba(31, 59, 51, 0.1);
        z-index: 100;
        animation: navIn 1s 0.5s var(--ease-spring) both;
      }
      @keyframes navIn {
        from {
          transform: translate(-50%, 200%);
        }
        to {
          transform: translate(-50%, 0);
        }
      }
      .nav-item {
        height: max(44px, calc(92 * var(--u)));
        min-width: max(44px, calc(104 * var(--u)));
        padding: 0 calc(22 * var(--u));
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: calc(999 * var(--u));
        color: var(--nav-off);
        font-size: max(18px, calc(var(--fs-button) + calc(4 * var(--u))));
        font-weight: 700;
        transition:
          background 0.45s var(--ease-spring),
          color 0.3s,
          padding 0.45s var(--ease-spring);
      }
      .nav-item i {
        font-size: 1.3529em;
        transition: transform 0.45s var(--ease-spring);
      }
      .nav-item span {
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        white-space: nowrap;
        transition:
          max-width 0.45s var(--ease-spring),
          opacity 0.3s,
          margin 0.45s var(--ease-spring);
      }
      .nav-item.is-active {
        background: var(--forest);
        color: var(--on-forest);
        padding: 0 calc(44 * var(--u));
      }
      .nav-item.is-active span {
        max-width: 5em;
        opacity: 1;
        margin-left: calc(14 * var(--u));
      }
      .nav-item:active i {
        transform: scale(0.82);
      }

      /* =========================================================
       * 選擇場域：底部面板（單一固定高度）
       * --vh：可見高度；--kb：鍵盤高度（皆由 visualViewport 更新）
       * ========================================================= */
      .sheet-mask {
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 26, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s var(--ease-out);
        z-index: 200;
      }
      body.sheet-open:not(.up-open) .sheet-mask {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet {
        position: fixed;
        left: var(--gutter); /* 橫式時面板寬度和內容一致，置中 */
        right: var(--gutter);
        bottom: var(--kb, 0px);
        height: calc(var(--vh, 100dvh) - calc(120 * var(--u)));
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border-radius: calc(48 * var(--u)) calc(48 * var(--u)) 0 0;
        box-shadow: 0 calc(-12 * var(--u)) calc(40 * var(--u)) rgba(31, 59, 51, 0.12);
        transform: translateY(calc(100% + var(--kb, 0px) + calc(40 * var(--u))));
        visibility: hidden;
        transition:
          transform 0.5s var(--ease-out),
          height 0.45s var(--ease-out),
          visibility 0s 0.5s;
        z-index: 210;
        user-select: none;
        -webkit-user-select: none;
      }
      .sheet.is-open {
        transform: translateY(0);
        visibility: visible;
        transition:
          transform 0.5s var(--ease-out),
          height 0.45s var(--ease-out),
          visibility 0s;
      }
      .sheet.is-dragging {
        transition: none;
      }
      /* 面板開啟時 toast 稍微上移，停在面板頂端（calc(120 * var(--u))）上方的空間，不與面板重疊 */
      body.sheet-open .toast {
        top: calc(calc(20 * var(--u)) + env(safe-area-inset-top));
      }

      /* 頂部：拖曳把手＋標題（整塊都可往下拖曳關閉） */
      .sheet-grab {
        flex: 0 0 auto;
        padding: calc(16 * var(--u)) calc(56 * var(--u)) calc(8 * var(--u));
        touch-action: none;
        cursor: grab;
      }
      .grab-bar {
        display: block;
        width: calc(64 * var(--u));
        height: calc(8 * var(--u));
        margin: 0 auto;
        border-radius: calc(4 * var(--u));
        background: var(--line-soft);
      }
      .sheet-head {
        margin-top: calc(16 * var(--u));
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: calc(24 * var(--u));
      }
      .sheet-title {
        margin: 0;
        font-size: max(16px, calc(var(--fs-title) + calc(12 * var(--u))));
        line-height: 1.2;
        font-weight: 600;
      }
      .sheet-sub {
        margin-top: calc(4 * var(--u));
        font-size: max(16px, var(--fs-body));
        color: var(--muted);
        font-weight: 500;
      }
      .sheet-close {
        flex: 0 0 auto;
        width: max(44px, calc(72 * var(--u)));
        height: max(44px, calc(72 * var(--u)));
        border-radius: 50%;
        background: var(--card);
        border: 2px solid var(--line);
        display: grid;
        place-items: center;
        font-size: max(16px, calc(var(--fs-lead) * 1.125));
        color: var(--ink);
        transition: transform 0.2s var(--ease-out);
      }
      .sheet-close:active {
        transform: scale(0.92);
      }

      /* 中間：搜尋框（固定）＋清單（可捲動） */
      .sheet-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .search-box {
        flex: 0 0 auto;
        margin: calc(16 * var(--u)) calc(56 * var(--u)) 0;
        height: max(48px, calc(96 * var(--u)));
        display: flex;
        align-items: center;
        border-radius: calc(28 * var(--u));
        background: var(--card);
        border: 2px solid var(--line);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .search-box:focus-within {
        border-color: var(--forest);
        box-shadow: 0 0 0 calc(6 * var(--u)) rgba(31, 59, 51, 0.12);
      }
      .search-box > .ti-search {
        margin-left: calc(28 * var(--u));
        font-size: max(16px, calc((var(--fs-body) + calc(4 * var(--u))) * 1.2));
        color: var(--brass-text);
      }
      .search-input {
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0 calc(20 * var(--u));
        border: none;
        outline: none;
        background: transparent;
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: max(16px, calc(var(--fs-body) + calc(4 * var(--u))));
        user-select: text;
        -webkit-user-select: text;
      }
      .search-input::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }
      .search-input::-webkit-search-cancel-button {
        display: none;
      }
      .search-clear {
        width: max(44px, calc(72 * var(--u)));
        height: max(44px, calc(72 * var(--u)));
        margin-right: calc(10 * var(--u));
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: max(16px, var(--fs-lead));
        color: var(--muted);
      }
      .search-clear[hidden] {
        display: none;
      }
      .search-clear:active {
        background: var(--card-deep);
      }

      .field-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 calc(56 * var(--u)) calc(32 * var(--u));
      }
      .field-list.shake {
        animation: shake 0.4s var(--ease-out);
      }
      @keyframes shake {
        0%,
        100% {
          transform: none;
        }
        20% {
          transform: translateX(calc(-14 * var(--u)));
        }
        40% {
          transform: translateX(calc(12 * var(--u)));
        }
        60% {
          transform: translateX(calc(-8 * var(--u)));
        }
        80% {
          transform: translateX(calc(4 * var(--u)));
        }
      }
      .sheet-section {
        margin: calc(32 * var(--u)) 0 calc(16 * var(--u));
        font-size: max(16px, var(--fs-small));
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.1em;
      }
      .list-empty {
        padding: calc(96 * var(--u)) 0;
        text-align: center;
      }
      .list-empty i {
        font-size: max(16px, calc(var(--fs-lead) * 2));
        color: var(--line-soft);
      }
      .list-empty-title {
        margin-top: calc(16 * var(--u));
        font-size: max(16px, calc(var(--fs-body) + calc(4 * var(--u))));
        font-weight: 700;
      }
      .list-empty-sub {
        margin-top: calc(8 * var(--u));
        font-size: max(16px, var(--fs-small));
        color: var(--muted);
      }

      /* 場域列：單行（單選鈕、名稱、已選取） */
      .frow {
        height: max(44px, calc(104 * var(--u)));
        padding: 0 calc(28 * var(--u));
        display: flex;
        align-items: center;
        gap: calc(20 * var(--u));
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: calc(28 * var(--u));
        cursor: pointer;
        transition:
          transform 0.2s var(--ease-out),
          border-color 0.25s,
          background 0.25s;
      }
      .frow + .frow {
        margin-top: calc(12 * var(--u));
      }
      .frow:active {
        transform: scale(0.98);
      }
      .frow:focus-visible {
        outline: calc(3 * var(--u)) solid var(--forest);
        outline-offset: calc(3 * var(--u));
      }
      .frow-radio {
        flex: 0 0 auto;
        width: calc(40 * var(--u));
        height: calc(40 * var(--u));
        border-radius: 50%;
        border: 2px solid var(--line-soft);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: max(16px, var(--fs-body));
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .frow-radio i {
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.25s var(--ease-spring);
      }
      .frow-radio.pop {
        animation: radioPop 0.35s var(--ease-spring);
      }
      @keyframes radioPop {
        0% {
          transform: scale(0.8);
        }
        60% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
      /* 名稱可使用單選鈕右邊的全部寬度，「已選取」緊接在名稱後；太長時名稱以 … 截斷 */
      .frow-name {
        flex: 0 1 auto;
        min-width: 0;
        font-size: max(16px, var(--fs-lead));
        font-weight: 700;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .frow-name mark {
        background: rgba(176, 141, 87, 0.22);
        color: var(--brass-text);
        border-radius: calc(6 * var(--u));
        padding: 0;
      }
      .frow-tag {
        display: none;
        flex: 0 0 auto;
        padding: calc(4 * var(--u)) calc(14 * var(--u));
        border-radius: calc(999 * var(--u));
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(16px, calc(var(--fs-small) - calc(4 * var(--u))));
        font-weight: 700;
        line-height: 1.3;
      }
      .frow.is-selected {
        border-color: var(--forest);
        background: #eef1ec;
      }
      .frow.is-selected .frow-radio {
        background: var(--forest);
        border-color: var(--forest);
      }
      .frow.is-selected .frow-radio i {
        opacity: 1;
        transform: none;
      }
      .frow.is-selected .frow-tag {
        display: inline-block;
      }

      /* 底部固定按鈕 */
      .sheet-foot {
        flex: 0 0 auto;
        padding: calc(24 * var(--u)) calc(56 * var(--u)) calc(calc(24 * var(--u)) + env(safe-area-inset-bottom));
        background: var(--bg);
      }
      .sheet-confirm {
        width: 100%;
        height: max(48px, calc(112 * var(--u)));
        border-radius: calc(999 * var(--u));
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(18px, calc(var(--fs-button) + calc(6 * var(--u))));
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(14 * var(--u));
        transition: transform 0.2s var(--ease-out);
      }
      .sheet-confirm:active {
        transform: scale(0.98);
      }

      /* 首頁「立即上傳」：背景上傳中 */
      .sync-btn.is-busy {
        background: var(--card-deep);
        color: var(--muted);
      }

      /* =========================================================
       * 影像上傳：底部面板（高度依內容，最高 var(--vh) - calc(120 * var(--u))；清單區可捲動）
       * ========================================================= */
      .up-mask {
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 26, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s var(--ease-out);
        z-index: 200;
      }
      body.up-open .up-mask {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet.up-sheet {
        height: auto;
        max-height: calc(var(--vh, 100dvh) - calc(120 * var(--u)));
      }
      .up-total {
        margin-top: calc(16 * var(--u));
        min-height: calc(64 * var(--u));
        display: flex;
        align-items: baseline;
        gap: calc(10 * var(--u));
        font-size: max(16px, var(--fs-body));
        color: var(--muted);
      }
      .up-total[hidden] {
        display: none;
      }
      .up-total.is-done {
        align-items: center;
        color: var(--forest);
        font-weight: 700;
      }
      /* 總數：數字變化時舊的往下滑出、新的從上方滑入 */
      .up-num {
        position: relative;
        display: inline-block;
        overflow: hidden;
        font-size: max(16px, calc(var(--fs-hero-num) * 0.6));
        font-weight: 600;
        line-height: 1.15;
        color: var(--brass);
        font-variant-numeric: tabular-nums;
      }
      .up-num .roll-in {
        display: inline-block;
        animation: rollIn 0.45s var(--ease-out);
      }
      .up-num .roll-out {
        position: absolute;
        left: 0;
        top: 0;
        animation: rollOut 0.45s var(--ease-out) forwards;
      }
      @keyframes rollIn {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
      }
      @keyframes rollOut {
        to {
          transform: translateY(100%);
          opacity: 0;
        }
      }
      .up-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: calc(32 * var(--u)) calc(56 * var(--u)) calc(calc(40 * var(--u)) + env(safe-area-inset-bottom));
      }
      .up-card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: calc(40 * var(--u));
        overflow: hidden;
      }
      .up-row {
        min-height: calc(128 * var(--u));
        padding: calc(18 * var(--u)) calc(32 * var(--u));
        display: flex;
        align-items: center;
        gap: calc(24 * var(--u));
        transition:
          background 0.3s,
          box-shadow 0.3s;
      }
      .up-row + .up-row {
        border-top: 2px solid #e6dfd2;
      }
      .up-row.shake {
        animation: shake 0.4s var(--ease-out);
      }
      /* 失敗：淡紅底＋左側 2px 紅色內邊線（不改變尺寸） */
      .up-row.is-fail {
        background: rgba(181, 71, 58, 0.06);
        box-shadow: inset 2px 0 0 #b5473a;
      }
      /* 成功後收合移除 */
      .up-row.is-leaving {
        min-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        opacity: 0;
        overflow: hidden;
        transition:
          height 0.4s var(--ease-out),
          min-height 0.4s var(--ease-out),
          padding 0.4s var(--ease-out),
          opacity 0.4s var(--ease-out);
      }
      .up-ico {
        flex: 0 0 auto;
        width: calc(72 * var(--u));
        height: calc(72 * var(--u));
        border-radius: calc(22 * var(--u));
        background: var(--card-deep);
        display: grid;
        place-items: center;
        font-size: max(16px, calc(var(--fs-lead) * 1.125));
        color: var(--brass-text);
      }
      /* 日期、第二行、進度條固定佔位，列高不跳動；
       * 待上傳（沒有第二行）時整組往下移，讓日期在列中垂直置中 */
      .up-main {
        flex: 1;
        min-width: 0;
        transition: transform 0.3s var(--ease-out);
      }
      .up-row[data-state="idle"] .up-main {
        /* 往下移 =（第二行高度 + 間距 4 + 進度條 20）÷ 2 */
        transform: translateY(calc((var(--fs-small) * 1.3 + calc(24 * var(--u))) / 2));
      }
      .up-date {
        font-size: max(16px, var(--fs-lead));
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
      }
      .up-status {
        margin-top: calc(4 * var(--u));
        height: calc(var(--fs-small) * 1.3);
        display: flex;
        align-items: center;
        gap: calc(6 * var(--u));
        font-size: max(16px, var(--fs-small));
        line-height: 1.3;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        transition: opacity 0.3s var(--ease-out);
      }
      .up-row[data-state="idle"] .up-status {
        opacity: 0;
      }
      .up-row.is-fail .up-status {
        color: #b5473a;
      }
      .up-status i {
        font-size: 1.15em;
      }
      /* 進度條：固定佔位，避免出現時列高跳動 */
      .up-bar {
        margin-top: calc(10 * var(--u));
        height: calc(10 * var(--u));
        border-radius: calc(5 * var(--u));
        background: var(--card-deep);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .up-bar.is-on {
        opacity: 1;
      }
      .up-fill {
        width: 0;
        height: 100%;
        border-radius: calc(5 * var(--u));
        background: var(--forest);
        transition:
          width 0.25s linear,
          background 0.3s;
      }
      .up-row.is-fail .up-fill {
        background: #b5473a;
      }
      .up-btn {
        flex: 0 0 auto;
        height: max(44px, calc(76 * var(--u)));
        padding: 0 calc(34 * var(--u));
        border-radius: calc(999 * var(--u));
        border: 2px solid transparent;
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(18px, var(--fs-button));
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: calc(10 * var(--u));
        white-space: nowrap;
        transition: transform 0.2s var(--ease-out);
      }
      .up-btn i {
        font-size: 1.1em;
      }
      .up-btn:active {
        transform: scale(0.95);
      }
      .up-btn.is-busy {
        background: var(--card-deep);
        color: var(--muted);
        pointer-events: none;
      }
      .up-btn.is-done {
        background: rgba(176, 141, 87, 0.16);
        color: var(--brass-text);
        pointer-events: none;
      }
      .up-btn.is-done i {
        animation: radioPop 0.35s var(--ease-spring);
      }
      .up-btn.is-retry {
        background: transparent;
        border-color: #b5473a;
        color: #b5473a;
      }
      .spin {
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* 全部上傳完成 */
      .up-empty {
        padding: calc(72 * var(--u)) 0 calc(48 * var(--u));
        text-align: center;
      }
      .up-empty i {
        font-size: max(16px, calc(var(--fs-lead) * 2));
        color: var(--forest);
      }
      .up-empty-title {
        margin-top: calc(16 * var(--u));
        font-size: max(16px, calc(var(--fs-body) + calc(4 * var(--u))));
        font-weight: 700;
      }
      .up-empty-sub {
        margin-top: calc(8 * var(--u));
        font-size: max(16px, var(--fs-small));
        color: var(--muted);
      }

      /* ===== 提示訊息 ===== */
      .toast {
        position: fixed;
        left: 50%;
        top: calc(calc(36 * var(--u)) + env(safe-area-inset-top));
        transform: translate(-50%, calc(-24 * var(--u)));
        padding: calc(22 * var(--u)) calc(40 * var(--u));
        border-radius: calc(999 * var(--u));
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(18px, var(--fs-button));
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: all 0.35s var(--ease-spring);
        z-index: 300;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <main class="home">
        <!-- 頂部：日期、問候語、今日數據 -->
        <header class="hero">
          <div class="rise" style="--d: 0.05">
            <div class="brand-row">
              <img class="logo" src="../img/logo.png" alt="建豐健康科技" />
              <div class="hero-date" id="heroDate"></div>
            </div>
            <h1 class="hero-title serif" id="heroTitle"></h1>
          </div>
          <div class="stats rise" style="--d: 0.15">
            <div>
              <div class="stat-num serif brass" id="statDone">0</div>
              <div class="stat-label">今日完成</div>
            </div>
            <div>
              <div class="stat-num serif forest" id="statPending">0</div>
              <div class="stat-label">待上傳</div>
            </div>
          </div>
        </header>

        <!-- 測驗卡片：左右滑動選擇 -->
        <section class="tests rise" style="--d: 0.25" id="testList"></section>
        <div class="dots rise" style="--d: 0.35" id="dots"></div>

        <!-- 影像上傳狀態 -->
        <section class="sync rise" style="--d: 0.42">
          <button class="sync-card" id="syncCard">
            <span class="sync-ico"
              ><i class="ti ti-cloud-upload" id="syncIcon"></i
              ><span class="sync-badge" id="syncBadge" hidden></span
            ></span>
            <div class="sync-text"><div class="sync-title">影像上傳</div></div>
            <span class="sync-btn"
              >立即上傳 <i class="ti ti-arrow-up"></i
            ></span>
            <span class="sync-done">已全部上傳</span>
          </button>
        </section>
      </main>

      <nav class="nav" id="nav"></nav>
    </div>

    <!-- 選擇場域：底部面板 -->
    <div class="sheet-mask" id="sheetMask"></div>
    <section
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetTitle"
      aria-hidden="true"
    >
      <div class="sheet-grab" id="sheetGrab">
        <span class="grab-bar"></span>
        <header class="sheet-head">
          <div>
            <h2 class="sheet-title serif" id="sheetTitle">選擇場域</h2>
            <div class="sheet-sub" id="sheetSub"></div>
          </div>
          <button
            class="sheet-close"
            id="sheetClose"
            type="button"
            aria-label="關閉"
          >
            <i class="ti ti-x"></i>
          </button>
        </header>
      </div>

      <div class="sheet-body">
        <!-- 搜尋框：固定在上方，不跟著清單捲動 -->
        <label class="search-box">
          <i class="ti ti-search"></i>
          <input
            class="search-input"
            id="searchInput"
            type="search"
            placeholder="搜尋場域名稱"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="search"
          />
          <button
            class="search-clear"
            id="searchClear"
            type="button"
            aria-label="清除搜尋"
            hidden
          >
            <i class="ti ti-x"></i>
          </button>
        </label>
        <!-- 清單：最近使用＋全部場域，或搜尋結果 -->
        <div
          class="field-list"
          id="fieldList"
          role="radiogroup"
          aria-label="場域"
        ></div>
      </div>

      <footer class="sheet-foot">
        <button class="sheet-confirm" id="sheetConfirm" type="button">
          開始測驗 <i class="ti ti-arrow-right"></i>
        </button>
      </footer>
    </section>

    <!-- 影像上傳：底部面板 -->
    <div class="up-mask" id="upMask"></div>
    <section
      class="sheet up-sheet"
      id="upSheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="upTitle"
      aria-hidden="true"
    >
      <div class="sheet-grab" id="upGrab">
        <span class="grab-bar"></span>
        <header class="sheet-head">
          <h2 class="sheet-title serif" id="upTitle">影像上傳</h2>
          <button class="sheet-close" id="upClose" type="button" aria-label="關閉">
            <i class="ti ti-x"></i>
          </button>
        </header>
        <div class="up-total" id="upTotal" aria-live="polite">
          <span>共</span><span class="up-num serif" id="upNum"></span><span>筆待上傳</span>
        </div>
        <div class="up-total is-done" id="upTotalDone" hidden>全部已上傳</div>
      </div>
      <div class="up-body" id="upBody"></div>
    </section>

    <div class="toast" id="toast"></div>

    <script>
      /* =========================================================
       * 設定區：單位名稱、測驗項目、導航都在這裡改，介面會自動更新
       * ========================================================= */
      const CONFIG = {
        unitName: "建豐健康科技",

        // 今日數據（之後改成從後端讀取）；待上傳數量改由 uploads 計算
        stats: { done: 2 }, // 與名單頁已完成 SPPB 的人數一致

        // 待上傳的鑑測（假資料，日期依今天自動產生）
        // TODO：之後改成從設備本機或 API 讀取

      const $ = (sel) => document.querySelector(sel);
      // 1 個 --u 實際是幾 px（iPad 13 吋直式 = 1）；拖曳關閉距離等 JS 裡的尺寸用它換算
      function unitPx() {
        let probe = document.getElementById("__unit");
        if (!probe) {
          probe = document.createElement("div");
          probe.id = "__unit";
          probe.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;width:calc(1000 * var(--u));height:0";
          document.body.appendChild(probe);
        }
        return probe.offsetWidth / 1000;
      }

      let toastTimer;

        const el = $("#toast");

      // 數字從 0 跑到目標值
      function countUp(el, target) {
        const start = performance.now() + 300;
        const dur = 1200;
        const tick = (t) => {
          const p = Math.min(Math.max((t - start) / dur, 0), 1);
          el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      function renderTests() {
        const list = $("#testList");
        list.innerHTML = CONFIG.tests
          .map(
            (t, i) => `
      <button class="test-card ${i === 0 ? "is-active" : ""}" data-index="${i}">
        <div class="top"><span class="no"><em>產出</em>${t.output}</span><i class="ti ${t.icon}"></i></div>
        <div class="name serif ${t.name.length > 4 ? "long" : ""}">${t.name}</div>
        <div class="desc">${t.desc}</div>
        <div class="time"><i class="ti ti-clock"></i>約 ${t.minutes} 分鐘</div>
        <span class="start" data-start="${t.id}">開始測驗 <i class="ti ti-arrow-right"></i></span>
      </button>`,
          )
          .join("");

        $("#dots").innerHTML = CONFIG.tests
          .map(
            (_, i) => `<span class="dot ${i === 0 ? "is-active" : ""}"></span>`,
          )
          .join("");

        const cards = [...list.querySelectorAll(".test-card")];
        const dots = [...$("#dots").children];
        let active = 0;

        const setActive = (i) => {
          if (i === active) return;
          cards[active].classList.remove("is-active");
          dots[active].classList.remove("is-active");
          cards[i].classList.add("is-active");
          dots[i].classList.add("is-active");
          active = i;
        };

        // 滑動時，最接近畫面中央的卡片成為選中卡片
        let raf;
        list.addEventListener("scroll", () => {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => {
            const r = list.getBoundingClientRect();
            const mid = r.left + r.width / 2;
            let best = 0,
              bestDist = Infinity;
            cards.forEach((c, i) => {
              const cr = c.getBoundingClientRect();
              const d = Math.abs(cr.left + cr.width / 2 - mid);
              if (d < bestDist) {
                bestDist = d;
                best = i;
              }
            });
            setActive(best);
          });
        });

        // 點未選中的卡片 → 滑過去；點選中卡片 → 開始測驗
        list.addEventListener("click", (e) => {
          const card = e.target.closest(".test-card");
          if (!card) return;
          const i = Number(card.dataset.index);
          if (i !== active) {
            card.scrollIntoView({
              behavior: "smooth",
              inline: "nearest",
              block: "nearest",
            });
            setActive(i);
            return;
          }
          onTestSelected(CONFIG.tests[i]);
        });
      }

      // 影像上傳卡：依待上傳數量顯示狀態；背景上傳中時「立即上傳」改成「上傳中」
      function renderSync() {

      /* =========================================================
       * 場域：sessionStorage（關閉分頁即清除；以「當天的工作階段」為單位）
       * kf.currentField  { id, date }：date 不是今天就當作沒有目前場域
       * kf.recentFields  [{ id, usedAt }]：最近使用（usedAt 為時間戳），最新在前，最多 20 筆
       *                  （相容舊格式：純 id 陣列）
       * ========================================================= */
      const FIELD_KEYS = {
        current: "kf.currentField",
        recent: "kf.recentFields",
      };
      const RECENT_MAX = 20;
      const fieldById = new Map(CONFIG.fields.map((f) => [f.id, f]));

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function readJSON(key, fallback) {
        try {
          const v = JSON.parse(sessionStorage.getItem(key));
          return v ?? fallback;
        } catch (e) {
          return fallback;
        }
      }
      function writeJSON(key, val) {
        try {
          sessionStorage.setItem(key, JSON.stringify(val));
        } catch (e) {}
      }
      function todayStr() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      }

      const fieldStore = {
        getCurrent() {
          const v = readJSON(FIELD_KEYS.current, null);
          if (!v || v.date !== todayStr()) return null;
          return fieldById.get(v.id) || null;
        },
        setCurrent(id) {
          writeJSON(FIELD_KEYS.current, { id, date: todayStr() });
          const rest = this.getRecent().filter((r) => r.id !== id);
          writeJSON(
            FIELD_KEYS.recent,
            [{ id, usedAt: Date.now() }, ...rest].slice(0, RECENT_MAX),
          );
        },
        // 最近使用：最新在前；舊格式（純 id 陣列）依原順序換算成時間戳
        getRecent() {
          const raw = readJSON(FIELD_KEYS.recent, []);
          if (!Array.isArray(raw)) return [];
          const now = Date.now();
          const seen = new Set();
          return raw
            .map((r, i) =>
              typeof r === "string"
                ? { id: r, usedAt: now - (i + 1) }
                : { id: r?.id, usedAt: Number(r?.usedAt) || 0 },
            )
            .filter(
              (r) => fieldById.has(r.id) && !seen.has(r.id) && seen.add(r.id),
            )
            .sort((a, b) => b.usedAt - a.usedAt)
            .slice(0, RECENT_MAX);
        },
      };

      /* =========================================================
       * 選擇場域：底部面板（選好測驗後開啟，選場域後進入受測名單）
       * ========================================================= */
      const sheet = $("#sheet");
      const fieldList = $("#fieldList");
      const searchInput = $("#searchInput");
      const searchClear = $("#searchClear");

      const S = {
        open: false,
        test: null,
        selectedId: null,
        query: "",
        lastFocus: null,
      };

      // 搜尋：只比對名稱；不分大小寫，「臺」視同「台」，空白分隔的多個關鍵字都要符合
      const norm = (s) => s.toLowerCase().replace(/臺/g, "台");
      const queryTerms = () => norm(S.query).split(/\s+/).filter(Boolean);

      // 名稱中符合關鍵字的部分用 <mark> 標出（norm 不改變字數，位置可直接對應原文）
      function highlight(name, terms) {
        if (!terms.length) return esc(name);
        const n = norm(name);
        const hit = new Array(name.length).fill(false);
        terms.forEach((t) => {
          for (let i = n.indexOf(t); i !== -1; i = n.indexOf(t, i + 1)) {
            for (let k = i; k < i + t.length; k++) hit[k] = true;
          }
        });
        let html = "";
        for (let i = 0; i < name.length; ) {
          let j = i;
          while (j < name.length && hit[j] === hit[i]) j++;
          const part = esc(name.slice(i, j));
          html += hit[i] ? `<mark>${part}</mark>` : part;
          i = j;
        }
        return html;
      }

      // 排序：用過的依最近使用時間在前，沒用過的在後，沒用過的依名稱排序
      function sortFields(list, recent) {
        const rank = new Map(recent.map((r, i) => [r.id, i]));
        return [...list].sort((a, b) => {
          const ra = rank.get(a.id);
          const rb = rank.get(b.id);
          if (ra !== undefined && rb !== undefined) return ra - rb;
          if (ra !== undefined) return -1;
          if (rb !== undefined) return 1;
          return a.name.localeCompare(b.name, "zh-Hant");
        });
      }

      function fieldRowHTML(f, terms) {
        const sel = f.id === S.selectedId;
        return `
      <div class="frow ${sel ? "is-selected" : ""}" role="radio" aria-checked="${sel}" tabindex="0" data-id="${f.id}">
        <span class="frow-radio"><i class="ti ti-check"></i></span>
        <span class="frow-name">${highlight(f.name, terms)}</span>
        <span class="frow-tag">已選取</span>
      </div>`;
      }

      function renderList() {
        const terms = queryTerms();
        const recent = fieldStore.getRecent();
        let html = "";

        if (!terms.length) {
          // 最近使用：最多 3 個，目前場域排第一
          const cur = fieldStore.getCurrent();
          let ids = recent.map((r) => r.id);
          if (cur && ids.includes(cur.id))
            ids = [cur.id, ...ids.filter((id) => id !== cur.id)];
          const recentFields = ids.slice(0, 3).map((id) => fieldById.get(id));
          if (recentFields.length) {
            html += `<h3 class="sheet-section">最近使用</h3>${recentFields.map((f) => fieldRowHTML(f, terms)).join("")}`;
          }
          const all = sortFields(CONFIG.fields, recent);
          html += `<h3 class="sheet-section">全部場域（${all.length}）</h3>${all.map((f) => fieldRowHTML(f, terms)).join("")}`;
        } else {
          const matched = sortFields(
            CONFIG.fields.filter((f) => {
              const n = norm(f.name);
              return terms.every((t) => n.includes(t));
            }),
            recent,
          );
          if (!matched.length) {
            fieldList.innerHTML = `
      <div class="list-empty">
        <i class="ti ti-map-search"></i>
        <div class="list-empty-title">找不到符合的場域</div>
        <div class="list-empty-sub">試試其他關鍵字</div>
      </div>`;
            return;
          }
          html += `<h3 class="sheet-section">搜尋結果（${matched.length}）</h3>${matched.map((f) => fieldRowHTML(f, terms)).join("")}`;
        }
        fieldList.innerHTML = html;
      }

      function openFieldSheet(test) {
        S.open = true;
        S.test = test;
        S.query = "";
        S.lastFocus = document.activeElement;
        searchInput.value = "";
        searchClear.hidden = true;

        // 當天已有目前場域：自動選取
        const cur = fieldStore.getCurrent();
        S.selectedId = cur ? cur.id : null;
        $("#sheetSub").textContent = `${test.name} · ${test.desc}`;
        renderList();
        fieldList.scrollTop = 0;

        sheet.style.transform = "";
        sheet.classList.add("is-open");
        sheet.setAttribute("aria-hidden", "false");
        document.body.classList.add("sheet-open");
        $("#app").inert = true;
      }

      function closeFieldSheet() {
        if (!S.open) return;
        S.open = false;
        searchInput.blur();
        sheet.style.transform = "";
        sheet.classList.remove("is-open");
        sheet.setAttribute("aria-hidden", "true");
        document.body.classList.remove("sheet-open");
        $("#app").inert = false;
        S.lastFocus?.focus?.({ preventScroll: true });
      }

      function selectField(id) {
        if (S.selectedId === id) return;
        S.selectedId = id;
        fieldList.querySelectorAll(".frow").forEach((row) => {
          const on = row.dataset.id === id;
          row.classList.toggle("is-selected", on);
          row.setAttribute("aria-checked", on);
          // 單選鈕小彈跳
          const radio = row.querySelector(".frow-radio");
          radio.classList.remove("pop");
          if (on) {
            void radio.offsetWidth;
            radio.classList.add("pop");
          }
        });
      }

      function confirmField() {
        const field = fieldById.get(S.selectedId);
        if (!field) {
          fieldList.classList.remove("shake");
          void fieldList.offsetWidth; // 重新觸發動畫
          fieldList.classList.add("shake");
          showToast("請先選擇場域");
          return;
        }
        const { test } = S;
        fieldStore.setCurrent(field.id);
        closeFieldSheet();
        // 等面板關閉動畫結束再進入受測名單
        setTimeout(() => {
          location.href = `roster.html?test=${test.id}&field=${field.id}`;
        }, 350);
      }

      function initFieldSheet() {
        $("#sheetClose").addEventListener("click", closeFieldSheet);
        $("#sheetMask").addEventListener("click", closeFieldSheet);
        $("#sheetConfirm").addEventListener("click", confirmField);
        fieldList.addEventListener("animationend", (e) => {
          if (e.target === fieldList) fieldList.classList.remove("shake");
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && S.open) closeFieldSheet();
        });

        // 點整列 = 選取
        fieldList.addEventListener("click", (e) => {
          const row = e.target.closest(".frow");
          if (row) selectField(row.dataset.id);
        });
        fieldList.addEventListener("keydown", (e) => {
          const row = e.target.closest?.(".frow");
          if (row && e.target === row && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            selectField(row.dataset.id);
          }
        });

        // 搜尋：即時篩選
        searchInput.addEventListener("input", () => {
          S.query = searchInput.value;
          searchClear.hidden = !S.query;
          renderList();
          fieldList.scrollTop = 0;
        });
        searchClear.addEventListener("click", (e) => {
          e.preventDefault();
          searchInput.value = "";
          searchInput.dispatchEvent(new Event("input"));
          searchInput.focus({ preventScroll: true });
        });

        // 拖曳把手區：往下拖跟手移動，放開時超過 120px 關閉，否則彈回
        const grab = $("#sheetGrab");
        let drag = null;
        grab.addEventListener("pointerdown", (e) => {
          if (!S.open || e.target.closest("button")) return;
          drag = { y: e.clientY, dy: 0 };
          grab.setPointerCapture(e.pointerId);
          sheet.classList.add("is-dragging");
        });
        grab.addEventListener("pointermove", (e) => {
          if (!drag) return;
          drag.dy = Math.max(0, e.clientY - drag.y);
          sheet.style.transform = `translateY(${drag.dy}px)`;
        });
        const endDrag = () => {
          if (!drag) return;
          const { dy } = drag;
          drag = null;
          sheet.classList.remove("is-dragging");
          sheet.style.transform = "";
          if (dy > 120 * unitPx()) closeFieldSheet();
        };
        grab.addEventListener("pointerup", endDrag);
        grab.addEventListener("pointercancel", endDrag);

        // 鍵盤彈出時：--vh 為可見高度、--kb 為被鍵盤蓋住的高度，讓面板與底部按鈕保持可見
        const vv = window.visualViewport;
        if (vv) {
          const sync = () => {
            const root = document.documentElement.style;
            root.setProperty("--vh", `${vv.height}px`);
            const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
            root.setProperty("--kb", `${kb}px`);
          };
          vv.addEventListener("resize", sync);
          vv.addEventListener("scroll", sync);
          sync();
        }
      }

      /* =========================================================
       * 影像上傳
       * kf.uploadedDates：已上傳的日期（"YYYY-MM-DD" 陣列），重新整理後不再出現
       * U[date]：{ status: "idle" | "uploading" | "done" | "fail", pct, attempt, timer, removed }
       * ========================================================= */
      const UPLOADED_KEY = "kf.uploadedDates";
      const U = {};
      const up = { open: false, lastFocus: null };

      // 依今天往前推 n 天的日期（本地時間，"YYYY-MM-DD"）
      function isoDaysAgo(n) {
        const d = new Date();
        d.setDate(d.getDate() - n);
        const p = (x) => String(x).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      }
      function getUploaded() {
        try {
          const v = JSON.parse(sessionStorage.getItem(UPLOADED_KEY));
          return Array.isArray(v) ? v : [];
        } catch (e) {
          return [];
        }
      }
      function addUploaded(date) {
        try {
          const list = getUploaded();
          if (!list.includes(date)) list.push(date);
          sessionStorage.setItem(UPLOADED_KEY, JSON.stringify(list));
        } catch (e) {}
      }
      // 尚未上傳（且還沒從列表移除）的日期，由新到舊
      function pendingUploads() {
        const done = getUploaded();
        return CONFIG.uploads
          .filter((u) => !done.includes(u.date) && !U[u.date]?.removed)
          .sort((a, b) => b.date.localeCompare(a.date));
      }
      // 一個日期算 1 筆
      const pendingCount = () => pendingUploads().length;
      const isUploading = () =>
        Object.values(U).some((s) => s.status === "uploading");

      // 「11 月 12 日」
      function dayLabel(iso) {
        const [, m, d] = iso.split("-").map(Number);
        return `${m} 月 ${d} 日`;
      }

      function upRowHTML(u) {
        return `
      <div class="up-row" data-date="${u.date}">
        <span class="up-ico"><i class="ti ti-calendar"></i></span>
        <div class="up-main">
          <div class="up-date">${dayLabel(u.date)}</div>
          <div class="up-status"></div>
          <div class="up-bar"><div class="up-fill"></div></div>
        </div>
        <button class="up-btn" type="button"></button>
      </div>`;
      }

      // 依狀態更新一列（文字、進度條、按鈕）
      function renderUpRow(date) {
        const row = $(`#upBody .up-row[data-date="${date}"]`);
        if (!row) return;
        const s = U[date];
        const status = row.querySelector(".up-status");
        const bar = row.querySelector(".up-bar");
        const fill = row.querySelector(".up-fill");
        const btn = row.querySelector(".up-btn");
        // 進度每次更新只改文字和進度條；狀態改變時才重畫按鈕（避免載入圖示的旋轉重新開始）
        const changed = row.dataset.state !== s.status;
        row.dataset.state = s.status;
        row.classList.toggle("is-fail", s.status === "fail");
        const setBtn = (cls, html) => {
          if (!changed) return;
          btn.className = `up-btn${cls ? " " + cls : ""}`;
          btn.innerHTML = html;
        };
        if (s.status === "idle") {
          status.textContent = ""; // 待上傳不顯示第二行，日期垂直置中（見 CSS）
          bar.classList.remove("is-on");
          setBtn("", '<i class="ti ti-cloud-upload"></i>上傳');
        } else if (s.status === "uploading") {
          status.textContent = `上傳中 ${Math.floor(s.pct)}%`;
          bar.classList.add("is-on");
          fill.style.width = `${s.pct}%`;
          setBtn("is-busy", '<i class="ti ti-loader-2 spin"></i>上傳中');
        } else if (s.status === "done") {
          status.textContent = "已上傳";
          bar.classList.add("is-on");
          fill.style.width = "100%";
          setBtn("is-done", '<i class="ti ti-circle-check"></i>已上傳');
        } else {
          status.innerHTML = '<i class="ti ti-alert-circle"></i>上傳失敗';
          setBtn("is-retry", '<i class="ti ti-refresh"></i>重新上傳');
          // 進度條停在失敗的位置，0.6 秒後淡出
          if (changed)
            setTimeout(() => {
              if (U[date].status === "fail") bar.classList.remove("is-on");
            }, 600);
        }
      }

      function shakeRow(date) {
        const row = $(`#upBody .up-row[data-date="${date}"]`);
        if (!row) return;
        row.classList.remove("shake");
        void row.offsetWidth;
        row.classList.add("shake");
        row.addEventListener("animationend", () => row.classList.remove("shake"), {
          once: true,
        });
      }

      // 總數：數字變化時往下跑
      function setUpNum(n, animate = true) {
        const el = $("#upNum");
        if (el.dataset.n === String(n)) return;
        el.dataset.n = n;
        const old = el.querySelector(".roll-cur");
        const nw = document.createElement("span");
        nw.className = `roll-cur${animate && old ? " roll-in" : ""}`;
        nw.textContent = n;
        if (old && animate) {
          old.className = "roll-out";
          old.setAttribute("aria-hidden", "true"); // 滑出中的舊數字不給讀屏念
          setTimeout(() => old.remove(), 460);
        } else if (old) old.remove();
        el.appendChild(nw);
      }

      // 總數列、空狀態、首頁數字一起更新
      function renderUpTotals(animate = true) {
        const n = pendingCount();
        const allDone = pendingUploads().length === 0;
        $("#upTotal").hidden = allDone;
        $("#upTotalDone").hidden = !allDone;
        if (!allDone) setUpNum(n, animate);
        if (allDone && !$("#upBody .up-empty")) {
          $("#upBody").innerHTML = `
      <div class="up-empty">
        <i class="ti ti-cloud-check"></i>
        <div class="up-empty-title">所有鑑測都已上傳</div>
        <div class="up-empty-sub">新的鑑測完成後會出現在這裡</div>
      </div>`;
        }
        $("#statPending").textContent = n;
        renderSync();
      }

      function renderUpList() {
        const list = pendingUploads();
        list.forEach((u) => {
          U[u.date] ??= { status: "idle", pct: 0, attempt: 0, removed: false };
        });
        $("#upBody").innerHTML = list.length
          ? `<div class="up-card">${list.map(upRowHTML).join("")}</div>`
          : "";
        list.forEach((u) => renderUpRow(u.date));
        renderUpTotals(false);
      }

      /* 模擬上傳：約 3～5 秒從 0% 到 100%，速度忽快忽慢
       * TODO：之後改成實際上傳 API，例如
       *   uploadExams(date, {
       *     onProgress: (pct) => { U[date].pct = pct; renderUpRow(date); },  // 進度回呼
       *   }).then(() => uploadSucceeded(date))
       *     .catch((err) => uploadFailed(date, err));                         // 失敗處理
       */
      function startUpload(date) {
        const u = CONFIG.uploads.find((x) => x.date === date);
        const s = U[date];
        if (!u || s.status === "uploading" || s.status === "done") return;
        const wasFail = s.status === "fail";
        s.status = "uploading";
        s.pct = 0;
        s.attempt += 1;
        const willFail = u.failOnce && s.attempt === 1;
        const failAt = 56 + Math.random() * 8; // 約 60% 時失敗
        renderUpRow(date);
        if (wasFail) shakeRow(date);
        renderSync();

        const tick = () => {
          // 偶爾停頓、偶爾衝快一點
          const r = Math.random();
          s.pct += r < 0.15 ? 0.4 : r < 0.85 ? 2 + Math.random() * 3 : 6 + Math.random() * 4;
          if (willFail && s.pct >= failAt) {
            s.pct = failAt;
            renderUpRow(date);
            return uploadFailed(date);
          }
          if (s.pct >= 100) {
            s.pct = 100;
            return uploadSucceeded(date);
          }
          renderUpRow(date);
          s.timer = setTimeout(tick, 110 + Math.random() * 90);
        };
        s.timer = setTimeout(tick, 150);
      }

      function uploadSucceeded(date) {
        U[date].status = "done";
        addUploaded(date);
        renderUpRow(date);
        renderSync();
        if (!up.open) showToast(`${dayLabel(date)}已上傳`);
        // 1.2 秒後淡出並收合，從列表移除，總數往下跑
        setTimeout(() => {
          const row = $(`#upBody .up-row[data-date="${date}"]`);
          const finish = () => {
            row?.remove();
            U[date].removed = true;
            renderUpTotals();
          };
          if (!row) return finish();
          row.style.height = `${row.offsetHeight}px`;
          void row.offsetHeight;
          row.classList.add("is-leaving");
          row.style.height = "0px";
          setTimeout(finish, 420);
        }, 1200);
      }

      function uploadFailed(date) {
        U[date].status = "fail";
        renderUpRow(date);
        shakeRow(date);
        renderSync();
        if (!up.open) showToast(`${dayLabel(date)}上傳失敗，請重新上傳`);
      }

      function openUpSheet() {
        if (up.open || S.open) return;
        up.open = true;
        up.lastFocus = document.activeElement;
        const sheet = $("#upSheet");
        $("#upBody").scrollTop = 0;
        sheet.style.transform = "";
        sheet.classList.add("is-open");
        sheet.setAttribute("aria-hidden", "false");
        document.body.classList.add("sheet-open", "up-open");
        $("#app").inert = true;
      }

      // 有日期正在上傳時也可以關閉，上傳在背景繼續
      function closeUpSheet() {
        if (!up.open) return;
        up.open = false;
        const sheet = $("#upSheet");
        sheet.style.transform = "";
        sheet.classList.remove("is-open");
        sheet.setAttribute("aria-hidden", "true");
        document.body.classList.remove("sheet-open", "up-open");
        $("#app").inert = false;
        up.lastFocus?.focus?.({ preventScroll: true });
      }

      function initUpload() {
        renderUpList();
        $("#syncCard").addEventListener("click", openUpSheet);
        $("#upClose").addEventListener("click", closeUpSheet);
        $("#upMask").addEventListener("click", closeUpSheet);
        $("#upBody").addEventListener("click", (e) => {
          const btn = e.target.closest(".up-btn");
          if (btn) startUpload(btn.closest(".up-row").dataset.date);
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && up.open) closeUpSheet();
        });

        // 拖曳把手區：往下拖跟手移動，放開時超過 120px 關閉，否則彈回
        const sheet = $("#upSheet");
        const grab = $("#upGrab");
        let drag = null;
        grab.addEventListener("pointerdown", (e) => {
          if (!up.open || e.target.closest("button")) return;
          drag = { y: e.clientY, dy: 0 };
          grab.setPointerCapture(e.pointerId);
          sheet.classList.add("is-dragging");
        });
        grab.addEventListener("pointermove", (e) => {
          if (!drag) return;
          drag.dy = Math.max(0, e.clientY - drag.y);
          sheet.style.transform = `translateY(${drag.dy}px)`;
        });
        const endDrag = () => {
          if (!drag) return;
          const { dy } = drag;
          drag = null;
          sheet.classList.remove("is-dragging");
          sheet.style.transform = "";
          if (dy > 120 * unitPx()) closeUpSheet();
        };
        grab.addEventListener("pointerup", endDrag);
        grab.addEventListener("pointercancel", endDrag);
      }

      /* ===== 啟動 ===== */
      renderNav();
      if ($("#testList")) {
        renderHero();
        renderTests();
        initUpload(); // 會一併更新影像上傳卡
        initFieldSheet();
      }
    </script>
  </body>
</html>
