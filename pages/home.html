<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="../img/logo.png" />
    <link rel="apple-touch-icon" href="../img/logo.png" />
    <title>建豐健康科技 - 鑑測首頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css"
    />
    <!-- 共用選擇場域面板（新增／編輯自訂場域）：與鑑測紀錄、受測者頁共用 -->
    <link rel="stylesheet" href="../css/field-sheet.css" />
    <script src="../js/fields.js"></script>
    <script src="../js/field-sheet.js"></script>
    <!-- 共用底部導覽（鑑測｜紀錄｜上傳｜受測者｜設定） -->
    <link rel="stylesheet" href="../css/nav.css" />
    <script src="../js/nav.js"></script>
    <!-- 共用語系選擇（Language 按鈕＋滾輪彈窗）：與詳細頁共用 -->
    <link rel="stylesheet" href="../css/wheel.css" />
    <link rel="stylesheet" href="../css/lang-picker.css" />
    <script src="../js/wheel.js"></script>
    <script src="../js/lang-picker.js"></script>
    <style>
      /* =========================================================
       * 瓷白森林 Porcelain Forest — 專為 iPad 13 吋直式（1032 × 1376）設計
       * ========================================================= */
      :root {
        --bg: #ece7df; /* 暖瓷白：頁面底色 */
        --card: #f7f4ee; /* 卡片底色 */
        --card-deep: #e6dccb; /* 圖示底 */
        --line: #d9cfbe; /* 邊框 */
        --line-soft: #c7bba6; /* 虛線、未選中指示點 */
        --forest: #1f3b33; /* 森林綠：主色 */
        --brass: #b08d57; /* 黃銅：重點色 */
        --brass-text: #8f6e3c; /* 淺底上的黃銅文字（較深，比較清楚） */
        --ink: #1a2420; /* 主要文字 */
        --muted: #6f6656; /* 次要文字（加深，提升清晰度） */
        --nav-off: #6f6656; /* 導航未選中 */
        --on-forest: #f6f1e8; /* 森林綠上的文字 */

        --font-sans: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
        --font-serif: "Noto Serif TC", "Songti TC", serif;
        /* 縮放單位：iPad 13 吋直式（1032 × 1376）時 1 --u = 1px；較小的 iPad 依「寬度」與「高度 × 0.75」中較小者等比縮小 */
        --u: calc(min(100vw, 100dvh * 0.75) / 1032);
        /* 橫式等內容比 1032 --u 寬時，左右各留白這麼多，內容置中 */
        --gutter: max(0px, calc((100vw - 1032 * var(--u)) / 2));
        /* 字級：四頁共用，同一種用途用同一個變數（其他字級以這些變數加減或倍數表示）
         * 大小順序：small < body < button < lead < title < display；card-name、hero-num 為大字專用 */
        --fs-display: max(16px, calc(72 * var(--u))); /* 頁面大標題：問候語、登入、場域名稱、受測者管理 */
        --fs-hero-num: max(16px, calc(88 * var(--u))); /* 大數字：進度數字 */
        --fs-card-name: max(16px, calc(84 * var(--u))); /* 測驗卡片名稱 */
        --fs-title: max(16px, calc(44 * var(--u))); /* 面板與對話框標題 */
        --fs-lead: max(16px, calc(32 * var(--u))); /* 重要內文：人員姓名、場域名稱、欄位輸入文字、影像上傳標題 */
        --fs-button: max(18px, calc(30 * var(--u))); /* 按鈕文字、導航文字、toast */
        --fs-body: max(16px, calc(26 * var(--u))); /* 一般內文、說明、欄位標籤、分段切換、搜尋框 */
        --fs-small: max(16px, calc(24 * var(--u))); /* 輔助小字：日期、編號・年齡・性別、時間、徽章、小標籤、錯誤訊息 */

        --pad: calc(64 * var(--u));
        /* 語系選擇（css/lang-picker.css）的尺寸單位：13 吋上 2px，小螢幕最少 1px */
        --lp-u: max(1px, calc(2 * var(--u)));
        --lp-dialog-w: min(max(calc(640 * var(--u)), 320px), calc(100vw - 40px)); /* 語系對話框：13 吋約 640 */
        --lp-dialog-r: max(20px, calc(40 * var(--u)));
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        overflow-x: hidden;
      }
      .serif {
        font-family: var(--font-serif);
      }
      /* 表單元素與 placeholder 繼承頁面字型（瀏覽器預設不會繼承） */
      input,
      textarea,
      select,
      input::placeholder,
      textarea::placeholder {
        font: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
      }

      /* 進場動畫 */
      .rise {
        animation: rise 0.9s calc(var(--d, 0) * 1s) var(--ease-out) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(calc(40 * var(--u)));
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== App 外層：開啟場域面板時整個退到後面（iOS 卡片式視窗） ===== */
      body.sheet-open {
        background: var(--ink);
      }
      .app {
        position: fixed;
        inset: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--bg);
        transform-origin: 50% 50%;
        transition:
          transform 0.5s var(--ease-out),
          border-radius 0.5s var(--ease-out),
          filter 0.5s var(--ease-out);
      }
      body.sheet-open .app {
        transform: scale(0.94);
        border-radius: calc(40 * var(--u));
        filter: brightness(0.9);
        overflow: hidden;
      }

      /* ===== 版面 ===== */
      /* 整頁剛好一個畫面高：頁首那一列在上，底部留 --nav-clear（css/nav.css：導覽列＋往上凸出的上傳圓鈕）
       * 中間的 .stage 放「問候語＋兩張卡」，整組在兩者之間垂直置中（上下留白相等） */
      .home {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: calc(calc(56 * var(--u)) + env(safe-area-inset-top)) var(--gutter) var(--nav-clear);
      }
      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: max(24px, calc(24 * var(--u))) 0; /* 整組上下至少留這麼多 */
      }
      /* 整組寬度跟著卡片列：卡片依高度縮小時，問候語和卡片一起水平置中、左緣對齊 */
      .stage-group {
        --card-gap: calc(28 * var(--u));
        width: 100%;
        max-width: calc(2 * var(--card-w, 10000px) + var(--card-gap) + 2 * var(--pad));
        margin: 0 auto;
      }
      /* 窄螢幕：兩張卡上下排列，頁面可以垂直捲動 */
      @media (max-width: 599px) {
        .home {
          height: auto;
          min-height: 100dvh;
        }
      }

      /* 頂部：第一列 Logo＋日期（左）、Language 按鈕（右，js/lang-picker.js）；第二列問候語 */
      .hero {
        padding: 0 var(--pad);
      }
      .hero-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: calc(24 * var(--u));
      }
      .brand-row {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: calc(22 * var(--u));
      }
      .brand-row .logo {
        flex-shrink: 0;
      }
      .logo {
        width: calc(84 * var(--u));
        height: calc(84 * var(--u));
        padding: calc(12 * var(--u));
        border-radius: calc(24 * var(--u));
        background: var(--card);
        border: 2px solid var(--line);
        object-fit: contain;
      }
      /* 日期：放不下時只在「·」處換行（「11月18日」／「星期三」），換行後行首的「·」藏在左側被裁掉 */
      .hero-date {
        min-width: 0;
        overflow: hidden;
        font-size: max(16px, calc(var(--fs-small) + calc(4 * var(--u))));
        letter-spacing: 0.12em;
        color: var(--muted);
        font-weight: 500;
      }
      .hero-date-in {
        --sep: 1.4em;
        display: flex;
        flex-wrap: wrap;
        margin-left: calc(-1 * var(--sep));
      }
      .hero-date-part {
        white-space: nowrap;
      }
      .hero-date-part::before {
        content: "·";
        display: inline-block;
        width: var(--sep);
        text-align: center;
        letter-spacing: 0;
      }
      /* 右側按鈕：「回到一體機」＋ Language（同樣的淺底膠囊） */
      .hero-actions {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: calc(12 * var(--u));
      }
      .kiosk-back {
        text-decoration: none;
      }
      /* 窄螢幕：「回到一體機」只顯示圖示（保留 aria-label） */
      @media (max-width: 599px) {
        .kiosk-back {
          width: 44px;
          padding: 0;
        }
        .kiosk-back-text {
          display: none;
        }
      }
      .hero-title {
        margin: 0;
        padding: 0 var(--pad);
        font-size: max(16px, calc(var(--fs-display) + calc(4 * var(--u))));
        font-weight: 600;
        line-height: 1.22;
      }
      /* 測驗卡片：固定比例 4:5、等寬等高並排，整列水平置中；窄螢幕上下排列、滿寬、3:2
       * 卡片寬度 --card-w 由 fitCards() 依可用空間計算：min((內容寬 − 間距) ÷ 2, 可用高度 × 4/5) */
      .tests {
        margin-top: calc(48 * var(--u)); /* 問候語與卡片的間距（原本的設計值） */
        display: grid;
        grid-template-columns: repeat(2, var(--card-w, minmax(0, 1fr)));
        justify-content: center;
        gap: var(--card-gap);
        padding: 0 var(--pad);
      }
      .test-card {
        min-width: 0;
        aspect-ratio: 4 / 5;
        position: relative;
        overflow: hidden;
        border-radius: calc(48 * var(--u));
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--ink);
        padding: calc(44 * var(--u));
        display: flex;
        flex-direction: column;
        text-align: left;
        transition:
          background 0.6s var(--ease-out),
          color 0.6s var(--ease-out),
          border-color 0.6s,
          transform 0.25s var(--ease-out);
      }
      @media (max-width: 599px) {
        .tests {
          grid-template-columns: minmax(0, 1fr);
        }
        .test-card {
          aspect-ratio: 3 / 2;
        }
      }
      .test-card:active {
        transform: scale(0.97);
      }
      .test-card:focus-visible {
        outline: 3px solid var(--brass);
        outline-offset: 4px;
      }
      .test-card .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: calc(8 * var(--u));
      }
      /* 產出標籤不換行（並排後卡片變窄，避免「告」單獨掉到第二行） */
      .test-card .no {
        white-space: nowrap;
        font-size: max(16px, calc(var(--fs-small) + calc(4 * var(--u))));
        font-weight: 700;
        color: var(--brass-text);
        transition: color 0.6s;
      }
      .test-card .no em {
        font-style: normal;
        font-weight: 500;
        color: var(--muted);
        margin-right: calc(12 * var(--u));
        padding-right: calc(12 * var(--u));
        border-right: 2px solid var(--line-soft);
        transition:
          color 0.6s,
          border-color 0.6s;
      }
      .test-card .top i {
        font-size: max(16px, calc(var(--fs-body) * 2));
        color: var(--forest);
        transition: color 0.6s;
      }
      /* 主標題：兩張卡同字級；放不下時只在 <wbr> 處換行（最多兩行），不截斷 */
      .test-card .name {
        margin-top: auto;
        padding-top: calc(24 * var(--u));
        font-size: max(16px, calc(var(--fs-card-name) - calc(4 * var(--u))));
        line-height: 1.15;
        font-weight: 600;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      .test-card .desc {
        margin-top: calc(10 * var(--u));
        font-size: max(16px, var(--fs-lead));
        font-weight: 500;
        color: var(--muted);
        transition: color 0.6s;
      }
      /* 開始測驗：只在選取的卡上顯示；未選取的卡保留位置（visibility: hidden），兩張卡的標題、副標題才會對齊 */
      .test-card .start {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: calc(14 * var(--u));
        border-radius: calc(999 * var(--u));
        background: var(--brass);
        color: var(--forest);
        font-size: max(18px, calc(var(--fs-button) + calc(4 * var(--u))));
        font-weight: 700;
        padding: calc(24 * var(--u)) calc(44 * var(--u));
        margin-top: calc(32 * var(--u));
        opacity: 0;
        visibility: hidden;
        transform: translateY(calc(12 * var(--u)));
        transition:
          opacity 0.5s var(--ease-out),
          transform 0.5s var(--ease-out),
          visibility 0.5s;
      }
      .test-card .start i {
        font-size: 1.0588em;
      }

      /* 選取的卡：森林綠 */
      .test-card.is-active {
        background: var(--forest);
        border-color: var(--forest);
        color: var(--on-forest);
      }
      .test-card.is-active .no {
        color: var(--brass);
      }
      .test-card.is-active .no em {
        color: rgba(246, 241, 232, 0.75);
        border-color: rgba(246, 241, 232, 0.35);
      }
      .test-card.is-active .top i {
        color: var(--brass);
      }
      .test-card.is-active .desc {
        color: rgba(246, 241, 232, 0.88);
      }
      .test-card.is-active .start {
        opacity: 1;
        visibility: visible;
        transform: none;
        animation: halo 2.4s 1.2s ease-out infinite;
      }
      @keyframes halo {
        from {
          box-shadow: 0 0 0 0 rgba(176, 141, 87, 0.55);
        }
        to {
          box-shadow: 0 0 0 calc(22 * var(--u)) rgba(176, 141, 87, 0);
        }
      }
      .test-card.is-active::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 45%;
        background: linear-gradient(
          100deg,
          transparent,
          rgba(255, 255, 255, 0.14),
          transparent
        );
        transform: translateX(-120%) skewX(-12deg);
        animation: sheen 7s 1.5s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes sheen {
        0% {
          transform: translateX(-120%) skewX(-12deg);
        }
        28%,
        100% {
          transform: translateX(330%) skewX(-12deg);
        }
      }

      /* =========================================================
       * 選擇場域：底部面板（單一固定高度）
       * --vh：可見高度；--kb：鍵盤高度（皆由 visualViewport 更新）
       * ========================================================= */
      .sheet-mask {
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 26, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s var(--ease-out);
        z-index: 200;
      }
      body.sheet-open:not(.up-open) .sheet-mask {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet {
        position: fixed;
        left: var(--gutter); /* 橫式時面板寬度和內容一致，置中 */
        right: var(--gutter);
        bottom: var(--kb, 0px);
        height: calc(var(--vh, 100dvh) - calc(120 * var(--u)));
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border-radius: calc(48 * var(--u)) calc(48 * var(--u)) 0 0;
        box-shadow: 0 calc(-12 * var(--u)) calc(40 * var(--u)) rgba(31, 59, 51, 0.12);
        transform: translateY(calc(100% + var(--kb, 0px) + calc(40 * var(--u))));
        visibility: hidden;
        transition:
          transform 0.5s var(--ease-out),
          height 0.45s var(--ease-out),
          visibility 0s 0.5s;
        z-index: 210;
        user-select: none;
        -webkit-user-select: none;
      }
      .sheet.is-open {
        transform: translateY(0);
        visibility: visible;
        transition:
          transform 0.5s var(--ease-out),
          height 0.45s var(--ease-out),
          visibility 0s;
      }
      .sheet.is-dragging {
        transition: none;
      }
      /* 面板開啟時 toast 稍微上移，停在面板頂端（calc(120 * var(--u))）上方的空間，不與面板重疊 */
      body.sheet-open .toast {
        top: calc(calc(20 * var(--u)) + env(safe-area-inset-top));
      }

      /* 頂部：拖曳把手＋標題（整塊都可往下拖曳關閉） */
      .sheet-grab {
        flex: 0 0 auto;
        padding: calc(16 * var(--u)) calc(56 * var(--u)) calc(8 * var(--u));
        touch-action: none;
        cursor: grab;
      }
      .grab-bar {
        display: block;
        width: calc(64 * var(--u));
        height: calc(8 * var(--u));
        margin: 0 auto;
        border-radius: calc(4 * var(--u));
        background: var(--line-soft);
      }
      .sheet-head {
        margin-top: calc(16 * var(--u));
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: calc(24 * var(--u));
      }
      .sheet-title {
        margin: 0;
        font-size: max(16px, calc(var(--fs-title) + calc(12 * var(--u))));
        line-height: 1.2;
        font-weight: 600;
      }
      .sheet-sub {
        margin-top: calc(4 * var(--u));
        font-size: max(16px, var(--fs-body));
        color: var(--muted);
        font-weight: 500;
      }
      .sheet-close {
        flex: 0 0 auto;
        width: max(44px, calc(72 * var(--u)));
        height: max(44px, calc(72 * var(--u)));
        border-radius: 50%;
        background: var(--card);
        border: 2px solid var(--line);
        display: grid;
        place-items: center;
        font-size: max(16px, calc(var(--fs-lead) * 1.125));
        color: var(--ink);
        transition: transform 0.2s var(--ease-out);
      }
      .sheet-close:active {
        transform: scale(0.92);
      }
@keyframes shake {
        0%,
        100% {
          transform: none;
        }
        20% {
          transform: translateX(calc(-14 * var(--u)));
        }
        40% {
          transform: translateX(calc(12 * var(--u)));
        }
        60% {
          transform: translateX(calc(-8 * var(--u)));
        }
        80% {
          transform: translateX(calc(4 * var(--u)));
        }
      }

/* =========================================================
       * 影像上傳：底部面板（高度依內容，最高 var(--vh) - calc(120 * var(--u))；清單區可捲動）
       * ========================================================= */
      .up-mask {
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 26, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s var(--ease-out);
        z-index: 200;
      }
      body.up-open .up-mask {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet.up-sheet {
        height: auto;
        max-height: calc(var(--vh, 100dvh) - calc(120 * var(--u)));
      }
      .up-total {
        margin-top: calc(16 * var(--u));
        min-height: calc(64 * var(--u));
        display: flex;
        align-items: baseline;
        gap: calc(10 * var(--u));
        font-size: max(16px, var(--fs-body));
        color: var(--muted);
      }
      .up-total[hidden] {
        display: none;
      }
      .up-total.is-done {
        align-items: center;
        color: var(--forest);
        font-weight: 700;
      }
      /* 總數：數字變化時舊的往下滑出、新的從上方滑入 */
      .up-num {
        position: relative;
        display: inline-block;
        overflow: hidden;
        font-size: max(16px, calc(var(--fs-hero-num) * 0.6));
        font-weight: 600;
        line-height: 1.15;
        color: var(--brass);
        font-variant-numeric: tabular-nums;
      }
      .up-num .roll-in {
        display: inline-block;
        animation: rollIn 0.45s var(--ease-out);
      }
      .up-num .roll-out {
        position: absolute;
        left: 0;
        top: 0;
        animation: rollOut 0.45s var(--ease-out) forwards;
      }
      @keyframes rollIn {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
      }
      @keyframes rollOut {
        to {
          transform: translateY(100%);
          opacity: 0;
        }
      }
      .up-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: calc(32 * var(--u)) calc(56 * var(--u)) calc(calc(40 * var(--u)) + env(safe-area-inset-bottom));
      }
      .up-card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: calc(40 * var(--u));
        overflow: hidden;
      }
      .up-row {
        min-height: calc(128 * var(--u));
        padding: calc(18 * var(--u)) calc(32 * var(--u));
        display: flex;
        align-items: center;
        gap: calc(24 * var(--u));
        transition:
          background 0.3s,
          box-shadow 0.3s;
      }
      .up-row + .up-row {
        border-top: 2px solid #e6dfd2;
      }
      .up-row.shake {
        animation: shake 0.4s var(--ease-out);
      }
      /* 失敗：淡紅底＋左側 2px 紅色內邊線（不改變尺寸） */
      .up-row.is-fail {
        background: rgba(181, 71, 58, 0.06);
        box-shadow: inset 2px 0 0 #b5473a;
      }
      /* 成功後收合移除 */
      .up-row.is-leaving {
        min-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        opacity: 0;
        overflow: hidden;
        transition:
          height 0.4s var(--ease-out),
          min-height 0.4s var(--ease-out),
          padding 0.4s var(--ease-out),
          opacity 0.4s var(--ease-out);
      }
      .up-ico {
        flex: 0 0 auto;
        width: calc(72 * var(--u));
        height: calc(72 * var(--u));
        border-radius: calc(22 * var(--u));
        background: var(--card-deep);
        display: grid;
        place-items: center;
        font-size: max(16px, calc(var(--fs-lead) * 1.125));
        color: var(--brass-text);
      }
      /* 日期、第二行、進度條固定佔位，列高不跳動；
       * 待上傳（沒有第二行）時整組往下移，讓日期在列中垂直置中 */
      .up-main {
        flex: 1;
        min-width: 0;
        transition: transform 0.3s var(--ease-out);
      }
      .up-row[data-state="idle"] .up-main {
        /* 往下移 =（第二行高度 + 間距 4 + 進度條 20）÷ 2 */
        transform: translateY(calc((var(--fs-small) * 1.3 + calc(24 * var(--u))) / 2));
      }
      .up-date {
        font-size: max(16px, var(--fs-lead));
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
      }
      .up-status {
        margin-top: calc(4 * var(--u));
        height: calc(var(--fs-small) * 1.3);
        display: flex;
        align-items: center;
        gap: calc(6 * var(--u));
        font-size: max(16px, var(--fs-small));
        line-height: 1.3;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        transition: opacity 0.3s var(--ease-out);
      }
      .up-row[data-state="idle"] .up-status {
        opacity: 0;
      }
      .up-row.is-fail .up-status {
        color: #b5473a;
      }
      .up-status i {
        font-size: 1.15em;
      }
      /* 進度條：固定佔位，避免出現時列高跳動 */
      .up-bar {
        margin-top: calc(10 * var(--u));
        height: calc(10 * var(--u));
        border-radius: calc(5 * var(--u));
        background: var(--card-deep);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .up-bar.is-on {
        opacity: 1;
      }
      .up-fill {
        width: 0;
        height: 100%;
        border-radius: calc(5 * var(--u));
        background: var(--forest);
        transition:
          width 0.25s linear,
          background 0.3s;
      }
      .up-row.is-fail .up-fill {
        background: #b5473a;
      }
      .up-btn {
        flex: 0 0 auto;
        height: max(44px, calc(76 * var(--u)));
        padding: 0 calc(34 * var(--u));
        border-radius: calc(999 * var(--u));
        border: 2px solid transparent;
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(18px, var(--fs-button));
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: calc(10 * var(--u));
        white-space: nowrap;
        transition: transform 0.2s var(--ease-out);
      }
      .up-btn i {
        font-size: 1.1em;
      }
      .up-btn:active {
        transform: scale(0.95);
      }
      .up-btn.is-busy {
        background: var(--card-deep);
        color: var(--muted);
        pointer-events: none;
      }
      .up-btn.is-done {
        background: rgba(176, 141, 87, 0.16);
        color: var(--brass-text);
        pointer-events: none;
      }
      .up-btn.is-done i {
        animation: radioPop 0.35s var(--ease-spring);
      }
      .up-btn.is-retry {
        background: transparent;
        border-color: #b5473a;
        color: #b5473a;
      }
      .spin {
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* 全部上傳完成 */
      .up-empty {
        padding: calc(72 * var(--u)) 0 calc(48 * var(--u));
        text-align: center;
      }
      .up-empty i {
        font-size: max(16px, calc(var(--fs-lead) * 2));
        color: var(--forest);
      }
      .up-empty-title {
        margin-top: calc(16 * var(--u));
        font-size: max(16px, calc(var(--fs-body) + calc(4 * var(--u))));
        font-weight: 700;
      }
      .up-empty-sub {
        margin-top: calc(8 * var(--u));
        font-size: max(16px, var(--fs-small));
        color: var(--muted);
      }

      /* ===== 提示訊息 ===== */
      .toast {
        position: fixed;
        left: 50%;
        top: calc(calc(36 * var(--u)) + env(safe-area-inset-top));
        transform: translate(-50%, calc(-24 * var(--u)));
        padding: calc(22 * var(--u)) calc(40 * var(--u));
        border-radius: calc(999 * var(--u));
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(18px, var(--fs-button));
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: all 0.35s var(--ease-spring);
        z-index: 300;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <main class="home">
        <!-- 頁首：Logo、日期、Language 按鈕 -->
        <header class="hero">
          <div class="hero-top rise" style="--d: 0.05">
            <div class="brand-row">
              <img class="logo" src="../img/logo.png" alt="建豐健康科技" />
              <div class="hero-date" id="heroDate"></div>
            </div>
            <div class="hero-actions">
              <!-- 回到一體機：kiosk.html 依 sessionStorage「kf.kioskLayout」顯示上次的版本 -->
              <a class="lp-btn lp-btn--light kiosk-back" href="kiosk.html" aria-label="回到一體機"><i class="ti ti-device-desktop" aria-hidden="true"></i><span class="kiosk-back-text">回到一體機</span></a>
              <!-- 語系選擇（js/lang-picker.js）：目前首頁尚未翻譯，按確定只寫入 sessionStorage「kf.lang」 -->
              <div id="heroLang"></div>
            </div>
          </div>
        </header>

        <!-- 問候語＋兩張測驗卡：一組，在頁首與導覽列之間垂直置中 -->
        <section class="stage" id="stage">
          <div class="stage-group">
            <h1 class="hero-title serif rise" style="--d: 0.1" id="heroTitle"></h1>
            <div class="tests rise" style="--d: 0.25" id="testList"></div>
          </div>
        </section>

      </main>

      <nav class="nav" id="nav"></nav>
    </div>

    <!-- 選擇場域：底部面板（內容由 js/field-sheet.js 產生） -->
    <div class="sheet-mask" id="sheetMask"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></section>

    <!-- 影像上傳：底部面板 -->
    <div class="up-mask" id="upMask"></div>
    <section
      class="sheet up-sheet"
      id="upSheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="upTitle"
      aria-hidden="true"
    >
      <div class="sheet-grab" id="upGrab">
        <span class="grab-bar"></span>
        <header class="sheet-head">
          <h2 class="sheet-title serif" id="upTitle">影像上傳</h2>
          <button class="sheet-close" id="upClose" type="button" aria-label="關閉">
            <i class="ti ti-x"></i>
          </button>
        </header>
        <div class="up-total" id="upTotal" aria-live="polite">
          <span>共</span><span class="up-num serif" id="upNum"></span><span>筆待上傳</span>
        </div>
        <div class="up-total is-done" id="upTotalDone" hidden>全部已上傳</div>
      </div>
      <div class="up-body" id="upBody"></div>
    </section>

    <div class="toast" id="toast"></div>

    <script>
      /* =========================================================
       * 設定區：單位名稱、測驗項目、導航都在這裡改，介面會自動更新
       * ========================================================= */
      const CONFIG = {
        unitName: "建豐健康科技",

        // 待上傳的鑑測（假資料，日期依今天自動產生）
        // TODO：之後改成從設備本機或 API 讀取
        // 一個日期算 1 筆；failOnce：第一次上傳一定失敗、第二次起成功（示範失敗畫面用）
        uploads: [
          { date: isoDaysAgo(0), failOnce: false },
          { date: isoDaysAgo(1), failOnce: true },
          { date: isoDaysAgo(3), failOnce: false },
          { date: isoDaysAgo(6), failOnce: false },
        ],

        // 測驗項目：新增測驗只要在這裡加一筆
        tests: [
          {
            id: "sppb",
            name: "簡易身體功能評估",
            wrapAt: 4, // 放不下時只在第 4 字後換行：簡易身體／功能評估
            desc: "SPPB",
            output: "跌倒風險評估",
            icon: "ti-activity",
          },
          {
            id: "gait",
            name: "行走測驗",
            desc: "步態分析",
            output: "步速與步態報告",
            icon: "ti-walk",
          },
          // { id: "grip", name: "握力測驗", desc: "上肢肌力", output: "握力評估", icon: "ti-hand-grab" },
        ],


      };

      /* =========================================================
       * 共用功能
       * ========================================================= */
      const $ = (sel) => document.querySelector(sel);
      // 1 個 --u 實際是幾 px（iPad 13 吋直式 = 1）；拖曳關閉距離等 JS 裡的尺寸用它換算
      function unitPx() {
        let probe = document.getElementById("__unit");
        if (!probe) {
          probe = document.createElement("div");
          probe.id = "__unit";
          probe.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;width:calc(1000 * var(--u));height:0";
          document.body.appendChild(probe);
        }
        return probe.offsetWidth / 1000;
      }

      let toastTimer;
      function showToast(msg) {
        const el = $("#toast");
        if (!el) return;
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
      }

      // 底部導覽：共用的 js/nav.js（renderNav、setNavBadge、setUploadPending）

      /* =========================================================
       * 首頁
       * ========================================================= */
      function renderHero() {
        const now = new Date();
        const week = "日一二三四五六"[now.getDay()];
        // 阿拉伯數字、不補零，例如 1月5日；「·」由 CSS 產生，放不下時只在這裡換行
        $("#heroDate").innerHTML =
          `<span class="hero-date-in"><span class="hero-date-part">${now.getMonth() + 1}月${now.getDate()}日</span> <span class="hero-date-part">星期${week}</span></span>`;

        const h = now.getHours();
        const greet = h < 11 ? "早安" : h < 18 ? "午安" : "晚安";
        $("#heroTitle").innerHTML = `${greet}，<br>${CONFIG.unitName}`;
      }

      function renderTests() {
        const list = $("#testList");
        list.innerHTML = CONFIG.tests
          .map(
            (t, i) => `
      <button class="test-card${i === 0 ? " is-active" : ""}" type="button" data-index="${i}" aria-pressed="${i === 0}">
        <div class="top"><span class="no"><em>產出</em>${t.output}</span><i class="ti ${t.icon}"></i></div>
        <div class="name serif">${t.wrapAt ? t.name.slice(0, t.wrapAt) + "<wbr>" + t.name.slice(t.wrapAt) : t.name}</div>
        <div class="desc">${t.desc}</div>
        <span class="start" data-start="${t.id}">開始測驗 <i class="ti ti-arrow-right"></i></span>
      </button>`,
          )
          .join("");

        // 兩段式：點未選取的卡 → 變成選取（配色過渡、按鈕出現），不開面板；
        // 點已選取的卡或「開始測驗」→ 開啟場域選擇。卡片是 <button>，鍵盤 Enter／Space 同點擊
        const cards = [...list.querySelectorAll(".test-card")];
        let active = 0;
        list.addEventListener("click", (e) => {
          const card = e.target.closest(".test-card");
          if (!card) return;
          const i = Number(card.dataset.index);
          if (i !== active) {
            cards[active].classList.remove("is-active");
            cards[active].setAttribute("aria-pressed", "false");
            card.classList.add("is-active");
            card.setAttribute("aria-pressed", "true");
            active = i;
            return;
          }
          onTestSelected(CONFIG.tests[i]);
        });
      }

      /* 卡片寬度：寬度上限＝(內容寬 − 間距) ÷ 2；高度上限＝扣掉問候語與間距後的可用高度
       * 取兩者能放得下的較小值（高度 × 4/5）；窄螢幕（< 600px）上下排列、滿寬，不設定 */
      function fitCards() {
        const stage = $("#stage");
        const list = $("#testList");
        if (!stage || !list) return;
        if (window.innerWidth < 600) {
          stage.style.removeProperty("--card-w");
          return;
        }
        const ss = getComputedStyle(stage);
        const ls = getComputedStyle(list);
        const gap = parseFloat(ls.columnGap) || 0;
        const contentW = stage.clientWidth - parseFloat(ls.paddingLeft) - parseFloat(ls.paddingRight);
        const innerH = stage.clientHeight - parseFloat(ss.paddingTop) - parseFloat(ss.paddingBottom);
        const titleH = $("#heroTitle").offsetHeight + parseFloat(ls.marginTop);
        const wMax = (contentW - gap) / 2;
        const hMax = innerH - titleH;
        const w = Math.max(0, Math.floor(Math.min(wMax, (hMax * 4) / 5)));
        stage.style.setProperty("--card-w", w + "px");
      }
      function initFitCards() {
        fitCards();
        if ("ResizeObserver" in window) new ResizeObserver(fitCards).observe($("#stage"));
        else window.addEventListener("resize", fitCards);
        document.fonts?.ready.then(fitCards); // 問候語字型載入後高度可能改變
      }

      // 選好測驗後：打開場域面板，選好場域後進入受測名單
      function onTestSelected(test) {
        openFieldSheet(test);
      }

      // 導覽列「上傳」徽章：待上傳日期數（0 時不顯示）；同時記在 sessionStorage 給其他頁的導覽列顯示
      function renderSync() {
        setUploadPending(pendingCount());
      }

      /* =========================================================
       * 選擇場域：共用面板（js/field-sheet.js；場域資料 js/fields.js）
       * 選好測驗後開啟；確認場域（或新增場域成功）→ 設為目前場域、加入最近使用、進入該測驗的受測名單
       * ========================================================= */
      let pickTest = null;
      const fieldSheet = FieldSheet.create({
        sheet: $("#sheet"),
        mask: $("#sheetMask"),
        app: $("#app"),
        bodyClasses: ["sheet-open"],
        title: "選擇場域",
        confirmLabel: "開始測驗",
        confirmIcon: "ti-arrow-right",
        toast: showToast,
        onConfirm(field) {
          KFFields.setCurrent(field.id);
          fieldSheet.close();
          // 等面板關閉動畫結束再進入受測名單
          setTimeout(() => {
            location.href = `roster.html?test=${pickTest.id}&field=${field.id}`;
          }, 350);
        },
      });
      function openFieldSheet(test) {
        pickTest = test;
        // 當天已有目前場域：自動選取
        fieldSheet.open({ sub: `${test.name} · ${test.desc}`, selectedId: KFFields.getCurrent()?.id ?? null });
      }
      function initFieldSheet() {
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") fieldSheet.escape();
        });
      }

      /* =========================================================
       * 影像上傳
       * kf.uploadedDates：已上傳的日期（"YYYY-MM-DD" 陣列），重新整理後不再出現
       * U[date]：{ status: "idle" | "uploading" | "done" | "fail", pct, attempt, timer, removed }
       * ========================================================= */
      const UPLOADED_KEY = "kf.uploadedDates";
      const U = {};
      const up = { open: false, lastFocus: null };

      // 依今天往前推 n 天的日期（本地時間，"YYYY-MM-DD"）
      function isoDaysAgo(n) {
        const d = new Date();
        d.setDate(d.getDate() - n);
        const p = (x) => String(x).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      }
      function getUploaded() {
        try {
          const v = JSON.parse(sessionStorage.getItem(UPLOADED_KEY));
          return Array.isArray(v) ? v : [];
        } catch (e) {
          return [];
        }
      }
      function addUploaded(date) {
        try {
          const list = getUploaded();
          if (!list.includes(date)) list.push(date);
          sessionStorage.setItem(UPLOADED_KEY, JSON.stringify(list));
        } catch (e) {}
      }
      // 尚未上傳（且還沒從列表移除）的日期，由新到舊
      function pendingUploads() {
        const done = getUploaded();
        return CONFIG.uploads
          .filter((u) => !done.includes(u.date) && !U[u.date]?.removed)
          .sort((a, b) => b.date.localeCompare(a.date));
      }
      // 一個日期算 1 筆
      const pendingCount = () => pendingUploads().length;
      const isUploading = () =>
        Object.values(U).some((s) => s.status === "uploading");

      // 「11 月 12 日」
      function dayLabel(iso) {
        const [, m, d] = iso.split("-").map(Number);
        return `${m} 月 ${d} 日`;
      }

      function upRowHTML(u) {
        return `
      <div class="up-row" data-date="${u.date}">
        <span class="up-ico"><i class="ti ti-calendar"></i></span>
        <div class="up-main">
          <div class="up-date">${dayLabel(u.date)}</div>
          <div class="up-status"></div>
          <div class="up-bar"><div class="up-fill"></div></div>
        </div>
        <button class="up-btn" type="button"></button>
      </div>`;
      }

      // 依狀態更新一列（文字、進度條、按鈕）
      function renderUpRow(date) {
        const row = $(`#upBody .up-row[data-date="${date}"]`);
        if (!row) return;
        const s = U[date];
        const status = row.querySelector(".up-status");
        const bar = row.querySelector(".up-bar");
        const fill = row.querySelector(".up-fill");
        const btn = row.querySelector(".up-btn");
        // 進度每次更新只改文字和進度條；狀態改變時才重畫按鈕（避免載入圖示的旋轉重新開始）
        const changed = row.dataset.state !== s.status;
        row.dataset.state = s.status;
        row.classList.toggle("is-fail", s.status === "fail");
        const setBtn = (cls, html) => {
          if (!changed) return;
          btn.className = `up-btn${cls ? " " + cls : ""}`;
          btn.innerHTML = html;
        };
        if (s.status === "idle") {
          status.textContent = ""; // 待上傳不顯示第二行，日期垂直置中（見 CSS）
          bar.classList.remove("is-on");
          setBtn("", '<i class="ti ti-cloud-upload"></i>上傳');
        } else if (s.status === "uploading") {
          status.textContent = `上傳中 ${Math.floor(s.pct)}%`;
          bar.classList.add("is-on");
          fill.style.width = `${s.pct}%`;
          setBtn("is-busy", '<i class="ti ti-loader-2 spin"></i>上傳中');
        } else if (s.status === "done") {
          status.textContent = "已上傳";
          bar.classList.add("is-on");
          fill.style.width = "100%";
          setBtn("is-done", '<i class="ti ti-circle-check"></i>已上傳');
        } else {
          status.innerHTML = '<i class="ti ti-alert-circle"></i>上傳失敗';
          setBtn("is-retry", '<i class="ti ti-refresh"></i>重新上傳');
          // 進度條停在失敗的位置，0.6 秒後淡出
          if (changed)
            setTimeout(() => {
              if (U[date].status === "fail") bar.classList.remove("is-on");
            }, 600);
        }
      }

      function shakeRow(date) {
        const row = $(`#upBody .up-row[data-date="${date}"]`);
        if (!row) return;
        row.classList.remove("shake");
        void row.offsetWidth;
        row.classList.add("shake");
        row.addEventListener("animationend", () => row.classList.remove("shake"), {
          once: true,
        });
      }

      // 總數：數字變化時往下跑
      function setUpNum(n, animate = true) {
        const el = $("#upNum");
        if (el.dataset.n === String(n)) return;
        el.dataset.n = n;
        const old = el.querySelector(".roll-cur");
        const nw = document.createElement("span");
        nw.className = `roll-cur${animate && old ? " roll-in" : ""}`;
        nw.textContent = n;
        if (old && animate) {
          old.className = "roll-out";
          old.setAttribute("aria-hidden", "true"); // 滑出中的舊數字不給讀屏念
          setTimeout(() => old.remove(), 460);
        } else if (old) old.remove();
        el.appendChild(nw);
      }

      // 總數列、空狀態、首頁數字一起更新
      function renderUpTotals(animate = true) {
        const n = pendingCount();
        const allDone = pendingUploads().length === 0;
        $("#upTotal").hidden = allDone;
        $("#upTotalDone").hidden = !allDone;
        if (!allDone) setUpNum(n, animate);
        if (allDone && !$("#upBody .up-empty")) {
          $("#upBody").innerHTML = `
      <div class="up-empty">
        <i class="ti ti-cloud-check"></i>
        <div class="up-empty-title">所有鑑測都已上傳</div>
        <div class="up-empty-sub">新的鑑測完成後會出現在這裡</div>
      </div>`;
        }
        renderSync();
      }

      function renderUpList() {
        const list = pendingUploads();
        list.forEach((u) => {
          U[u.date] ??= { status: "idle", pct: 0, attempt: 0, removed: false };
        });
        $("#upBody").innerHTML = list.length
          ? `<div class="up-card">${list.map(upRowHTML).join("")}</div>`
          : "";
        list.forEach((u) => renderUpRow(u.date));
        renderUpTotals(false);
      }

      /* 模擬上傳：約 3～5 秒從 0% 到 100%，速度忽快忽慢
       * TODO：之後改成實際上傳 API，例如
       *   uploadExams(date, {
       *     onProgress: (pct) => { U[date].pct = pct; renderUpRow(date); },  // 進度回呼
       *   }).then(() => uploadSucceeded(date))
       *     .catch((err) => uploadFailed(date, err));                         // 失敗處理
       */
      function startUpload(date) {
        const u = CONFIG.uploads.find((x) => x.date === date);
        const s = U[date];
        if (!u || s.status === "uploading" || s.status === "done") return;
        const wasFail = s.status === "fail";
        s.status = "uploading";
        s.pct = 0;
        s.attempt += 1;
        const willFail = u.failOnce && s.attempt === 1;
        const failAt = 56 + Math.random() * 8; // 約 60% 時失敗
        renderUpRow(date);
        if (wasFail) shakeRow(date);
        renderSync();

        const tick = () => {
          // 偶爾停頓、偶爾衝快一點
          const r = Math.random();
          s.pct += r < 0.15 ? 0.4 : r < 0.85 ? 2 + Math.random() * 3 : 6 + Math.random() * 4;
          if (willFail && s.pct >= failAt) {
            s.pct = failAt;
            renderUpRow(date);
            return uploadFailed(date);
          }
          if (s.pct >= 100) {
            s.pct = 100;
            return uploadSucceeded(date);
          }
          renderUpRow(date);
          s.timer = setTimeout(tick, 110 + Math.random() * 90);
        };
        s.timer = setTimeout(tick, 150);
      }

      function uploadSucceeded(date) {
        U[date].status = "done";
        addUploaded(date);
        renderUpRow(date);
        renderSync();
        if (!up.open) showToast(`${dayLabel(date)}已上傳`);
        // 1.2 秒後淡出並收合，從列表移除，總數往下跑
        setTimeout(() => {
          const row = $(`#upBody .up-row[data-date="${date}"]`);
          const finish = () => {
            row?.remove();
            U[date].removed = true;
            renderUpTotals();
          };
          if (!row) return finish();
          row.style.height = `${row.offsetHeight}px`;
          void row.offsetHeight;
          row.classList.add("is-leaving");
          row.style.height = "0px";
          setTimeout(finish, 420);
        }, 1200);
      }

      function uploadFailed(date) {
        U[date].status = "fail";
        renderUpRow(date);
        shakeRow(date);
        renderSync();
        if (!up.open) showToast(`${dayLabel(date)}上傳失敗，請重新上傳`);
      }

      function openUpSheet() {
        if (up.open || fieldSheet.isOpen) return;
        up.open = true;
        up.lastFocus = document.activeElement;
        const sheet = $("#upSheet");
        $("#upBody").scrollTop = 0;
        sheet.style.transform = "";
        sheet.classList.add("is-open");
        sheet.setAttribute("aria-hidden", "false");
        document.body.classList.add("sheet-open", "up-open");
        $("#app").inert = true;
      }

      // 有日期正在上傳時也可以關閉，上傳在背景繼續
      function closeUpSheet() {
        if (!up.open) return;
        up.open = false;
        const sheet = $("#upSheet");
        sheet.style.transform = "";
        sheet.classList.remove("is-open");
        sheet.setAttribute("aria-hidden", "true");
        document.body.classList.remove("sheet-open", "up-open");
        $("#app").inert = false;
        up.lastFocus?.focus?.({ preventScroll: true });
      }

      function initUpload() {
        renderUpList();
        renderSync();
        $("#upClose").addEventListener("click", closeUpSheet);
        $("#upMask").addEventListener("click", closeUpSheet);
        $("#upBody").addEventListener("click", (e) => {
          const btn = e.target.closest(".up-btn");
          if (btn) startUpload(btn.closest(".up-row").dataset.date);
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && up.open) closeUpSheet();
        });

        // 拖曳把手區：往下拖跟手移動，放開時超過 120px 關閉，否則彈回
        const sheet = $("#upSheet");
        const grab = $("#upGrab");
        let drag = null;
        grab.addEventListener("pointerdown", (e) => {
          if (!up.open || e.target.closest("button")) return;
          drag = { y: e.clientY, dy: 0 };
          grab.setPointerCapture(e.pointerId);
          sheet.classList.add("is-dragging");
        });
        grab.addEventListener("pointermove", (e) => {
          if (!drag) return;
          drag.dy = Math.max(0, e.clientY - drag.y);
          sheet.style.transform = `translateY(${drag.dy}px)`;
        });
        const endDrag = () => {
          if (!drag) return;
          const { dy } = drag;
          drag = null;
          sheet.classList.remove("is-dragging");
          sheet.style.transform = "";
          if (dy > 120 * unitPx()) closeUpSheet();
        };
        grab.addEventListener("pointerup", endDrag);
        grab.addEventListener("pointercancel", endDrag);
      }

      /* ===== 啟動 ===== */
      renderNav();
      $("#heroLang").outerHTML = LangPicker.buttonHTML("light");
      if ($("#testList")) {
        renderHero();
        renderTests();
        initFitCards();
        initUpload(); // 會一併更新導覽列的上傳徽章
        initFieldSheet();
        // 從其他頁的導覽列點「上傳」：home.html?upload=1 → 自動開啟上傳面板（開啟後把參數拿掉，重新整理不會再開）
        const q = new URLSearchParams(location.search);
        if (q.get("upload") === "1") {
          q.delete("upload");
          history.replaceState(history.state, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
          setTimeout(openUpSheet, 450);
        }
      }
    </script>
  </body>
</html>
