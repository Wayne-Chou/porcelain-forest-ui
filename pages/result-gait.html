<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="../img/logo.png" />
    <link rel="apple-touch-icon" href="../img/logo.png" />
    <title>建豐健康科技 - 行走測驗鑑測結果</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css"
    />
    <!-- 鑑測結果頁共用（與 result.html 共用版面、卡片、半圓圖、同齡比較、輪播）；最新消息資料與詳細報告共用 -->
    <link rel="stylesheet" href="../css/result.css" />
    <link rel="stylesheet" href="../css/news.css" />
    <link rel="stylesheet" href="../css/recommend.css" />
    <script src="../js/recommend.js"></script>
    <script src="../js/result-common.js"></script>
    <script src="../js/news.js"></script>
    <style>
      /* =========================================================
       * 行走測驗鑑測結果頁：共用樣式在 css/result.css；這裡只有風險切換示範鈕
       * 三張卡：結果總覽 → 依風險推薦（商品或優惠券）→ 最新消息
       * ========================================================= */
      /* =========================================================
       * 結果總覽：同齡比較（B1 位置尺），在「風險等級：X」下方到卡片底部的剩餘空間裡垂直置中，左右留 10
       * 最小間距：上方 48（「風險等級：X」的下邊距）、下方 40（卡片的下內距）
       * 結果句｜位置尺（漸層橫條＋「您」標記＋50% 刻度）｜表現較弱・中間・表現較好
       * ========================================================= */
      .card--overview .gauge-text {
        margin-bottom: calc(48 * var(--cu));
      }
      .peer {
        margin: auto calc(10 * var(--cu));
      }
      .peer-line {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: calc(14 * var(--cu));
        color: var(--forest);
        white-space: nowrap;
      }
      .peer-word {
        font-size: max(var(--fmin), calc(30 * var(--cu)));
        font-weight: 700;
        line-height: 1.2;
      }
      .peer-num {
        font-family: var(--font-serif);
        font-size: max(var(--fmin), calc(80 * var(--cu)));
        font-weight: 600;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      /* 位置尺：--pos 為標記位置（%）；標籤寬固定，靠近邊緣時往內收（不超出橫條），三角形仍對準圓點
       * 上方空間依標籤實際尺寸計算：標籤高＋三角形高＋圓點超出橫條的部分＋與圓點的間隔＋與結果句的空白 28 */
      .peer-ruler {
        --pos: 50%;
        --bar-h: calc(20 * var(--cu));
        --dot: calc(40 * var(--cu));
        --dot-over: calc((var(--dot) - var(--bar-h)) / 2); /* 圓點超出橫條的部分 */
        --tip-gap: calc(2 * var(--cu)); /* 三角形尖端與圓點的間隔 */
        --tip-w: calc(28 * var(--cu));
        --tip-h: calc(16 * var(--cu));
        --tag-fs: max(var(--fmin), calc(34 * var(--cu)));
        --tag-py: calc(10 * var(--cu));
        --tag-h: calc(var(--tag-fs) * 1.3 + var(--tag-py) * 2 + 4px); /* 字高（行高 1.3）＋上下內距＋上下框 */
        --tag-w: calc(var(--tag-fs) + 56 * var(--cu) + 4px); /* 「您」＋左右內距 28＋左右框 */
        position: relative;
        height: var(--bar-h);
        margin-top: calc(var(--tag-h) + var(--tip-h) + var(--dot-over) + var(--tip-gap) + 28 * var(--cu));
        border-radius: calc(10 * var(--cu));
        background: linear-gradient(to right, #efe9de, #d9c3a0 50%, var(--forest));
      }
      .peer-mid {
        position: absolute;
        left: 50%;
        top: 100%;
        width: calc(2 * var(--cu));
        height: calc(16 * var(--cu));
        margin-left: calc(-1 * var(--cu));
        background: var(--brass);
      }
      .peer-dot,
      .peer-tip,
      .peer-tag {
        position: absolute;
        transition: left 0.3s var(--ease-out);
      }
      .peer-dot {
        left: var(--pos);
        top: 50%;
        width: var(--dot);
        height: var(--dot);
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #fffdf9;
        border: calc(6 * var(--cu)) solid var(--forest);
      }
      /* 朝下的小三角形：對準圓點 */
      .peer-tip {
        left: var(--pos);
        bottom: calc(100% + var(--dot-over) + var(--tip-gap));
        width: 0;
        height: 0;
        transform: translateX(-50%);
        border-left: calc(var(--tip-w) / 2) solid transparent;
        border-right: calc(var(--tip-w) / 2) solid transparent;
        border-top: var(--tip-h) solid var(--forest);
      }
      .peer-tag {
        left: clamp(0%, calc(var(--pos) - var(--tag-w) / 2), calc(100% - var(--tag-w)));
        bottom: calc(100% + var(--dot-over) + var(--tip-gap) + var(--tip-h) - 1px); /* 和三角形接在一起 */
        box-sizing: border-box;
        width: var(--tag-w);
        padding: var(--tag-py) 0;
        border-radius: 999px;
        border: 2px solid var(--brass);
        background: var(--forest);
        color: var(--on-forest);
        font-size: var(--tag-fs);
        font-weight: 700;
        line-height: 1.3;
        text-align: center;
      }
      .peer-ends {
        position: relative;
        margin-top: calc(26 * var(--cu));
        display: flex;
        justify-content: space-between;
        font-size: max(var(--fmin), calc(22 * var(--cu)));
        line-height: 1.3;
        color: var(--muted);
      }
      .peer-ends .peer-c {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-weight: 700;
        color: var(--brass-text);
      }
      @media (prefers-reduced-motion: reduce) {
        .peer-dot,
        .peer-tip,
        .peer-tag {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page" id="page" hidden>
      <!-- 頁首：返回（左）、「報告」說明＋箭頭＋QR Code 小卡（右） -->
      <header class="header">
        <button class="home-btn press" id="homeBtn" type="button" aria-label="回首頁">
          <i class="ti ti-home"></i>
        </button>
        <button class="back-pill press" id="backBtn" type="button" hidden>
          <i class="ti ti-chevron-left"></i>受測名單
        </button>
        <!-- 姓名（含稱謂）與檢測日期：暫時隱藏，保留原始碼，之後可能再打開（同 result.html）
        <div class="who">
          <h1 class="who-name serif" id="whoName"></h1>
          <div class="who-date">檢測日期 <b id="whoDate"></b></div>
        </div>
        -->
        <a class="report" id="qrCard" href="detail-gait.html?preview=1&amp;from=result" aria-label="開啟行走測驗詳細報告" draggable="false">
          <span class="report-hint" aria-hidden="true">
            <span class="report-text">
              <span class="report-title serif">報告</span>
              <span class="report-sub">手機掃描看詳細內容</span>
            </span>
            <svg class="report-arrow" focusable="false">
              <line x1="4%" y1="50%" x2="94%" y2="50%" />
              <line x1="94%" y1="50%" x2="76%" y2="18%" />
              <line x1="94%" y1="50%" x2="76%" y2="82%" />
            </svg>
          </span>
          <span class="qr-card"><img id="reportQr" alt="" draggable="false" /></span>
        </a>
      </header>

      <!-- 風險切換示範鈕（DEMO_RISK_SWITCH）：只切換畫面，不寫回紀錄 -->
      <div class="demo-risk" id="demoRisk" role="group" aria-label="示範：切換風險等級" hidden data-html2canvas-ignore></div>

      <!-- 卡片舞台：三張排成一圈 -->
      <main class="stage" id="stage" aria-roledescription="輪播">
        <!-- 卡片 1：結果總覽（版面同 result.html） -->
        <section class="card card--overview" data-i="0" aria-label="結果總覽">
          <div class="card-head">
            <h2 class="card-title serif">結果總覽</h2>
          </div>
          <div class="sub">跌倒風險評估</div>
          <svg class="gauge" id="gauge" viewBox="0 0 760 362" role="img" aria-label="跌倒風險半圓圖"></svg>
          <div class="gauge-text" id="gaugeText"></div>
          <!-- 同齡比較（B1 位置尺；資料規則同 result.html：js/result-common.js normOf） -->
          <div class="peer" id="peerBox" role="img">
            <div class="peer-line" aria-hidden="true"><span class="peer-word" data-f="pre"></span><span class="peer-num" data-f="num"></span><span class="peer-word">同齡長者</span></div>
            <div class="peer-ruler" aria-hidden="true">
              <span class="peer-mid"></span>
              <span class="peer-tag">您</span>
              <span class="peer-tip"></span>
              <span class="peer-dot"></span>
            </div>
            <div class="peer-ends" aria-hidden="true"><span>表現較弱</span><span class="peer-c">中間</span><span>表現較好</span></div>
          </div>
        </section>

        <!-- 卡片 2：依風險等級推薦（js/result-common.js 的 RECOMMENDS） -->
        <section class="card" data-i="1" id="recCard" aria-label="推薦商品"></section>

        <!-- 卡片 3：最新消息（KF_NEWS 第一則；資料與詳細報告共用 js/news.js） -->
        <section class="card" data-i="2" id="newsCard" aria-label="最新消息"></section>
      </main>

      <!-- 底部列：頁數圓點＋滑動提示（水平置中） -->
      <footer class="foot">
        <nav class="pager" aria-label="頁面切換">
          <div class="dots" id="dots" role="tablist" data-html2canvas-ignore></div>
          <div class="hint" id="hint" aria-hidden="true" data-html2canvas-ignore>
            <i class="ti ti-hand-finger hand"></i>
            <i class="ti ti-chevrons-left chev to-left"></i>左右滑動查看<i class="ti ti-chevrons-right chev to-right"></i>
          </div>
        </nav>
      </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // 報告 QR Code 圖片（之後會依 record 替換）
      const REPORT_QR_SRC = "../img/qrcode-demo.png";
      // 點 QR Code 小卡開啟的詳細報告（之後接 API 時換成帶 token 的網址）
      const REPORT_DETAIL_URL = "detail-gait.html?preview=1&from=result";

      /* =========================================================
       * 設定區：受測人員、鑑測紀錄與其他頁重複，之後改成共用設定或 API
       * ========================================================= */
      const CONFIG = {
        subjects: [
          { id: "s001", code: "A001", name: "林淑芬", birth: "1948-03-12", gender: "女", source: "import" },
          { id: "s002", code: "A002", name: "王小明", birth: "1954-07-21", gender: "男", source: "import" },
          { id: "s003", code: "A003", name: "陳美玉", birth: "1945-01-30", gender: "女", source: "import" },
          { id: "s004", code: "A004", name: "張志明", birth: "1957-05-08", gender: "男", source: "import" },
        ],
        // 行走測驗紀錄（假資料，與 report.html 相同）：riskLevel 0–4；沒有時預設 1（稍低風險）
        records: [
          { id: "r101", subjectId: "s002", test: "gait", date: daysAgo(1), time: "15:20", riskLevel: 2 },
          { id: "r104", subjectId: "s001", test: "gait", date: daysAgo(9), time: "09:30", riskLevel: 0 },
          { id: "r105", subjectId: "s003", test: "gait", date: daysAgo(17), time: "14:15" },
        ],
      };
      const DEFAULT_RISK = 1;
      const PAGES = ["總覽", "推薦", "最新消息"]; // 頁數圓點的 aria-label
      // 同齡比較（B1 位置尺）：結果句與「您」標記的位置（%）
      const PEER_SCALE = {
        above50: { pre: "優於", num: "50%", pos: 65 },
        below50: { pre: "低於", num: "50%", pos: 35 },
        behind80: { pre: "落後", num: "80%", pos: 12 },
      };

      // 共用小工具、資料讀取（紀錄、受測者含一體機）、半圓圖、同齡比較、推薦、消息、頁首、輪播：js/result-common.js
      // riskLevel：0–4（依序為低、稍低、中、高、危險，對應 SEG_ORDER）的整數才採用，其他一律預設 1
      function riskLevelOf(record) {
        const v = Number(record?.riskLevel);
        return record?.riskLevel !== undefined && record?.riskLevel !== null && Number.isInteger(v) && v >= 0 && v <= 4 ? v : DEFAULT_RISK;
      }

      // 同齡比較：分類不合法時整區隱藏；標記位置改變時有 0.3 秒位移（減少動態時直接定位）
      function renderPeerScale(box, key) {
        const p = Object.hasOwn(PEER_SCALE, key ?? "") ? PEER_SCALE[key] : null;
        box.hidden = !p;
        if (!p) return;
        box.querySelector('[data-f="pre"]').textContent = p.pre;
        box.querySelector('[data-f="num"]').textContent = p.num;
        box.querySelector(".peer-ruler").style.setProperty("--pos", `${p.pos}%`);
        box.setAttribute("aria-label", `${p.pre} ${p.num} 同齡長者`);
        box.dataset.norm = key;
      }

      /* 依風險等級更新：半圓圖指針、「風險等級：短名稱」、同齡比較、第 2 張卡（推薦）
       * norm：同齡比較分類；示範鈕切換時依示範規則（不讀紀錄） */
      let recordSeed = "";
      function renderLevel(level, norm, sweep = true) {
        const key = SEG_ORDER[level];
        $(".card--overview").dataset.level = level;
        const angle = 180 - 36 * level - 18; // 指針在該等級色段的中央
        if (sweep) sweepNeedle($("#gauge"), angle);
        else setNeedle($("#gauge"), angle);
        renderRiskBlock(key);
        renderPeerScale($("#peerBox"), norm);
        renderRecommend($("#recCard"), level + 1, recordSeed);
        setDemoPressed(level);
      }

      /* =========================================================
       * 啟動：result-gait.html?record=<id>[&from=assess|kiosk]
       * 沒有 record 時（預覽）：第一位受測者、今天、風險等級預設 1（可用 ?risk=0–4 切換）
       * ========================================================= */
      function init() {
        const params = new URLSearchParams(location.search);
        const recordId = params.get("record");
        let record = null;
        let subject;
        let date;
        if (recordId) {
          record = allRecords().find((r) => r.id === recordId && r.test === "gait");
          subject = record && findSubject(record);
          if (!record || !subject) {
            showToast("找不到鑑測紀錄");
            setTimeout(() => (location.href = "report.html"), 1500);
            return;
          }
          date = record.date;
        } else {
          subject = findSubject(null);
          date = isoOf(new Date());
          record = { riskLevel: params.get("risk") };
        }

        // 左上角：從測驗完成進入是「‹ 受測名單」（回到這個場域的行走測驗名單）；一體機回到歡迎頁
        initHeader("gait", record, params);
        initQrLink(REPORT_QR_SRC, REPORT_DETAIL_URL);
        renderWho(subject, date);
        drawGauge($("#gauge"));
        const level = riskLevelOf(record);
        recordSeed = record?.id || "preview"; // 產生示範券號用：同一筆紀錄每次打開都一樣
        // 風險切換示範鈕（js/result-common.js；DEMO_RISK_SWITCH）：只切換畫面，不寫回紀錄
        initDemoRisk(level, (lv) => renderLevel(DEMO.gait[lv].riskLevel, demoNorm(SEG_ORDER[lv]), false));
        renderLevel(level, normOf(record, SEG_ORDER[level]));
        renderNewsOne($("#newsCard"), getLatestNews());
        showPage();
        initCarousel({ pages: PAGES });
      }
      init();
    </script>
  </body>
</html>
