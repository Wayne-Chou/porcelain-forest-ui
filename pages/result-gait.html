<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="../img/logo.png" />
    <link rel="apple-touch-icon" href="../img/logo.png" />
    <title>建豐健康科技 - 行走測驗鑑測結果</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css"
    />
    <style>
      /* =========================================================
       * 瓷白森林 Porcelain Forest — 行走測驗鑑測結果頁（響應式）
       * 版面與樣式沿用 result.html（--u 響應式、背景、頁首、字型、卡片、報告 QR Code 小卡），只有一張置中的卡片
       * 整頁 100dvh 直向排版：頁首｜卡片舞台（flex: 1）｜底部（報告 QR Code），不捲動
       * 卡片內的尺寸都以 --cu（= 卡片寬 ÷ 740）為單位
       * ========================================================= */
      :root {
        --bg: #ece7df;
        --card: #f7f4ee;
        --card-deep: #e6dccb;
        --line: #d9cfbe;
        --line-soft: #c7bba6;
        --forest: #1f3b33;
        --brass: #b08d57;
        --brass-text: #8f6e3c;
        --ink: #1a2420;
        --muted: #6f6656;
        --on-forest: #f6f1e8;
        --faint: #8a8170;
        --paper: #fffdf9; /* 結果卡片底色 */
        --chip: #fbf8f2;
        --divider: #efe9df;

        --font-sans: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
        --font-serif: "Noto Serif TC", "Songti TC", serif;
        /* 縮放單位：iPad 13 吋直式（1032 × 1376）時 1 --u = 1px；較小的 iPad 依「寬度」與「高度 × 0.75」中較小者等比縮小 */
        --u: calc(min(100vw, 100dvh * 0.75) / 1032);
        --gutter: max(0px, calc((100vw - 1032 * var(--u)) / 2));
        --fmin: 16px;
        --bmin: 18px;
        --fs-body: max(var(--fmin), calc(26 * var(--u)));

        /* 版面間距（與 result.html 相同） */
        --pad-x: calc(56 * var(--u));
        --pad-top: calc(48 * var(--u));
        --gap-head: calc(28 * var(--u));
        --gap-foot: calc(20 * var(--u));
        --pad-bottom: calc(44 * var(--u));

        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: radial-gradient(60% 60% at 50% 48%, #f6f2ea, #e6dfd2);
        background-color: #e6dfd2;
        color: var(--ink);
        font-family: var(--font-sans);
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden; /* 整頁不捲動 */
      }
      .serif {
        font-family: var(--font-serif);
        font-weight: 600;
      }
      button {
        font: inherit;
        color: inherit;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      .press {
        transition: transform 0.2s var(--ease-out);
      }
      .press:active {
        transform: scale(0.96);
      }

      /* ===== 整頁：直向 flex ===== */
      .page {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: calc(var(--pad-top) + env(safe-area-inset-top)) 0
          calc(var(--pad-bottom) + env(safe-area-inset-bottom));
        overflow-x: clip;
      }

      /* ===== 頁首（與 result.html 相同，沒有 VIVIFRAIL） ===== */
      .header {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
        padding: 0 calc(var(--pad-x) + var(--gutter));
        display: flex;
        align-items: center;
        gap: calc(24 * var(--u));
        animation: fadeIn 0.6s var(--ease-out) both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
      }
      .home-btn {
        flex: 0 0 auto;
        width: max(44px, calc(88 * var(--u)));
        height: max(44px, calc(88 * var(--u)));
        border-radius: 50%;
        background: var(--chip);
        border: 2px solid var(--line);
        display: grid;
        place-items: center;
        font-size: max(var(--bmin), calc(42 * var(--u)));
      }
      .back-pill {
        flex: 0 0 auto;
        height: max(44px, calc(88 * var(--u)));
        padding: 0 calc(32 * var(--u)) 0 calc(20 * var(--u));
        border-radius: calc(999 * var(--u));
        background: var(--chip);
        border: 2px solid var(--line);
        display: inline-flex;
        align-items: center;
        gap: calc(4 * var(--u));
        font-size: max(var(--bmin), calc(30 * var(--u)));
        font-weight: 700;
        white-space: nowrap;
      }
      .back-pill i {
        font-size: max(var(--bmin), calc(40 * var(--u)));
      }
      .who {
        min-width: 0;
        flex: 0 1 auto;
      }
      .who-name {
        margin: 0;
        font-size: max(var(--fmin), calc(56 * var(--u)));
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .who-date {
        margin-top: 2px;
        font-size: max(var(--fmin), calc(24 * var(--u)));
        line-height: 1.3;
        color: var(--muted);
        white-space: nowrap;
      }
      .who-date b {
        margin-left: 0.5em;
        font-weight: 700;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 599px) {
        /* 手機：卡片內（依卡片寬度縮放）不強制最小字級；頁首和底部仍維持 16px／18px */
        .stage {
          --fmin: 0px;
          --bmin: 0px;
        }
      }

      /* =========================================================
       * 卡片舞台：一張置中的卡片（--card-w、--card-h 由 JS 依舞台大小設定，算法同 result.html）
       * ========================================================= */
      .stage {
        --card-w: calc(740 * var(--u));
        --card-h: calc(940 * var(--u));
        --cu: calc(var(--card-w) / 740);
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-height: 0;
        margin-top: var(--gap-head);
        perspective: calc(var(--card-w) * 2.973);
      }
      .card {
        position: absolute;
        left: calc(50% - var(--card-w) / 2);
        top: 0;
        width: var(--card-w);
        height: var(--card-h);
        padding: calc(40 * var(--cu)) calc(44 * var(--cu));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: var(--paper);
        border-radius: calc(48 * var(--cu));
        box-shadow:
          0 0 0 calc(2 * var(--cu)) rgba(176, 141, 87, 0.35),
          0 calc(36 * var(--cu)) calc(70 * var(--cu)) rgba(60, 45, 25, 0.2);
        transition:
          transform 0.8s var(--ease-out),
          opacity 0.8s;
      }
      .card.is-entering {
        opacity: 0;
        transform: translateZ(calc(var(--card-w) * -0.81));
        transition: none;
      }
      .card-eyebrow {
        font-size: max(var(--fmin), calc(28 * var(--cu)));
        font-weight: 700;
        letter-spacing: 0.24em;
        line-height: 1.3;
        color: var(--brass-text);
      }
      .card-title {
        margin: calc(10 * var(--cu)) 0 0;
        font-size: max(var(--fmin), calc(60 * var(--cu)));
        line-height: 1.2;
      }
      /* 跌倒風險半圓圖：幾何、顏色、指針樣式同 result.html */
      .gauge {
        display: block;
        width: calc(620 * var(--cu));
        margin-top: calc(44 * var(--cu));
      }
      .gauge-ends {
        width: calc(620 * var(--cu));
        display: flex;
        justify-content: space-between;
        margin-top: calc(6 * var(--cu));
        font-size: max(var(--fmin), calc(26 * var(--cu)));
        font-weight: 700;
        line-height: 1.3;
        color: var(--faint);
      }
      .gauge-ends span {
        width: 21%; /* 兩端色段寬度：文字置中在色段下方 */
        text-align: center;
      }
      /* 風險標籤：固定配色表的底、框、字 */
      .risk-pill {
        margin-top: calc(40 * var(--cu));
        display: inline-flex;
        align-items: center;
        gap: calc(14 * var(--cu));
        padding: calc(16 * var(--cu)) calc(36 * var(--cu));
        border-radius: calc(999 * var(--cu));
        background: var(--risk-bg);
        border: calc(3 * var(--cu)) solid var(--risk-border);
        color: var(--risk-text);
        font-size: max(var(--fmin), calc(40 * var(--cu)));
        font-weight: 700;
        line-height: 1.3;
      }
      .risk-pill i {
        font-size: max(var(--fmin), calc(44 * var(--cu)));
      }
      .risk-desc {
        margin-top: calc(22 * var(--cu));
        font-size: max(var(--fmin), calc(32 * var(--cu)));
        font-weight: 700;
        line-height: 1.4;
        color: var(--risk-text);
      }

      /* =========================================================
       * 底部：右下角報告 QR Code 小卡（樣式與 result.html 相同）
       * 底部列的高度等於小卡高度，舞台（flex: 1）相應變矮，結果卡片不會被小卡壓到
       * ========================================================= */
      .foot {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
        margin-top: var(--gap-foot);
        padding: 0 calc(var(--pad-x) + var(--gutter));
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        column-gap: calc(24 * var(--u));
        animation: fadeIn 0.6s 0.2s var(--ease-out) both;
      }
      /* 報告 QR Code 小卡：可點擊的連結（前往詳細報告）；只有「點一下」才開啟，拖曳不開啟；按下時縮到 0.97 */
      .qr-card {
        grid-column: 3;
        grid-row: 1;
        justify-self: end;
        margin: 0;
        padding: calc(18 * var(--u));
        border-radius: calc(32 * var(--u));
        background: #fffdf9;
        box-shadow:
          0 0 0 2px rgba(176, 141, 87, 0.35),
          0 16px 36px rgba(60, 45, 25, 0.18);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(10 * var(--u));
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        touch-action: none;
        -webkit-user-drag: none;
        transition: transform 0.25s var(--ease-spring);
      }
      .qr-card:active {
        transform: scale(0.97);
      }
      .qr-card:focus-visible {
        outline: 3px solid var(--forest);
        outline-offset: 4px;
      }
      .qr-card img {
        display: block;
        box-sizing: content-box;
        width: max(140px, calc(200 * var(--u)));
        height: max(140px, calc(200 * var(--u)));
        padding: max(8px, calc(12 * var(--u)));
        background: #fff;
        image-rendering: pixelated;
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
        pointer-events: none;
      }
      .qr-card .qr-cap {
        font-family: var(--font-sans);
        font-size: var(--fs-body);
        font-weight: 700;
        line-height: 1.3;
        color: var(--ink);
      }
      /* 窄螢幕：右下角放不下，小卡改放在底部正中央 */
      @media (max-width: 599px) {
        .foot {
          grid-template-columns: 1fr;
        }
        .qr-card {
          grid-column: 1;
          justify-self: center;
        }
      }

      /* ===== 提示訊息 ===== */
      .toast {
        position: fixed;
        left: 50%;
        top: calc(calc(36 * var(--u)) + env(safe-area-inset-top));
        transform: translate(-50%, calc(-24 * var(--u)));
        padding: calc(22 * var(--u)) calc(40 * var(--u));
        border-radius: calc(999 * var(--u));
        background: var(--forest);
        color: var(--on-forest);
        font-size: max(var(--bmin), calc(30 * var(--u)));
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: all 0.35s var(--ease-spring);
        z-index: 600;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
        .card {
          transition: opacity 0.2s !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page" id="page" hidden>
      <!-- 頁首：返回、受測者（沒有 VIVIFRAIL） -->
      <header class="header">
        <button class="home-btn press" id="homeBtn" type="button" aria-label="回首頁">
          <i class="ti ti-home"></i>
        </button>
        <button class="back-pill press" id="backBtn" type="button" hidden>
          <i class="ti ti-chevron-left"></i>受測名單
        </button>
        <div class="who">
          <h1 class="who-name serif" id="whoName"></h1>
          <div class="who-date">檢測日期<b id="whoDate"></b></div>
        </div>
      </header>

      <!-- 卡片舞台：一張置中的結果卡片 -->
      <main class="stage" id="stage">
        <section class="card is-entering" id="card" aria-label="跌倒風險評估">
          <div class="card-eyebrow">行走測驗</div>
          <h2 class="card-title serif">跌倒風險評估</h2>
          <svg class="gauge" id="gauge" viewBox="0 0 760 360" role="img" aria-label="跌倒風險半圓圖"></svg>
          <div class="gauge-ends" aria-hidden="true"><span>低</span><span>危險</span></div>
          <div class="risk-pill" id="riskPill"><i class="ti ti-alert-triangle"></i></div>
          <div class="risk-desc" id="riskDesc"></div>
        </section>
      </main>

      <!-- 底部：右下角報告 QR Code（點一下開啟行走詳細報告） -->
      <footer class="foot">
        <a class="qr-card" id="qrCard" href="detail-gait.html?preview=1&amp;from=result" aria-label="開啟行走測驗詳細報告" draggable="false">
          <img id="reportQr" alt="" draggable="false" />
          <span class="qr-cap">報告</span>
        </a>
      </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // 報告 QR Code 圖片（之後會依 record 替換）
      const REPORT_QR_SRC = "../img/qrcode-demo.png";
      // 點 QR Code 小卡開啟的詳細報告（之後接 API 時換成帶 token 的網址）
      const REPORT_DETAIL_URL = "detail-gait.html?preview=1&from=result";

      /* =========================================================
       * 設定區：受測人員、鑑測紀錄與其他頁重複，之後改成共用設定或 API
       * ========================================================= */
      const CONFIG = {
        subjects: [
          { id: "s001", code: "A001", name: "林淑芬", birth: "1948-03-12", gender: "女", source: "import" },
          { id: "s002", code: "A002", name: "王小明", birth: "1954-07-21", gender: "男", source: "import" },
          { id: "s003", code: "A003", name: "陳美玉", birth: "1945-01-30", gender: "女", source: "import" },
          { id: "s004", code: "A004", name: "張志明", birth: "1957-05-08", gender: "男", source: "import" },
        ],
        // 行走測驗紀錄（假資料，與 report.html 相同）：riskLevel 0–4；沒有時預設 1（稍低風險）
        records: [
          { id: "r101", subjectId: "s002", test: "gait", date: daysAgo(1), time: "15:20", riskLevel: 2 },
          { id: "r104", subjectId: "s001", test: "gait", date: daysAgo(9), time: "09:30", riskLevel: 0 },
          { id: "r105", subjectId: "s003", test: "gait", date: daysAgo(17), time: "14:15" },
        ],
      };
      const DEFAULT_RISK = 1;

      /* 固定的分級規則（文字和顏色不可更改，與 result.html 相同）；riskLevel 0–4 依序為低、稍低、中、高、危險 */
      const RISK_LEVELS = [
        { key: "vlow", name: "低風險", arc: "#4ffa00", bg: "#f0fdf4", border: "#86efac", text: "#166534", desc: "跌倒風險低，體能表現優異" },
        { key: "low", name: "稍低風險", arc: "#8cff00", bg: "#f7fee7", border: "#bef264", text: "#3f6212", desc: "跌倒風險稍低，狀況良好" },
        { key: "mid", name: "中度風險", arc: "#ffd039", bg: "#fefce8", border: "#fde047", text: "#854d0e", desc: "跌倒風險中等，持續關注為佳" },
        { key: "high", name: "高風險", arc: "#ffa203", bg: "#fff7ed", border: "#fdba74", text: "#c2410c", desc: "跌倒風險較高，建議積極改善" },
        { key: "danger", name: "危險", arc: "#ff5757", bg: "#fef2f2", border: "#fca5a5", text: "#b91c1c", desc: "目前跌倒風險偏高，請特別注意" },
      ];

      /* =========================================================
       * 共用功能
       * ========================================================= */
      const $ = (sel) => document.querySelector(sel);
      let toastTimer;
      function showToast(msg) {
        const el = $("#toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
      }
      const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
      function isoOf(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function daysAgo(n) {
        const d = new Date();
        d.setDate(d.getDate() - n);
        return isoOf(d);
      }

      /* =========================================================
       * 資料（sessionStorage，與 result.html 相同）
       * kf.records.<fieldId>：測驗頁完成測驗時新增的紀錄（行走測驗含 riskLevel）
       * kf.subjects.<fieldId>：{ added, done, edits }
       * ========================================================= */
      function readJSON(key) {
        try {
          return JSON.parse(sessionStorage.getItem(key));
        } catch (e) {
          return null;
        }
      }
      function currentFieldId() {
        const cur = readJSON("kf.currentField");
        if (cur?.id) return cur.id;
        const recent = readJSON("kf.recentFields");
        return Array.isArray(recent) && recent[0] ? recent[0].id || recent[0] : null;
      }
      function allRecords() {
        const list = [...CONFIG.records];
        try {
          for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            if (!key || !key.startsWith("kf.records.")) continue;
            const v = readJSON(key);
            if (Array.isArray(v)) list.push(...v);
          }
        } catch (e) {}
        return list;
      }
      function findSubject(record) {
        const fid = record?.fieldId || currentFieldId();
        const local = fid ? readJSON(`kf.subjects.${fid}`) : null;
        const id = record?.subjectId;
        const base =
          (id ? CONFIG.subjects.find((s) => s.id === id) : CONFIG.subjects[0]) ||
          (Array.isArray(local?.added) ? local.added.find((s) => s.id === id) : null);
        if (!base) return null;
        const e = local?.edits?.[base.id];
        return e ? { ...base, name: e.name ?? base.name, gender: e.gender ?? base.gender, birth: e.birth ?? base.birth } : base;
      }
      const honorific = (s) => `${s.name} ${s.gender === "女" ? "女士" : "先生"}`;
      // riskLevel：0–4 的整數才採用，其他（沒有、格式不對）一律預設 1
      function riskLevelOf(record) {
        const v = Number(record?.riskLevel);
        return record?.riskLevel !== undefined && record?.riskLevel !== null && Number.isInteger(v) && v >= 0 && v <= 4 ? v : DEFAULT_RISK;
      }

      /* =========================================================
       * 跌倒風險半圓圖：圓心 (380, 340)、半徑 300、線寬 76、五段等寬（每段 36°）、段與段之間留小縫（同 result.html）
       * 指針放在該風險等級色段的中央；進場時從最左邊（180°）轉到目標位置
       * ========================================================= */
      const pt = (cx, cy, r, deg) => [cx + r * Math.cos((deg * Math.PI) / 180), cy - r * Math.sin((deg * Math.PI) / 180)];
      const CX = 380, CY = 340;
      const needleAngle = (level) => 180 - 36 * level - 18;
      function drawGauge() {
        const R = 300, GAP = 0.9;
        let html = "";
        RISK_LEVELS.forEach((l, k) => {
          const a1 = 180 - 36 * k - (k > 0 ? GAP : 0);
          const a0 = 180 - 36 * (k + 1) + (k < 4 ? GAP : 0);
          const [x1, y1] = pt(CX, CY, R, a1);
          const [x0, y0] = pt(CX, CY, R, a0);
          html += `<path data-level="${l.key}" d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 0 1 ${x0.toFixed(1)} ${y0.toFixed(1)}" fill="none" stroke="${l.arc}" stroke-width="76" />`;
        });
        // 指針畫成指向最左（180°），再用 rotate 轉到目標角度
        html += `<g id="needle" transform="rotate(0 ${CX} ${CY})"><line x1="${CX}" y1="${CY}" x2="${CX - 230}" y2="${CY}" stroke="#1a2420" stroke-width="10" stroke-linecap="round" /></g>`;
        html += `<circle cx="${CX}" cy="${CY}" r="11" fill="#1a2420" /><circle cx="${CX}" cy="${CY}" r="5" fill="#fff" />`;
        $("#gauge").innerHTML = html;
      }
      function setNeedle(angle) {
        $("#needle").setAttribute("transform", `rotate(${(180 - angle).toFixed(2)} ${CX} ${CY})`);
        $("#gauge").dataset.angle = angle.toFixed(2);
      }
      /* cubic-bezier 緩動：轉到目標位置略為超過再回來 */
      function bezier(x1, y1, x2, y2) {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        const sx = (s) => ((ax * s + bx) * s + cx) * s;
        const sy = (s) => ((ay * s + by) * s + cy) * s;
        const dx = (s) => (3 * ax * s + 2 * bx) * s + cx;
        return (x) => {
          let s = x;
          for (let i = 0; i < 8; i++) {
            const e = sx(s) - x;
            const d = dx(s);
            if (Math.abs(e) < 1e-5 || !d) break;
            s -= e / d;
          }
          return sy(Math.min(1, Math.max(0, s)));
        };
      }
      const EASE_SWING = bezier(0.34, 1.2, 0.64, 1);
      function sweepNeedle(target) {
        if (REDUCED) return setNeedle(target);
        setNeedle(180);
        const t0 = performance.now() + 300; // 卡片轉入後再開始
        const step = (now) => {
          const p = Math.min(1, Math.max(0, (now - t0) / 1600));
          setNeedle(180 + (target - 180) * EASE_SWING(p));
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      function renderResult(subject, date, level) {
        $("#whoName").textContent = honorific(subject);
        $("#whoDate").textContent = date;
        const r = RISK_LEVELS[level];
        const card = $("#card");
        card.dataset.level = level;
        const pill = $("#riskPill");
        pill.style.setProperty("--risk-bg", r.bg);
        pill.style.setProperty("--risk-border", r.border);
        pill.style.setProperty("--risk-text", r.text);
        pill.append(r.name); // 文字直接放在膠囊裡
        $("#riskDesc").style.setProperty("--risk-text", r.text);
        $("#riskDesc").textContent = r.desc;
        drawGauge();
        sweepNeedle(needleAngle(level));
      }

      /* =========================================================
       * 卡片大小：算法同 result.html（高 = 舞台高 × 0.98；寬 = min(舞台寬 × 0.72, 卡片高 × 0.79)）
       * 底部 QR Code 小卡在版面流裡，舞台已扣掉它的高度，卡片不會被小卡遮到
       * ========================================================= */
      const stage = $("#stage");
      function measure() {
        const ch = stage.clientHeight * 0.98;
        const cw = Math.min(stage.clientWidth * 0.72, ch * 0.79);
        stage.style.setProperty("--card-w", `${cw}px`);
        stage.style.setProperty("--card-h", `${ch}px`);
      }
      // 姓名放不下時，以 2px 為單位縮小字級，最多縮到原本的 80%（同 result.html）
      function fitName() {
        const el = $("#whoName");
        el.style.fontSize = "";
        let size = parseFloat(getComputedStyle(el).fontSize);
        const min = size * 0.8;
        while (el.scrollWidth > el.clientWidth && size - 2 >= min) {
          size -= 2;
          el.style.fontSize = `${size}px`;
        }
      }

      /* 報告 QR Code 小卡：只有「點一下」（按下到放開移動不超過 8px）才開啟詳細報告；拖曳時取消這次點擊 */
      function initQrLink() {
        const a = $("#qrCard");
        a.href = REPORT_DETAIL_URL;
        let start = null;
        a.addEventListener("pointerdown", (e) => (start = { x: e.clientX, y: e.clientY }));
        a.addEventListener("click", (e) => {
          if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) e.preventDefault();
          start = null;
        });
        a.addEventListener("dragstart", (e) => e.preventDefault());
      }

      /* =========================================================
       * 啟動：result-gait.html?record=<id>[&from=assess]
       * 沒有 record 時（預覽）：第一位受測者、今天、風險等級預設 1（可用 ?risk=0–4 切換）
       * ========================================================= */
      function init() {
        const params = new URLSearchParams(location.search);
        const recordId = params.get("record");
        let record = null;
        let subject;
        let date;
        if (recordId) {
          record = allRecords().find((r) => r.id === recordId && r.test === "gait");
          subject = record && findSubject(record);
          if (!record || !subject) {
            showToast("找不到鑑測紀錄");
            setTimeout(() => (location.href = "report.html"), 1500);
            return;
          }
          date = record.date;
        } else {
          subject = findSubject(null);
          date = isoOf(new Date());
          record = { riskLevel: params.get("risk") };
        }

        // 從測驗完成進入：左上角改成「‹ 受測名單」，回到這個場域的行走測驗名單
        const fromAssess = params.get("from") === "assess";
        $("#homeBtn").hidden = fromAssess;
        $("#backBtn").hidden = !fromAssess;
        $("#homeBtn").addEventListener("click", () => (location.href = "home.html"));
        $("#backBtn").addEventListener("click", () => {
          const fid = record?.fieldId || currentFieldId() || "";
          location.href = `roster.html?test=gait&field=${fid}`;
        });

        $("#reportQr").src = REPORT_QR_SRC;
        initQrLink();
        $("#page").hidden = false;
        renderResult(subject, date, riskLevelOf(record));
        fitName();
        document.fonts?.ready.then(fitName);
        measure();
        new ResizeObserver(() => {
          measure();
          fitName();
        }).observe(stage);

        // 進場：卡片從遠處（translateZ、透明）轉入定位（0.8s）
        requestAnimationFrame(() => requestAnimationFrame(() => $("#card").classList.remove("is-entering")));
      }
      init();
    </script>
  </body>
</html>
