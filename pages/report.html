<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="../img/logo.png" />
    <link rel="apple-touch-icon" href="../img/logo.png" />
    <title>建豐健康科技 - 鑑測紀錄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css"
    />
    <style>
      /* =========================================================
       * 瓷白森林 Porcelain Forest — 專為 iPad 13 吋直式（1032 × 1376）設計
       * 鑑測紀錄頁
       * ========================================================= */
      :root {
        --bg: #ece7df; /* 暖瓷白：頁面底色 */
        --card: #f7f4ee; /* 卡片底色 */
        --card-deep: #e6dccb; /* 圖示底 */
        --line: #d9cfbe; /* 邊框 */
        --line-soft: #c7bba6; /* 虛線、未選中指示點 */
        --forest: #1f3b33; /* 森林綠：主色 */
        --brass: #b08d57; /* 黃銅：重點色 */
        --brass-text: #8f6e3c; /* 淺底上的黃銅文字 */
        --ink: #1a2420; /* 主要文字 */
        --muted: #6f6656; /* 次要文字 */
        --nav-off: #6f6656; /* 導航未選中 */
        --on-forest: #f6f1e8; /* 森林綠上的文字 */
        --danger: #b5473a; /* 錯誤訊息 */

        --font-sans: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
        --font-serif: "Noto Serif TC", "Songti TC", serif;
        /* 字級：四頁共用，同一種用途用同一個變數（其他字級以這些變數加減或倍數表示）
         * 大小順序：small < body < button < lead < title < display；card-name、hero-num 為大字專用 */
        --fs-display: 72px; /* 頁面大標題：問候語、登入、場域名稱、受測者管理 */
        --fs-hero-num: 88px; /* 大數字：今日數據、進度數字 */
        --fs-card-name: 84px; /* 測驗卡片名稱 */
        --fs-title: 44px; /* 面板與對話框標題 */
        --fs-lead: 32px; /* 重要內文：人員姓名、場域名稱、欄位輸入文字、影像上傳標題 */
        --fs-button: 30px; /* 按鈕文字、導航文字、toast */
        --fs-body: 26px; /* 一般內文、說明、欄位標籤、分段切換、搜尋框 */
        --fs-small: 24px; /* 輔助小字：日期、編號・年齡・性別、時間、徽章、小標籤、錯誤訊息 */

        --pad: 64px;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      .serif {
        font-family: var(--font-serif);
      }
      /* 表單元素與 placeholder 繼承頁面字型（瀏覽器預設不會繼承） */
      input,
      textarea,
      select,
      input::placeholder,
      textarea::placeholder {
        font: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
      }
      input {
        user-select: text;
        -webkit-user-select: text;
      }

      /* 進場動畫 */
      .rise {
        animation: rise 0.9s calc(var(--d, 0) * 1s) var(--ease-out) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== App 外層：開啟面板時整個退到後面（iOS 卡片式視窗） ===== */
      body.sheet-open {
        background: var(--ink);
      }
      .app {
        position: fixed;
        inset: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--bg);
        transform-origin: 50% 50%;
        transition:
          transform 0.5s var(--ease-out),
          border-radius 0.5s var(--ease-out),
          filter 0.5s var(--ease-out);
      }
      body.sheet-open .app {
        transform: scale(0.94);
        border-radius: 40px;
        filter: brightness(0.9);
        overflow: hidden;
      }

      /* 底部留 220px，名單最後一列不會被底部導航蓋住 */
      .page {
        padding: calc(56px + env(safe-area-inset-top)) var(--pad)
          calc(220px + env(safe-area-inset-bottom));
      }

      /* ===== 標題列 ===== */
      .titlebar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
      }
      .page-title {
        margin: 0;
        font-size: var(--fs-display);
        line-height: 1.2;
        font-weight: 600;
        white-space: nowrap;
      }
      .add-btn {
        flex: 0 0 auto;
        height: 88px;
        padding: 0 36px;
        border-radius: 999px;
        background: var(--card);
        border: 2px solid var(--line);
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: var(--fs-button);
        font-weight: 700;
        color: var(--forest);
        transition: transform 0.2s var(--ease-out);
      }
      .add-btn i {
        font-size: 1.2667em;
      }
      .add-btn:active {
        transform: scale(0.95);
      }

      /* ===== 場域卡：點整張卡打開場域面板 ===== */
      .field-card {
        margin-top: 36px;
        width: 100%;
        height: 120px;
        padding: 0 36px;
        display: flex;
        align-items: center;
        gap: 24px;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 36px;
        text-align: left;
        transition:
          transform 0.2s var(--ease-out),
          border-color 0.3s;
      }
      .field-card:active {
        transform: scale(0.99);
      }
      .field-card:focus-visible {
        outline: 3px solid var(--forest);
        outline-offset: 4px;
      }
      .fc-icon {
        flex: 0 0 auto;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--card-deep);
        display: grid;
        place-items: center;
        font-size: calc(var(--fs-lead) * 1.125);
        color: var(--brass-text);
      }
      .fc-main {
        flex: 1;
        min-width: 0;
      }
      .fc-label,
      .fc-name {
        display: block;
      }
      .fc-label {
        font-size: var(--fs-small);
        line-height: 1.3;
        color: var(--muted);
      }
      .fc-name {
        font-size: calc(var(--fs-lead) + 2px);
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fc-switch {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: calc(var(--fs-button) - 2px);
        font-weight: 700;
        color: var(--forest);
      }
      .fc-switch i {
        font-size: 1.0714em;
      }
      /* ===== 沒有場域：大卡片 ===== */
      .nofield {
        margin-top: 36px;
        padding: 96px 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 48px;
      }
      .nofield[hidden] {
        display: none;
      }
      /* 選好場域後：淡出並縮小，之後移除 */
      .nofield.is-leaving {
        opacity: 0;
        transform: scale(0.96);
        transition:
          opacity 0.3s var(--ease-out),
          transform 0.3s var(--ease-out);
      }
      .nf-icon {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: var(--card-deep);
        display: grid;
        place-items: center;
        font-size: calc(var(--fs-lead) * 2.25);
        color: var(--brass-text);
      }
      .nf-title {
        margin: 36px 0 0;
        font-size: calc(var(--fs-title) + 8px);
        line-height: 1.25;
        font-weight: 600;
      }
      .nf-sub {
        margin-top: 12px;
        font-size: calc(var(--fs-body) + 2px);
        line-height: 1.4;
        color: var(--muted);
      }
      .nf-btn {
        margin-top: 48px;
        height: 104px;
        padding: 0 72px;
        border-radius: 999px;
        background: var(--forest);
        color: var(--on-forest);
        font-size: calc(var(--fs-button) + 2px);
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        transition: transform 0.2s var(--ease-out);
      }
      .nf-btn i {
        font-size: 1.125em;
      }
      .nf-btn:active {
        transform: scale(0.97);
      }

      /* ===== 篩選區：捲到頂部時黏住（上方 24px、下方 16px） ===== */
      .sticky {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 24px 0 16px;
        background: var(--bg);
      }
      .search {
        height: 96px;
        display: flex;
        align-items: center;
        border-radius: 28px;
        background: var(--card);
        border: 2px solid var(--line);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .search:focus-within,
      .search-box:focus-within {
        border-color: var(--forest);
        box-shadow: 0 0 0 6px rgba(31, 59, 51, 0.12);
      }
      .search > .ti-search,
      .search-box > .ti-search {
        margin-left: 28px;
        font-size: calc((var(--fs-body) + 4px) * 1.2);
        color: var(--brass-text);
      }
      .search-input {
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0 20px;
        border: none;
        outline: none;
        background: transparent;
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: calc(var(--fs-body) + 4px);
      }
      .search-input::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }
      .search-input::-webkit-search-cancel-button {
        display: none;
      }
      .search-clear {
        width: 72px;
        height: 72px;
        margin-right: 10px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: var(--fs-lead);
        color: var(--muted);
      }
      .search-clear[hidden] {
        display: none;
      }
      .search-clear:active {
        background: var(--card-deep);
      }
      .count {
        margin-top: 12px;
        text-align: right;
        font-size: var(--fs-small);
        line-height: 1.3;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* ===== 人員名單 ===== */
      .list-wrap {
        margin-top: 16px;
      }
      .list.is-updating {
        animation: listIn 0.3s var(--ease-out);
      }
      @keyframes listIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      .list-card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 40px;
        overflow: hidden;
      }
      .srow {
        height: 132px;
        padding: 0 32px;
        display: flex;
        align-items: center;
        gap: 26px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .srow + .srow {
        border-top: 2px solid #e6dfd2;
      }
      .srow:active {
        background: rgba(176, 141, 87, 0.08);
      }
      .srow:focus-visible {
        outline: 3px solid var(--forest);
        outline-offset: -3px;
      }
      /* 新增或編輯後：淡黃銅色底閃一次 */
      .srow.flash {
        animation: flash 1.2s var(--ease-out);
      }
      @keyframes flash {
        from {
          background: rgba(176, 141, 87, 0.28);
        }
        to {
          background: transparent;
        }
      }
      .avatar {
        flex: 0 0 auto;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--card-deep);
        color: var(--brass-text);
        display: grid;
        place-items: center;
        font-size: calc(var(--fs-lead) + 2px);
        font-weight: 600;
      }
      .s-main {
        flex: 1;
        min-width: 0;
      }
      .s-name {
        font-size: calc(var(--fs-lead) + 2px);
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .s-meta {
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: var(--fs-small);
        color: var(--muted);
      }
      .s-meta-text {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .s-tag {
        flex: 0 0 auto;
        padding: 2px 12px;
        border: 1.5px solid var(--brass);
        border-radius: 999px;
        font-size: calc(var(--fs-small) - 4px);
        font-weight: 700;
        color: var(--brass-text);
      }
      mark {
        background: rgba(176, 141, 87, 0.22);
        color: var(--brass-text);
        border-radius: 6px;
        padding: 0;
      }
      .btn-edit {
        flex: 0 0 auto;
        height: 64px;
        padding: 0 26px;
        border-radius: 999px;
        background: transparent;
        border: 2px solid var(--line-soft);
        font-size: calc(var(--fs-button) - 4px);
        font-weight: 700;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.2s var(--ease-out);
      }
      .btn-edit i {
        font-size: 1.0769em;
      }
      .btn-edit:active {
        transform: scale(0.95);
      }

      /* 空狀態 */
      .empty {
        padding: 96px 0;
        text-align: center;
      }
      .empty > i {
        font-size: calc(var(--fs-lead) * 2);
        color: var(--line-soft);
      }
      .empty-title {
        margin-top: 16px;
        font-size: calc(var(--fs-body) + 4px);
        font-weight: 700;
      }
      .empty-sub {
        margin-top: 8px;
        font-size: var(--fs-small);
        color: var(--muted);
      }

      /* ===== 底部膠囊導航（與 home.html 相同） ===== */
      .nav {
        position: fixed;
        left: 50%;
        bottom: calc(36px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 999px;
        box-shadow: 0 12px 40px rgba(31, 59, 51, 0.1);
        z-index: 100;
        animation: navIn 1s 0.5s var(--ease-spring) both;
      }
      @keyframes navIn {
        from {
          transform: translate(-50%, 200%);
        }
        to {
          transform: translate(-50%, 0);
        }
      }
      .nav-item {
        height: 92px;
        min-width: 104px;
        padding: 0 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        color: var(--nav-off);
        font-size: calc(var(--fs-button) + 4px);
        font-weight: 700;
        transition:
          background 0.45s var(--ease-spring),
          color 0.3s,
          padding 0.45s var(--ease-spring);
      }
      .nav-item i {
        font-size: 1.3529em;
        transition: transform 0.45s var(--ease-spring);
      }
      .nav-item span {
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        white-space: nowrap;
        transition:
          max-width 0.45s var(--ease-spring),
          opacity 0.3s,
          margin 0.45s var(--ease-spring);
      }
      .nav-item.is-active {
        background: var(--forest);
        color: var(--on-forest);
        padding: 0 44px;
      }
      .nav-item.is-active span {
        max-width: 5em;
        opacity: 1;
        margin-left: 14px;
      }
      .nav-item:active i {
        transform: scale(0.82);
      }

      /* =========================================================
       * 底部面板共用（切換場域、選擇日期範圍）
       * --vh：可見高度；--kb：鍵盤高度（皆由 visualViewport 更新）
       * ========================================================= */
      .mask {
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 26, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s var(--ease-out);
        z-index: 200;
      }
      .mask.is-open {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--kb, 0px);
        max-height: calc(var(--vh, 100dvh) - 120px);
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border-radius: 48px 48px 0 0;
        box-shadow: 0 -12px 40px rgba(31, 59, 51, 0.12);
        transform: translateY(calc(100% + var(--kb, 0px) + 40px));
        visibility: hidden;
        transition:
          transform 0.5s var(--ease-out),
          visibility 0s 0.5s;
        z-index: 210;
      }
      .sheet.is-open {
        transform: translateY(0);
        visibility: visible;
        transition:
          transform 0.5s var(--ease-out),
          visibility 0s;
      }
      .sheet.is-dragging {
        transition: none;
      }
      .sheet-grab {
        flex: 0 0 auto;
        padding: 16px 56px 8px;
        touch-action: none;
        cursor: grab;
      }
      .grab-bar {
        display: block;
        width: 64px;
        height: 8px;
        margin: 0 auto;
        border-radius: 4px;
        background: var(--line-soft);
      }
      .sheet-head {
        margin-top: 16px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
      }
      .sheet-title {
        margin: 0;
        font-size: calc(var(--fs-title) + 12px);
        line-height: 1.2;
        font-weight: 600;
      }
      .sheet-sub {
        margin-top: 4px;
        font-size: var(--fs-body);
        color: var(--muted);
        font-weight: 500;
      }
      .sheet-close {
        flex: 0 0 auto;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--card);
        border: 2px solid var(--line);
        display: grid;
        place-items: center;
        font-size: calc(var(--fs-lead) * 1.125);
        transition: transform 0.2s var(--ease-out);
      }
      .sheet-close:active {
        transform: scale(0.92);
      }
      .sheet-foot {
        flex: 0 0 auto;
        padding: 24px 56px calc(24px + env(safe-area-inset-bottom));
        background: var(--bg);
        border-top: 1px solid var(--line);
      }
      .primary-btn {
        width: 100%;
        height: 112px;
        border-radius: 999px;
        background: var(--forest);
        color: var(--on-forest);
        font-size: calc(var(--fs-button) + 6px);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        transition: transform 0.2s var(--ease-out);
      }
      .primary-btn:active {
        transform: scale(0.98);
      }

      /* =========================================================
       * 切換場域面板（與 home.html 的選擇場域面板相同：單一固定高度）
       * ========================================================= */
      .field-sheet {
        height: calc(var(--vh, 100dvh) - 120px);
        max-height: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .field-sheet .sheet-foot {
        border-top: none;
      }
      /* 場域面板開啟時 toast 稍微上移，停在面板頂端（120px）上方，不與面板重疊 */
      body.field-open .toast {
        top: calc(20px + env(safe-area-inset-top));
      }
      .fs-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .search-box {
        flex: 0 0 auto;
        margin: 16px 56px 0;
        height: 96px;
        display: flex;
        align-items: center;
        border-radius: 28px;
        background: var(--card);
        border: 2px solid var(--line);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .field-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 56px 32px;
      }
      .field-list.shake {
        animation: shake 0.4s var(--ease-out);
      }
      @keyframes shake {
        0%,
        100% {
          transform: none;
        }
        20% {
          transform: translateX(-14px);
        }
        40% {
          transform: translateX(12px);
        }
        60% {
          transform: translateX(-8px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      .sheet-section {
        margin: 32px 0 16px;
        font-size: var(--fs-small);
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.1em;
      }
      .list-empty {
        padding: 96px 0;
        text-align: center;
      }
      .list-empty i {
        font-size: calc(var(--fs-lead) * 2);
        color: var(--line-soft);
      }
      .list-empty-title {
        margin-top: 16px;
        font-size: calc(var(--fs-body) + 4px);
        font-weight: 700;
      }
      .list-empty-sub {
        margin-top: 8px;
        font-size: var(--fs-small);
        color: var(--muted);
      }
      .frow {
        height: 104px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        gap: 20px;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 28px;
        cursor: pointer;
        transition:
          transform 0.2s var(--ease-out),
          border-color 0.25s,
          background 0.25s;
      }
      .frow + .frow {
        margin-top: 12px;
      }
      .frow:active {
        transform: scale(0.98);
      }
      .frow:focus-visible {
        outline: 3px solid var(--forest);
        outline-offset: 3px;
      }
      .frow-radio {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid var(--line-soft);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: var(--fs-body);
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .frow-radio i {
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.25s var(--ease-spring);
      }
      .frow-radio.pop {
        animation: radioPop 0.35s var(--ease-spring);
      }
      @keyframes radioPop {
        0% {
          transform: scale(0.8);
        }
        60% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
      .frow-name {
        flex: 0 1 auto;
        min-width: 0;
        font-size: var(--fs-lead);
        font-weight: 700;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .frow-tag {
        display: none;
        flex: 0 0 auto;
        padding: 4px 14px;
        border-radius: 999px;
        background: var(--forest);
        color: var(--on-forest);
        font-size: calc(var(--fs-small) - 4px);
        font-weight: 700;
        line-height: 1.3;
      }
      .frow.is-selected {
        border-color: var(--forest);
        background: #eef1ec;
      }
      .frow.is-selected .frow-radio {
        background: var(--forest);
        border-color: var(--forest);
      }
      .frow.is-selected .frow-radio i {
        opacity: 1;
        transform: none;
      }
      .frow.is-selected .frow-tag {
        display: inline-block;
      }

      /* =========================================================
       * 選擇日期範圍面板（外觀沿用新增人員面板）
       * ========================================================= */
      .sheet-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 24px 56px 32px;
      }
      .f-field + .f-field {
        margin-top: 28px;
      }
      .f-label {
        display: block;
        margin-bottom: 10px;
        font-size: var(--fs-body);
        line-height: 1.25;
        font-weight: 700;
      }
      .f-input-wrap {
        height: 104px;
        display: flex;
        align-items: center;
        border-radius: 28px;
        background: var(--card);
        border: 2px solid var(--line);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .f-input-wrap:focus-within {
        border-color: var(--forest);
        box-shadow: 0 0 0 6px rgba(31, 59, 51, 0.12);
      }
      .f-input {
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0 28px;
        border: none;
        outline: none;
        background: transparent;
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: var(--fs-lead);
      }
      .f-input::placeholder {
        color: var(--line-soft);
      }

      /* 出生年月日：按鈕形式的欄位，點擊打開滾輪選擇器 */
      .birth-btn {
        width: 100%;
        padding: 0 28px;
        gap: 16px;
        font-size: var(--fs-lead);
        text-align: left;
        cursor: pointer;
      }
      .birth-btn:focus-visible {
        outline: none;
        border-color: var(--forest);
        box-shadow: 0 0 0 6px rgba(31, 59, 51, 0.12);
      }
      .birth-ico {
        flex: 0 0 auto;
        font-size: 1.125em;
        color: var(--brass-text);
      }
      .birth-text {
        flex: 1;
        min-width: 0;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .birth-btn.has-value {
        border-color: var(--forest);
      }
      .birth-btn.has-value .birth-text {
        color: var(--ink);
        font-weight: 700;
      }
      .birth-text em,
      .picker-preview em {
        font-style: normal;
        color: var(--brass-text);
        font-weight: 700;
      }
      .birth-chev {
        flex: 0 0 auto;
        font-size: 1em;
        color: var(--muted);
      }
      .f-error {
        display: none;
        margin-top: 10px;
        font-size: var(--fs-small);
        line-height: 30px;
        font-weight: 700;
        color: var(--danger);
        align-items: center;
        gap: 8px;
      }
      .has-error .f-error {
        display: flex;
      }
      .has-error .f-input-wrap {
        border-color: var(--danger);
        box-shadow: none;
      }

      /* =========================================================
       * 按鈕列（日期選擇視窗的「取消」「確定」共用）
       * ========================================================= */
      .dlg-actions {
        margin-top: 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .dlg-btn {
        height: 96px;
        border-radius: 999px;
        font-size: calc(var(--fs-button) + 2px);
        font-weight: 700;
        transition: transform 0.2s var(--ease-out);
      }
      .dlg-btn:active {
        transform: scale(0.97);
      }
      .dlg-btn.secondary {
        border: 2px solid var(--line-soft);
        color: var(--ink);
      }
      .dlg-btn.primary {
        background: var(--forest);
        color: var(--on-forest);
      }

      /* =========================================================
       * 日期選擇視窗（民國年滾輪）：疊在日期範圍面板上面
       * ========================================================= */
      .picker-mask {
        z-index: 300;
      }
      .picker {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 720px;
        padding: 48px 56px;
        background: var(--card);
        border-radius: 44px;
        box-shadow: 0 24px 80px rgba(20, 30, 26, 0.25);
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, -50%) scale(0.92);
        transition:
          opacity 0.35s var(--ease-spring),
          transform 0.35s var(--ease-spring),
          visibility 0s 0.35s;
        z-index: 310;
      }
      .picker.is-open {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, -50%) scale(1);
        transition:
          opacity 0.35s var(--ease-spring),
          transform 0.35s var(--ease-spring),
          visibility 0s;
      }
      .picker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .picker-title {
        margin: 0;
        font-size: var(--fs-title);
        line-height: 1.25;
        font-weight: 600;
      }
      .picker-close {
        flex: 0 0 auto;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--bg);
        display: grid;
        place-items: center;
        font-size: var(--fs-lead);
        transition: transform 0.2s var(--ease-out);
      }
      .picker-close:active {
        transform: scale(0.92);
      }
      .picker-preview {
        margin-top: 12px;
        font-size: calc(var(--fs-lead) - 2px);
        font-weight: 700;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      /* 三欄滾輪：年:月:日 = 1.3:1:1；可見 400px，每個選項 80px */
      .wheels {
        position: relative;
        margin-top: 32px;
        height: 400px;
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 8px;
        -webkit-mask-image: linear-gradient(
          transparent,
          #000 120px,
          #000 280px,
          transparent
        );
        mask-image: linear-gradient(
          transparent,
          #000 120px,
          #000 280px,
          transparent
        );
      }
      .wheel-band {
        position: absolute;
        left: 0;
        right: 0;
        top: 160px;
        height: 80px;
        background: var(--bg);
        border-radius: 24px;
        border-top: 2px solid var(--line);
        border-bottom: 2px solid var(--line);
        pointer-events: none;
      }
      .wheel {
        position: relative;
        height: 400px;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        overscroll-behavior: contain;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .wheel::-webkit-scrollbar {
        display: none;
      }
      .wheel-pad {
        height: 160px;
      }
      .wheel-item {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: center;
        font-size: calc(var(--fs-lead) - 2px);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        transition:
          font-size 0.15s,
          color 0.15s;
      }
      .wheel-item.is-center {
        font-size: calc(var(--fs-lead) + 4px);
        font-weight: 700;
        color: var(--ink);
      }
      .wheel-item.is-disabled {
        color: var(--line-soft);
      }
      .picker-actions {
        margin-top: 40px;
      }

      /* =========================================================
       * 鑑測紀錄：篩選區、日期分組清單
       * ========================================================= */
      /* 篩選區三排：搜尋、測驗、日期（整個容器黏在上方） */
      .filters {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .list-wrap {
        margin-top: 0;
      }
      .count {
        margin-top: 0;
      }

      /* 測驗篩選：分段切換（樣式與滑塊動畫同 roster.html） */
      .seg {
        --n: 3;
        --i: 0;
        position: relative;
        display: grid;
        grid-template-columns: repeat(var(--n), 1fr);
        height: 88px;
        padding: 8px;
        border-radius: 999px;
        background: #e3dbcd;
      }
      .seg-thumb {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 8px;
        width: calc((100% - 16px) / var(--n));
        border-radius: 999px;
        background: var(--forest);
        box-shadow: 0 6px 16px rgba(31, 59, 51, 0.18);
        transform: translateX(calc(var(--i) * 100%));
        transition: transform 0.4s var(--ease-spring);
      }
      .seg-btn {
        position: relative;
        z-index: 1;
        border-radius: 999px;
        font-size: calc(var(--fs-body) + 2px);
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        transition: color 0.3s;
      }
      .seg-btn em {
        margin-left: 8px;
        font-style: normal;
        opacity: 0.55;
        font-variant-numeric: tabular-nums;
      }
      .seg-btn.is-active {
        color: var(--on-forest);
      }
      .seg-btn.is-active em {
        opacity: 0.7;
      }

      /* 日期快速篩選：膠囊標籤，一次只能選一個 */
      .chips {
        display: flex;
        gap: 12px;
      }
      .chip {
        flex: 0 0 auto;
        height: 64px;
        padding: 0 28px;
        border-radius: 999px;
        background: var(--card);
        border: 2px solid var(--line);
        font-size: var(--fs-body);
        font-weight: 700;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        transition:
          background 0.25s,
          border-color 0.25s,
          color 0.25s,
          transform 0.2s var(--ease-out);
      }
      .chip:active {
        transform: scale(0.97);
      }
      .chip.is-active {
        background: var(--forest);
        border-color: var(--forest);
        color: var(--on-forest);
      }
      .chip i {
        font-size: 1.15em;
      }
      /* 自訂日期：膠囊裡放「打開面板」和「✕ 清除」兩個按鈕 */
      .chip-custom {
        padding: 0;
        gap: 0;
      }
      .chip-hit {
        height: 100%;
        padding: 0 28px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-variant-numeric: tabular-nums;
      }
      .chip-custom.has-range .chip-hit {
        padding-right: 8px;
      }
      .chip-x {
        width: 44px;
        height: 44px;
        margin-right: 10px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(246, 241, 232, 0.16);
      }
      .chip-x[hidden] {
        display: none;
      }
      .chip-x i {
        font-size: 0.9em;
      }

      /* 日期分組：小標題捲動時黏在篩選區下方（--filter-h 由 JS 量測） */
      .day-head {
        position: sticky;
        top: var(--filter-h, 0px);
        z-index: 4;
        margin: 32px 0 0;
        padding-bottom: 12px;
        background: var(--bg);
        font-size: var(--fs-body);
        font-weight: 700;
        color: var(--muted);
      }
      .srow.rec-row {
        height: auto;
        min-height: 148px;
        padding: 18px 32px;
      }
      .rec-test {
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--fs-small);
        font-weight: 700;
        color: var(--brass-text);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .rec-test i {
        font-size: 1.2em;
      }
      .rec-test .s-tag {
        margin-left: 4px;
        font-weight: 700;
      }
      /* 篩選後沒有結果：次要按鈕「清除篩選」 */
      .empty-btn {
        margin-top: 32px;
        height: 80px;
        padding: 0 44px;
        border-radius: 999px;
        border: 2px solid var(--line-soft);
        font-size: var(--fs-button);
        font-weight: 700;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: transform 0.2s var(--ease-out);
      }
      .empty-btn:active {
        transform: scale(0.97);
      }

      /* ===== 提示訊息（高於面板） ===== */
      .toast {
        position: fixed;
        left: 50%;
        top: calc(36px + env(safe-area-inset-top));
        transform: translate(-50%, -24px);
        padding: 22px 40px;
        border-radius: 999px;
        background: var(--forest);
        color: var(--on-forest);
        font-size: var(--fs-button);
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: all 0.35s var(--ease-spring);
        z-index: 600;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <main class="page">
        <!-- 標題列 -->
        <header class="titlebar rise" style="--d: 0.05">
          <h1 class="page-title serif">鑑測紀錄</h1>
        </header>

        <!-- 沒有場域：一張大卡片（有場域時隱藏） -->
        <section class="nofield rise" style="--d: 0.11" id="noField" hidden>
          <span class="nf-icon"><i class="ti ti-map-pin"></i></span>
          <h2 class="nf-title serif">請先選擇場域</h2>
          <div class="nf-sub">選擇場域後即可查看該場域的鑑測紀錄</div>
          <button class="nf-btn" id="nfBtn" type="button">
            <i class="ti ti-map-pin"></i>選擇場域
          </button>
        </section>

        <!-- 有場域：場域卡＋篩選區＋紀錄（沒有場域時隱藏） -->
        <div id="fieldView" hidden>
          <!-- 目前場域：點整張卡打開切換場域面板 -->
          <button
            class="field-card rise"
            style="--d: 0.11"
            id="fieldCard"
            type="button"
          >
            <span class="fc-icon"><i class="ti ti-map-pin"></i></span>
            <span class="fc-main">
              <span class="fc-label">目前場域</span>
              <span class="fc-name" id="fcName"></span>
            </span>
            <span class="fc-switch"
              ><span>切換</span><i class="ti ti-chevron-right"></i
            ></span>
          </button>

          <!-- 篩選區：搜尋、測驗、日期（捲動時整個容器黏在上方） -->
          <div class="sticky" id="filterBar">
            <div class="filters rise" style="--d: 0.17" id="searchRise">
              <label class="search">
                <i class="ti ti-search"></i>
                <input
                  class="search-input"
                  id="searchInput"
                  type="search"
                  placeholder="搜尋姓名或編號"
                  autocomplete="off"
                  autocorrect="off"
                  spellcheck="false"
                  enterkeyhint="search"
                />
                <button
                  class="search-clear"
                  id="searchClear"
                  type="button"
                  aria-label="清除搜尋"
                  hidden
                >
                  <i class="ti ti-x"></i>
                </button>
              </label>

              <div class="seg" id="testSeg" role="tablist" aria-label="測驗篩選">
                <span class="seg-thumb"></span>
                <button class="seg-btn is-active" type="button" role="tab" data-test="all" aria-selected="true">
                  全部<em id="cntAll">0</em>
                </button>
                <button class="seg-btn" type="button" role="tab" data-test="sppb" aria-selected="false">
                  SPPB<em id="cntSppb">0</em>
                </button>
                <button class="seg-btn" type="button" role="tab" data-test="gait" aria-selected="false">
                  行走測驗<em id="cntGait">0</em>
                </button>
              </div>

              <div class="chips" id="dateChips" role="group" aria-label="日期篩選">
                <button class="chip is-active" type="button" data-range="all" aria-pressed="true">全部日期</button>
                <button class="chip" type="button" data-range="week" aria-pressed="false">本週</button>
                <button class="chip" type="button" data-range="month" aria-pressed="false">本月</button>
                <span class="chip chip-custom" id="customChip">
                  <button class="chip-hit" type="button" id="customBtn" data-range="custom" aria-pressed="false">
                    <i class="ti ti-calendar"></i><span id="customText">自訂日期</span>
                  </button>
                  <button class="chip-x" type="button" id="customClear" aria-label="清除自訂日期" hidden>
                    <i class="ti ti-x"></i>
                  </button>
                </span>
              </div>
            </div>
          </div>

          <!-- 筆數＋紀錄清單（依日期分組） -->
          <section class="list-wrap rise" style="--d: 0.23" id="listRise">
            <div class="count" id="count" aria-live="polite"></div>
            <div class="list" id="list"></div>
          </section>
        </div>
      </main>

      <nav class="nav" id="nav"></nav>
    </div>

    <!-- 切換場域：底部面板 -->
    <div class="mask" id="fieldMask"></div>
    <section
      class="sheet field-sheet"
      id="fieldSheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="fieldSheetTitle"
      aria-hidden="true"
    >
      <div class="sheet-grab" id="fieldGrab">
        <span class="grab-bar"></span>
        <header class="sheet-head">
          <div>
            <h2 class="sheet-title serif" id="fieldSheetTitle">切換場域</h2>
            <div class="sheet-sub">選擇要查看紀錄的場域</div>
          </div>
          <button
            class="sheet-close"
            id="fieldClose"
            type="button"
            aria-label="關閉"
          >
            <i class="ti ti-x"></i>
          </button>
        </header>
      </div>

      <div class="fs-body">
        <!-- 搜尋框：固定在上方，不跟著清單捲動 -->
        <label class="search-box">
          <i class="ti ti-search"></i>
          <input
            class="search-input"
            id="fsInput"
            type="search"
            placeholder="搜尋場域名稱"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="search"
          />
          <button
            class="search-clear"
            id="fsClear"
            type="button"
            aria-label="清除搜尋"
            hidden
          >
            <i class="ti ti-x"></i>
          </button>
        </label>
        <!-- 清單：最近使用＋全部場域，或搜尋結果 -->
        <div
          class="field-list"
          id="fieldList"
          role="radiogroup"
          aria-label="場域"
        ></div>
      </div>

      <footer class="sheet-foot">

    <!-- 日期選擇視窗（開始／結束日期，標題由 JS 設定） -->
