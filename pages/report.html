    <div class="toast" id="toast"></div>

    <script>
      /* =========================================================
       * 設定區
       * ========================================================= */
      const CONFIG = {
        // 底部導航（與其他頁重複，之後改成共用設定或 API）
        nav: [
          {
            id: "home",
            label: "鑑測",
            icon: "ti-scan",
            href: "home.html",
            ready: true,
          },
          {
            id: "report",
            label: "紀錄",
            icon: "ti-history",
            href: "report.html",
            ready: true,
          },
          {
            id: "subjects",
            label: "受測者",
            icon: "ti-users",
            href: "subjects.html",
            ready: true,
          },
          {
            id: "settings",
            label: "設定",
            icon: "ti-settings",
            href: "settings.html",
            ready: false,
          },
        ],

        // 測驗項目（從 home.html 複製）
        tests: [
          {
            id: "sppb",
            name: "SPPB",
            desc: "簡易身體功能評估",
            minutes: 5,
            output: "跌倒風險評估",
            icon: "ti-activity",
          },
          {
            id: "gait",
            name: "行走測驗",
            desc: "步態分析",
            minutes: 2,
            output: "步速與步態報告",
            icon: "ti-walk",
          },
          // { id: "grip", name: "握力測驗", desc: "上肢肌力", minutes: 3, output: "握力評估", icon: "ti-hand-grab" },
        ],

        // 鑑測場域、受測人員：與其他頁重複，之後改成共用設定或 API
        fields: [
          { id: "tpe-01", name: "大安社區關懷據點" },
          { id: "tpe-02", name: "信義長照中心" },
          { id: "tpe-03", name: "中正區活動中心" },
          { id: "tpe-04", name: "北投社區關懷據點" },
        ],

        // 受測人員（假資料）
        // TODO：之後改成依 field 從 API 取得名單，例如 fetch(`/api/fields/${field.id}/subjects`)
        // birth：西元 "YYYY-MM-DD"；code：現場新增的人為 null
        // source："import" 後台匯入／"onsite" 現場新增；done：{ 測驗 id: 完成時間 }
        subjects: [
          {
            id: "s001",
            code: "A001",
            name: "林淑芬",
            birth: "1948-03-12",
            gender: "女",
            source: "import",
            done: { sppb: "14:05" },
          },
          {
            id: "s002",
            code: "A002",
            name: "王小明",
            birth: "1954-07-21",
            gender: "男",
            source: "import",
            done: {},
          },
          {
            id: "s003",
            code: "A003",
            name: "陳美玉",
            birth: "1945-01-30",
            gender: "女",
            source: "import",
            done: { sppb: "13:52" },
          },
          {
            id: "s004",
            code: "A004",
            name: "張志明",
            birth: "1957-05-08",
            gender: "男",
            source: "import",
            done: {},
          },
        ],

        // 鑑測紀錄（假資料）：{ id, subjectId, test, date, time, retest }
        // date 依今天往前推算；今天這 12 筆與 roster.html 已完成 SPPB 的人員和時間相同
        // retest：同一個人同一天同一項測驗的第二次
        // 假資料階段：同一份紀錄套用到每個場域
        // TODO：之後改成依場域從 API 取得，例如 fetch(`/api/fields/${field.id}/records`)
        records: [
          // 今天：與名單頁已完成 SPPB 的 2 位相同（同一人、同時間）
          { id: "r001", subjectId: "s001", test: "sppb", date: daysAgo(0), time: "14:05" },
          { id: "r002", subjectId: "s003", test: "sppb", date: daysAgo(0), time: "13:52" },
          // 過去 60 天
          { id: "r101", subjectId: "s002", test: "gait", date: daysAgo(1), time: "15:20" },
          { id: "r102", subjectId: "s004", test: "sppb", date: daysAgo(3), time: "10:40" },
          { id: "r103", subjectId: "s004", test: "sppb", date: daysAgo(3), time: "11:05", retest: true },
          { id: "r104", subjectId: "s001", test: "gait", date: daysAgo(9), time: "09:30" },
          { id: "r105", subjectId: "s003", test: "gait", date: daysAgo(17), time: "14:15" },
          { id: "r106", subjectId: "s002", test: "sppb", date: daysAgo(26), time: "10:10" },
          { id: "r107", subjectId: "s001", test: "sppb", date: daysAgo(40), time: "13:45" },
          { id: "r108", subjectId: "s003", test: "sppb", date: daysAgo(55), time: "11:20" },
        ],
      };

      /* =========================================================
       * 共用功能
       * ========================================================= */
      const $ = (sel) => document.querySelector(sel);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      let toastTimer;
      function showToast(msg) {
        const el = $("#toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
      }

      // 底部導航：依目前頁面標出選中項目，點其他項目時膠囊先展開再換頁
      function renderNav() {
        const nav = $("#nav");
        if (!nav) return;
        const current = location.pathname.split("/").pop() || "home.html";

        nav.innerHTML = CONFIG.nav
          .map(
            (n) => `
      <button class="nav-item ${n.href === current ? "is-active" : ""}" data-href="${n.href}" data-ready="${n.ready}" aria-label="${n.label}">
        <i class="ti ${n.icon}"></i><span>${n.label}</span>
      </button>`,
          )
          .join("");

        nav.addEventListener("click", (e) => {
          const btn = e.target.closest(".nav-item");
          if (!btn || btn.classList.contains("is-active")) return;
          if (btn.dataset.ready !== "true") {
            showToast(`「${btn.getAttribute("aria-label")}」頁面製作中`);
            return;
          }
          nav.querySelector(".is-active")?.classList.remove("is-active");
          btn.classList.add("is-active");
          setTimeout(() => (location.href = btn.dataset.href), 380);
        });
      }

      // 搜尋：不分大小寫，「臺」視同「台」，空白分隔的多個關鍵字都要符合
      const norm = (s) => String(s).toLowerCase().replace(/臺/g, "台");
      const termsOf = (q) => norm(q).split(/\s+/).filter(Boolean);
      // 符合關鍵字的部分用 <mark> 標出（norm 不改變字數，位置可直接對應原文）
      function highlight(text, terms) {
        text = String(text);
        if (!terms.length) return esc(text);
        const n = norm(text);
        const hit = new Array(text.length).fill(false);
        terms.forEach((t) => {
          for (let i = n.indexOf(t); i !== -1; i = n.indexOf(t, i + 1)) {
            for (let k = i; k < i + t.length; k++) hit[k] = true;
          }
        });
        let html = "";
        for (let i = 0; i < text.length; ) {
          let j = i;
          while (j < text.length && hit[j] === hit[i]) j++;
          const part = esc(text.slice(i, j));
          html += hit[i] ? `<mark>${part}</mark>` : part;
          i = j;
        }
        return html;
      }

      // 分段切換：移動滑塊到第 i 個
      function setSeg(seg, i) {
        seg.style.setProperty("--i", i);
        [...seg.querySelectorAll(".seg-btn")].forEach((b, k) => {
          b.classList.toggle("is-active", k === i);
          b.setAttribute(
            b.getAttribute("role") === "tab" ? "aria-selected" : "aria-checked",
            k === i,
          );
        });
      }

      // 鍵盤彈出時：--vh 為可見高度、--kb 為被鍵盤蓋住的高度，讓面板與底部按鈕保持可見
      (() => {
        const vv = window.visualViewport;
        if (!vv) return;
        const sync = () => {
          const root = document.documentElement.style;
          root.setProperty("--vh", `${vv.height}px`);
          root.setProperty(
            "--kb",
            `${Math.max(0, innerHeight - vv.height - vv.offsetTop)}px`,
          );
        };
        vv.addEventListener("resize", sync);
        vv.addEventListener("scroll", sync);
        sync();
      })();

      // 年齡：依今天日期計算，未滿生日減 1；birth 為西元 "YYYY-MM-DD"
      function ageFrom(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        const now = new Date();
        const beforeBirthday =
          now.getMonth() + 1 < m ||
          (now.getMonth() + 1 === m && now.getDate() < d);
        return now.getFullYear() - y - (beforeBirthday ? 1 : 0);
      }
      const subjectAge = (s) => (s.birth ? ageFrom(s.birth) : s.age);

      /* =========================================================
       * sessionStorage（關閉分頁即清除；讀寫都包 try/catch）
       * kf.currentField  { id, date }：date 不是今天就當作沒有目前場域（與 home.html 相同）
       * kf.recentFields  [{ id, usedAt }]：最近使用，最新在前，最多 20 筆
       * kf.subjects.<fieldId>（與 roster.html 共用）
       *   { added: [現場新增的人員], done: {...}, edits: { 人員 id: { name, gender, birth, updatedAt } } }
       *   後台匯入的人被編輯 → 存在 edits；現場新增的人被編輯 → 直接更新 added 裡那一筆
       * ========================================================= */
      const FIELD_KEYS = {
        current: "kf.currentField",
        recent: "kf.recentFields",
      };
      const RECENT_MAX = 20;
      const fieldById = new Map(CONFIG.fields.map((f) => [f.id, f]));

      function readJSON(key, fallback) {
        try {
          const v = JSON.parse(sessionStorage.getItem(key));
          return v ?? fallback;
        } catch (e) {
          return fallback;
        }
      }
      function writeJSON(key, val) {
        try {
          sessionStorage.setItem(key, JSON.stringify(val));
        } catch (e) {}
      }
      function todayStr() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      }

      const fieldStore = {
        getCurrent() {
          const v = readJSON(FIELD_KEYS.current, null);
          if (!v || v.date !== todayStr()) return null;
          return fieldById.get(v.id) || null;
        },
        setCurrent(id) {
          writeJSON(FIELD_KEYS.current, { id, date: todayStr() });
          const rest = this.getRecent().filter((r) => r.id !== id);
          writeJSON(
            FIELD_KEYS.recent,
            [{ id, usedAt: Date.now() }, ...rest].slice(0, RECENT_MAX),
          );
        },
        // 最近使用：最新在前；舊格式（純 id 陣列）依原順序換算成時間戳
        getRecent() {
          const raw = readJSON(FIELD_KEYS.recent, []);
          if (!Array.isArray(raw)) return [];
          const now = Date.now();
          const seen = new Set();
          return raw
            .map((r, i) =>
              typeof r === "string"
                ? { id: r, usedAt: now - (i + 1) }
                : { id: r?.id, usedAt: Number(r?.usedAt) || 0 },
            )
            .filter(
              (r) => fieldById.has(r.id) && !seen.has(r.id) && seen.add(r.id),
            )
            .sort((a, b) => b.usedAt - a.usedAt)
            .slice(0, RECENT_MAX);
        },
      };

      const subjectKey = (fieldId) => `kf.subjects.${fieldId}`;
      function loadLocal(fieldId) {
        try {
          const v = JSON.parse(sessionStorage.getItem(subjectKey(fieldId)));
          const obj = (x) => (x && typeof x === "object" ? x : {});
          return {
            added: Array.isArray(v?.added) ? v.added : [],
            done: obj(v?.done),
            edits: obj(v?.edits),
          };
        } catch (e) {
          return { added: [], done: {}, edits: {} };
        }
      }
      function saveLocal(fieldId, data) {
        try {
          sessionStorage.setItem(subjectKey(fieldId), JSON.stringify(data));
        } catch (e) {}
      }

      /* 這頁要管理的場域（只用來顯示，不改寫 kf.currentField）：
       * a. kf.currentField 日期是今天 → 用它
       * b. 否則用 kf.recentFields 第一筆（最近使用，不論日期）
       * c. 再否則 kf.currentField 有值但不是今天 → 也用它
       * d. 都沒有 → 沒有場域
       * id 不在 CONFIG.fields 裡的視為沒有，繼續往下一條找 */
      function resolveField() {
        const cur = readJSON(FIELD_KEYS.current, null);
        const curField = (cur && fieldById.get(cur.id)) || null;
        if (curField && cur.date === todayStr()) return curField; // a
        const recent = fieldStore.getRecent(); // 已排除不存在的 id
        if (recent.length) return fieldById.get(recent[0].id); // b
        return curField; // c；沒有就是 null（d）
      }

      let field = resolveField();
      let local = field ? loadLocal(field.id) : null;


      /* =========================================================
       * 人員：後台匯入的人套用 kf.subjects.<fieldId> 的 edits（姓名、性別、出生日期），與其他頁一致
       * ========================================================= */
      function subjectMap() {
        const m = new Map();
        CONFIG.subjects.forEach((s) => {
          const e = local?.edits?.[s.id];
          m.set(
            s.id,
            e
              ? {
                  ...s,
                  name: e.name ?? s.name,
                  gender: e.gender ?? s.gender,
                  birth: e.birth ?? s.birth,
                }
              : s,
          );
        });
        (local?.added || []).forEach((s) => m.set(s.id, { ...s, source: "onsite" }));
        return m;
      }
      const testById = new Map(CONFIG.tests.map((t) => [t.id, t]));

      // 這個場域的紀錄：CONFIG.records（假資料，套用到每個場域）＋ sessionStorage 的 kf.records.<場域 id>（測驗頁新完成的）
      function recordsOf(fieldId) {
        let saved = [];
        try {
          const v = JSON.parse(sessionStorage.getItem(`kf.records.${fieldId}`));
          if (Array.isArray(v)) saved = v;
        } catch (e) {}
        return [...CONFIG.records, ...saved];
      }
      function fieldRecords() {
        if (!field) return [];
        const sm = subjectMap();
        return recordsOf(field.id)
          .map((r) => ({ ...r, subject: sm.get(r.subjectId) }))
          .filter((r) => r.subject && testById.has(r.test));
      }

      /* =========================================================
       * 篩選：搜尋、測驗、日期三者同時生效（交集）
       * F.range："all" 全部日期／"week" 本週／"month" 本月／"custom" 自訂（F.custom = { start, end }）
       * ========================================================= */
      const F = { query: "", test: "all", range: "all", custom: null };
      const TESTS = ["all", "sppb", "gait"]; // 與分段切換的按鈕順序一致
      const list = $("#list");
      const searchInput = $("#searchInput");
      const searchClear = $("#searchClear");

      // 用函式宣告（會提升），CONFIG.records 產生日期時就能使用
      function isoOf(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      // 依今天往前推 n 天（"YYYY-MM-DD"）
      function daysAgo(n) {
        const d = new Date();
        d.setDate(d.getDate() - n);
        return isoOf(d);
      }
      function monthStart() {
        const d = new Date();
        d.setDate(1);
        return isoOf(d);
      }
      // 本週：本週星期一到今天；本月：本月 1 日到今天
      function rangeBounds() {
        const today = todayStr();
        if (F.range === "week") {
          const d = new Date();
          d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
          return { start: isoOf(d), end: today };
        }
        if (F.range === "month") return { start: monthStart(), end: today };
        if (F.range === "custom" && F.custom) return F.custom;
        return null;
      }
      const inRange = (r, b) => !b || (r.date >= b.start && r.date <= b.end);
      function matchQuery(r, terms) {
        const text = norm(`${r.subject.name} ${r.subject.code || ""}`); // 沒有編號只比對姓名
        return terms.every((t) => text.includes(t));
      }

      // 日期小標題：今年「11 月 12 日」；不是今年「民國 114 年 12 月 3 日」
      function dayHeading(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        return y === new Date().getFullYear()
          ? `${m} 月 ${d} 日`
          : `民國 ${y - 1911} 年 ${m} 月 ${d} 日`;
      }
      // 膠囊上的民國日期「115/11/01」
      function rocShort(iso) {
        const [y, m, d] = iso.split("-");
        return `${Number(y) - 1911}/${m}/${d}`;
      }

      function recRowHTML(r, terms) {
        const s = r.subject;
        const t = testById.get(r.test);
        // 有編號：「A012 · 78 歲 · 男」；沒有編號：「78 歲 · 男」
        const meta = `${s.code ? `${highlight(s.code, terms)} · ` : ""}${subjectAge(s)} 歲 · ${esc(s.gender)}`;
        return `
      <div class="srow rec-row" data-id="${esc(r.id)}" tabindex="0">
        <div class="avatar serif">${esc(s.name.slice(0, 1))}</div>
        <div class="s-main">
          <div class="s-name">${highlight(s.name, terms)}</div>
          <div class="s-meta"><span class="s-meta-text">${meta}</span></div>
          <div class="rec-test"><i class="ti ${t.icon}"></i>${esc(t.name)} · ${esc(r.time)}${r.retest ? '<span class="s-tag">重測</span>' : ""}</div>
        </div>
        <button class="btn-edit" type="button" aria-label="${esc(s.name)} 的鑑測結果">鑑測結果<i class="ti ti-chevron-right"></i></button>
      </div>`;
      }

      function emptyHTML(icon, title, sub, btn = "") {
        return `
      <div class="empty">
        <i class="ti ${icon}"></i>
        <div class="empty-title">${title}</div>
        ${sub ? `<div class="empty-sub">${sub}</div>` : ""}
        ${btn}
      </div>`;
      }

      function renderList({ animate = true, scroll = false } = {}) {
        if (!field) {
          list.innerHTML = ""; // 沒有場域時整區隱藏（見 renderView）
          return;
        }
        const terms = termsOf(F.query);
        const bounds = rangeBounds();
        const all = fieldRecords();
        // 測驗篩選上的筆數：依目前的搜尋和日期條件計算
        const base = all.filter((r) => matchQuery(r, terms) && inRange(r, bounds));
        $("#cntAll").textContent = base.length;
        $("#cntSppb").textContent = base.filter((r) => r.test === "sppb").length;
        $("#cntGait").textContent = base.filter((r) => r.test === "gait").length;
        const shown = F.test === "all" ? base : base.filter((r) => r.test === F.test);
        $("#count").textContent = `共 ${shown.length} 筆紀錄`;

        if (!all.length) {
          list.innerHTML = emptyHTML("ti-history", "目前沒有鑑測紀錄", "完成鑑測後會出現在這裡");
        } else if (!shown.length) {
          list.innerHTML = emptyHTML(
            "ti-filter-off",
            "沒有符合條件的紀錄",
            "試試調整搜尋或篩選條件",
            '<button class="empty-btn" type="button" data-act="clear-filters">清除篩選</button>',
          );
        } else {
          // 依日期分組（由新到舊），同一天內依時間由晚到早
          const groups = new Map();
          [...shown]
            .sort((a, b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time))
            .forEach((r) => {
              if (!groups.has(r.date)) groups.set(r.date, []);
              groups.get(r.date).push(r);
            });
          list.innerHTML = [...groups]
            .map(
              ([date, rows]) => `
      <section class="day-group">
        <h3 class="day-head">${dayHeading(date)}</h3>
        <div class="list-card">${rows.map((r) => recRowHTML(r, terms)).join("")}</div>
      </section>`,
            )
            .join("");
        }

        if (animate) {
          list.classList.remove("is-updating");
          void list.offsetWidth; // 重新觸發淡入
          list.classList.add("is-updating");
        }
        if (scroll) scrollToListTop();
      }

      // 篩選改變後：已經往下捲時，捲回「篩選區剛好黏在上方、清單從它下方開始」的位置
      function scrollToListTop() {
        const app = $("#app");
        const card = $("#fieldCard");
        const top = card.offsetTop + card.offsetHeight;
        if (app.scrollTop > top) app.scrollTo({ top, behavior: "smooth" });
      }

      function clearSearch() {
        F.query = "";
        searchInput.value = "";
        searchClear.hidden = true;
      }

      // 日期膠囊：選中狀態；自訂日期套用後顯示範圍和 ✕
      function renderChips() {
        $("#dateChips")
          .querySelectorAll("button.chip")
          .forEach((b) => {
            const on = b.dataset.range === F.range;
            b.classList.toggle("is-active", on);
            b.setAttribute("aria-pressed", on);
          });
        const custom = F.range === "custom" && F.custom;
        const chip = $("#customChip");
        chip.classList.toggle("is-active", Boolean(custom));
        chip.classList.toggle("has-range", Boolean(custom));
        $("#customBtn").setAttribute("aria-pressed", Boolean(custom));
        $("#customText").textContent = custom
          ? `${rocShort(F.custom.start)} – ${rocShort(F.custom.end)}`
          : "自訂日期";
        $("#customClear").hidden = !custom;
      }

      function setTest(test) {
        F.test = test;
        setSeg($("#testSeg"), TESTS.indexOf(test));
        renderList({ scroll: true });
      }
      function setRange(range) {
        F.range = range;
        renderChips();
        renderList({ scroll: true });
      }

      // 清除篩選：清空搜尋、測驗回到全部、日期回到全部日期
      function clearFilters() {
        clearSearch();
        F.test = "all";
        setSeg($("#testSeg"), 0);
        F.range = "all";
        renderChips();
        renderList({ scroll: true });
      }

      // 點紀錄：SPPB 進入鑑測結果頁；行走測驗的結果頁還在製作中
      function openRecord(id) {
        const record = field ? recordsOf(field.id).find((r) => r.id === id) : null;
        if (!record) return;
        if (record.test === "sppb") {
          location.href = `result.html?record=${record.id}`;
          return;
        }
        showToast("行走測驗結果頁製作中");
        // TODO：行走測驗結果頁做好之後改成換頁
      }

      /* =========================================================
       * 選擇日期範圍：底部面板
       * draft：面板上尚未套用的範圍；last：最近一次套用的範圍（下次打開時帶入）
       * ========================================================= */
      const rangeSheet = $("#rangeSheet");
      const RG = { open: false, draft: null, last: null, lastFocus: null };

      function renderRangeFields() {
        $("#startText").textContent = rocText(isoToRoc(RG.draft.start));
        $("#endText").textContent = rocText(isoToRoc(RG.draft.end));
        // 開始日期晚於結束日期：結束日期下方顯示錯誤
        $("#fEnd").classList.toggle("has-error", RG.draft.start > RG.draft.end);
      }

      // 第一次打開：本月 1 日～今天；之後打開：帶入目前套用（或最近一次套用）的範圍
      function openRangeSheet() {
        RG.draft = { ...(F.custom || RG.last || { start: monthStart(), end: todayStr() }) };
        renderRangeFields();
        RG.open = true;
        RG.lastFocus = document.activeElement;
        rangeSheet.style.transform = "";
        rangeSheet.classList.add("is-open");
        rangeSheet.setAttribute("aria-hidden", "false");
        $("#rangeMask").classList.add("is-open");
        document.body.classList.add("sheet-open");
        $("#app").inert = true;
      }

      // 沒按套用就關閉：不改變目前的篩選
      function closeRangeSheet() {
        if (!RG.open) return;
        RG.open = false;
        rangeSheet.style.transform = "";
        rangeSheet.classList.remove("is-open");
        rangeSheet.setAttribute("aria-hidden", "true");
        $("#rangeMask").classList.remove("is-open");
        document.body.classList.remove("sheet-open");
        $("#app").inert = false;
        RG.lastFocus?.focus?.({ preventScroll: true });
      }

      function applyRange() {
        if (RG.draft.start > RG.draft.end) return renderRangeFields();
        F.custom = { ...RG.draft };
        RG.last = { ...RG.draft };
        F.range = "custom";
        closeRangeSheet();
        renderChips();
        renderList({ scroll: true });
      }

      function initRange() {
        $("#rangeClose").addEventListener("click", closeRangeSheet);
        $("#rangeMask").addEventListener("click", closeRangeSheet);
        $("#rangeApply").addEventListener("click", applyRange);
        $("#startBtn").addEventListener("click", () => openPicker("start"));
        $("#endBtn").addEventListener("click", () => openPicker("end"));

        // 拖曳把手區：往下拖跟手移動，放開時超過 120px 關閉，否則彈回
        const grab = $("#rangeGrab");
        let drag = null;
        grab.addEventListener("pointerdown", (e) => {
          if (!RG.open || e.target.closest("button")) return;
          drag = { y: e.clientY, dy: 0 };
          grab.setPointerCapture(e.pointerId);
          rangeSheet.classList.add("is-dragging");
        });
        grab.addEventListener("pointermove", (e) => {
          if (!drag) return;
          drag.dy = Math.max(0, e.clientY - drag.y);
          rangeSheet.style.transform = `translateY(${drag.dy}px)`;
        });
        const endDrag = () => {
          if (!drag) return;
          const { dy } = drag;
          drag = null;
          rangeSheet.classList.remove("is-dragging");
          rangeSheet.style.transform = "";
          if (dy > 120) closeRangeSheet();
        };
        grab.addEventListener("pointerup", endDrag);
        grab.addEventListener("pointercancel", endDrag);
      }

      // 有場域：顯示場域卡＋篩選區＋紀錄；沒有場域：只顯示大卡片
      function renderView() {
        $("#noField").hidden = Boolean(field);
        $("#fieldView").hidden = !field;
        if (field) renderFieldCard();
      }

      function renderFieldCard() {
        $("#fcName").textContent = field.name;
        $("#fieldCard").setAttribute(
          "aria-label",
          `目前場域 ${field.name}，切換場域`,
        );
      }

      // 從「沒有場域」變成「有場域」：大卡片淡出縮小後移除，場域卡、篩選區、清單依序浮現
      function enterFieldView() {
        renderFieldCard();
        renderList({ animate: false });
        const card = $("#noField");
        card.classList.remove("rise"); // 先拿掉進場動畫，淡出的過場才會生效
        void card.offsetWidth;
        card.classList.add("is-leaving");
        setTimeout(() => {
          card.hidden = true;
          card.classList.remove("is-leaving");
          $("#fieldView").hidden = false;
          [
            ["#fieldCard", 0],
            ["#searchRise", 0.06],
            ["#listRise", 0.12],
          ].forEach(([sel, d]) => {
            const el = $(sel);
            el.classList.remove("rise");
            el.style.setProperty("--d", d);
            void el.offsetWidth; // 重新觸發 .rise
            el.classList.add("rise");
          });
        }, 300);
      }

      /* =========================================================
       * 切換場域：底部面板（與 home.html 的選擇場域面板相同）
       * ========================================================= */
      const fieldSheet = $("#fieldSheet");
      const fieldList = $("#fieldList");
      const fsInput = $("#fsInput");
      const fsClear = $("#fsClear");
      const S = { open: false, selectedId: null, query: "", lastFocus: null };

      // 排序：用過的依最近使用時間在前，沒用過的在後，沒用過的依名稱排序
      function sortFields(items, recent) {
        const rank = new Map(recent.map((r, i) => [r.id, i]));
        return [...items].sort((a, b) => {
          const ra = rank.get(a.id);
          const rb = rank.get(b.id);
          if (ra !== undefined && rb !== undefined) return ra - rb;
          if (ra !== undefined) return -1;
          if (rb !== undefined) return 1;
          return a.name.localeCompare(b.name, "zh-Hant");
        });
      }

      function fieldRowHTML(f, terms) {
        const sel = f.id === S.selectedId;
        return `
      <div class="frow ${sel ? "is-selected" : ""}" role="radio" aria-checked="${sel}" tabindex="0" data-id="${f.id}">
        <span class="frow-radio"><i class="ti ti-check"></i></span>
        <span class="frow-name">${highlight(f.name, terms)}</span>
        <span class="frow-tag">已選取</span>
      </div>`;
      }

      // 只比對場域名稱
      function renderFieldList() {
        const terms = termsOf(S.query);
        const recent = fieldStore.getRecent();
        let html = "";

        if (!terms.length) {
          // 最近使用：最多 3 個，目前場域排第一
          const cur = fieldStore.getCurrent();
          let ids = recent.map((r) => r.id);
          if (cur && ids.includes(cur.id))
            ids = [cur.id, ...ids.filter((id) => id !== cur.id)];
          const recentFields = ids.slice(0, 3).map((id) => fieldById.get(id));
          if (recentFields.length) {
            html += `<h3 class="sheet-section">最近使用</h3>${recentFields.map((f) => fieldRowHTML(f, terms)).join("")}`;
          }
          const all = sortFields(CONFIG.fields, recent);
          html += `<h3 class="sheet-section">全部場域（${all.length}）</h3>${all.map((f) => fieldRowHTML(f, terms)).join("")}`;
        } else {
          const matched = sortFields(
            CONFIG.fields.filter((f) => {
              const n = norm(f.name);
              return terms.every((t) => n.includes(t));
            }),
            recent,
          );
          if (!matched.length) {
            fieldList.innerHTML = `
      <div class="list-empty">
        <i class="ti ti-map-search"></i>
        <div class="list-empty-title">找不到符合的場域</div>
        <div class="list-empty-sub">試試其他關鍵字</div>
      </div>`;
            return;
          }
          html += `<h3 class="sheet-section">搜尋結果（${matched.length}）</h3>${matched.map((f) => fieldRowHTML(f, terms)).join("")}`;
        }
        fieldList.innerHTML = html;
      }

      function openFieldSheet() {
        S.open = true;
        S.query = "";
        S.lastFocus = document.activeElement;
        fsInput.value = "";
        fsClear.hidden = true;
        S.selectedId = field ? field.id : null; // 目前場域自動選取
        renderFieldList();
        fieldList.scrollTop = 0;

        fieldSheet.style.transform = "";
        fieldSheet.classList.add("is-open");
        fieldSheet.setAttribute("aria-hidden", "false");
        $("#fieldMask").classList.add("is-open");
        document.body.classList.add("sheet-open", "field-open");
        $("#app").inert = true;
      }

      function closeFieldSheet() {
        if (!S.open) return;
        S.open = false;
        fsInput.blur();
        fieldSheet.style.transform = "";
        fieldSheet.classList.remove("is-open");
        fieldSheet.setAttribute("aria-hidden", "true");
        $("#fieldMask").classList.remove("is-open");
        document.body.classList.remove("sheet-open", "field-open");
        $("#app").inert = false;
        S.lastFocus?.focus?.({ preventScroll: true });
      }

      function selectField(id) {
        if (S.selectedId === id) return;
        S.selectedId = id;
        fieldList.querySelectorAll(".frow").forEach((row) => {
          const on = row.dataset.id === id;
          row.classList.toggle("is-selected", on);
          row.setAttribute("aria-checked", on);
          // 單選鈕小彈跳
          const radio = row.querySelector(".frow-radio");
          radio.classList.remove("pop");
          if (on) {
            void radio.offsetWidth;
            radio.classList.add("pop");
          }
        });
      }

      function confirmField() {
        const next = fieldById.get(S.selectedId);
        if (!next) {
          fieldList.classList.remove("shake");
          void fieldList.offsetWidth; // 重新觸發動畫
          fieldList.classList.add("shake");
          showToast("請先選擇場域");
          return;
        }
        // 確認場域：照原本規則寫入 kf.currentField 和 kf.recentFields
        fieldStore.setCurrent(next.id);
        // 與目前場域相同：直接關閉，不顯示 toast
        if (field && next.id === field.id) return closeFieldSheet();

        const wasEmpty = !field;
        field = next;
        local = loadLocal(field.id);
        closeFieldSheet();
        clearSearch();
        if (wasEmpty) {
          enterFieldView(); // 大卡片 → 場域卡、搜尋列、名單
        } else {
          renderFieldCard();
          renderList();
        }
        showToast(`已切換至 ${field.name}`);
      }

      function initFieldSheet() {
        $("#fieldCard").addEventListener("click", openFieldSheet);
        $("#fieldClose").addEventListener("click", closeFieldSheet);
        $("#fieldMask").addEventListener("click", closeFieldSheet);
        $("#fieldConfirm").addEventListener("click", confirmField);
        fieldList.addEventListener("animationend", (e) => {
          if (e.target === fieldList) fieldList.classList.remove("shake");
        });

        // 點整列 = 選取
        fieldList.addEventListener("click", (e) => {
          const row = e.target.closest(".frow");
          if (row) selectField(row.dataset.id);
        });
        fieldList.addEventListener("keydown", (e) => {
          const row = e.target.closest?.(".frow");
          if (row && e.target === row && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            selectField(row.dataset.id);
          }
        });

        // 搜尋：即時篩選
        fsInput.addEventListener("input", () => {
          S.query = fsInput.value;
          fsClear.hidden = !S.query;
          renderFieldList();
          fieldList.scrollTop = 0;
        });
        fsClear.addEventListener("click", (e) => {
          e.preventDefault();
          fsInput.value = "";
          fsInput.dispatchEvent(new Event("input"));
          fsInput.focus({ preventScroll: true });
        });

        // 拖曳把手區：往下拖跟手移動，放開時超過 120px 關閉，否則彈回
        const grab = $("#fieldGrab");
        let drag = null;
        grab.addEventListener("pointerdown", (e) => {
          if (!S.open || e.target.closest("button")) return;
          drag = { y: e.clientY, dy: 0 };
          grab.setPointerCapture(e.pointerId);
          fieldSheet.classList.add("is-dragging");
        });
        grab.addEventListener("pointermove", (e) => {
          if (!drag) return;
          drag.dy = Math.max(0, e.clientY - drag.y);
          fieldSheet.style.transform = `translateY(${drag.dy}px)`;
        });
        const endDrag = () => {
          if (!drag) return;
          const { dy } = drag;
          drag = null;
          fieldSheet.classList.remove("is-dragging");
          fieldSheet.style.transform = "";
          if (dy > 120) closeFieldSheet();
        };
        grab.addEventListener("pointerup", endDrag);
        grab.addEventListener("pointercancel", endDrag);
      }

      /* =========================================================
       * 日期選擇視窗（民國年滾輪）：開始／結束日期共用，P.target 為 "start" 或 "end"
       * 每欄選項值 = 索引 + 1（年：民國 1 年起；月：1 月起；日：1 日起）
       * ========================================================= */
      const ITEM_H = 80;
      const picker = $("#picker");
      const wheels = { y: $("#wheelY"), m: $("#wheelM"), d: $("#wheelD") };
      const UNITS = { y: "年", m: "月", d: "日" };
      const P = { open: false, target: "start", y: 115, m: 1, d: 1 };

      const pad2 = (n) => String(n).padStart(2, "0");
      function todayRoc() {
        const t = new Date();
        return {
          y: t.getFullYear() - 1911,
          m: t.getMonth() + 1,
          d: t.getDate(),
        };
      }
      const daysIn = (y, m) => new Date(y + 1911, m, 0).getDate(); // 閏年依西元年計算
      // 不能選未來：今年最多到本月、本月最多到今天
      const maxMonth = (y) => (y === todayRoc().y ? todayRoc().m : 12);
      function maxDay(y, m) {
        const t = todayRoc();
        return y === t.y && m === t.m
          ? Math.min(daysIn(y, m), t.d)
          : daysIn(y, m);
      }
      const toIso = ({ y, m, d }) => `${y + 1911}-${pad2(m)}-${pad2(d)}`;
      function isoToRoc(iso) {
        const [Y, M, D] = iso.split("-").map(Number);
        return { y: Y - 1911, m: M, d: D };
      }
      // 「民國 115 年 11 月 1 日」（日期範圍不顯示年齡）
      const rocText = (r) => `民國 ${r.y} 年 ${r.m} 月 ${r.d} 日`;

      function fillWheel(key, count, maxAllowed) {
        let html = '<div class="wheel-pad"></div>';
        for (let v = 1; v <= count; v++) {
          html += `<div class="wheel-item${v > maxAllowed ? " is-disabled" : ""}" data-v="${v}">${v} ${UNITS[key]}</div>`;
        }
        wheels[key].innerHTML = html + '<div class="wheel-pad"></div>';
        wheels[key].dataset.count = count;
      }
      function centerValue(key) {
        const w = wheels[key];
        const i = Math.round(w.scrollTop / ITEM_H);
        return Math.max(1, Math.min(Number(w.dataset.count), i + 1));
      }
      function scrollToValue(key, v, smooth) {
        wheels[key].scrollTo({
          top: (v - 1) * ITEM_H,
          behavior: smooth ? "smooth" : "auto",
        });
      }
      // 依捲動位置即時標出中間的選項
      function markCenter(key) {
        const v = centerValue(key);
        wheels[key].querySelectorAll(".wheel-item").forEach((el) => {
          el.classList.toggle("is-center", Number(el.dataset.v) === v);
        });
      }
      function setDisabled(key, maxAllowed) {
        wheels[key].querySelectorAll(".wheel-item").forEach((el) => {
          el.classList.toggle("is-disabled", Number(el.dataset.v) > maxAllowed);
        });
      }

      // 即時預覽：滾動中也依目前中間的選項更新（超出範圍的先以可選的最大值顯示）
      function updatePreview() {
        const y = centerValue("y");
        const m = Math.min(centerValue("m"), maxMonth(y));
        const d = Math.min(centerValue("d"), maxDay(y, m));
        $("#pickerPreview").textContent = rocText({ y, m, d });
      }

      // 年、月改變後：更新月份可選範圍、重建日數，必要時把月／日拉回可選的值
      function applyConstraints(smooth) {
        const mm = maxMonth(P.y);
        setDisabled("m", mm);
        if (P.m > mm) {
          P.m = mm;
          scrollToValue("m", P.m, smooth);
        }
        const days = daysIn(P.y, P.m);
        const md = maxDay(P.y, P.m);
        if (P.d > md) P.d = md; // 日數變少或超過今天：改成最後一個可選的日
        if (Number(wheels.d.dataset.count) !== days) {
          fillWheel("d", days, md);
          scrollToValue("d", P.d, false);
        } else {
          setDisabled("d", md);
          if (centerValue("d") !== P.d) scrollToValue("d", P.d, smooth);
        }
        Object.keys(wheels).forEach(markCenter);
        updatePreview();
      }

      // 捲動停止後才確定該欄的值；捲到不能選的值時自動彈回
      function commit(key) {
        if (!P.open) return;
        const v = centerValue(key);
        if (key === "y") {
          if (v === P.y) return;
          P.y = v;
          applyConstraints(true);
        } else if (key === "m") {
          const mm = maxMonth(P.y);
          if (v > mm) scrollToValue("m", mm, true);
          const next = Math.min(v, mm);
          if (next === P.m) return markCenter("m");
          P.m = next;
          applyConstraints(true);
        } else {
          const md = maxDay(P.y, P.m);
          if (v > md) scrollToValue("d", md, true);
          P.d = Math.min(v, md);
          updatePreview();
        }
      }

      function openPicker(target) {
        P.target = target;
        $("#pickerTitle").textContent =
          target === "start" ? "選擇開始日期" : "選擇結束日期";
        Object.assign(P, isoToRoc(RG.draft[target]));
        P.open = true;
        fillWheel("y", todayRoc().y, Infinity);
        fillWheel("m", 12, maxMonth(P.y));
        fillWheel("d", daysIn(P.y, P.m), maxDay(P.y, P.m));
        picker.classList.add("is-open");
        picker.setAttribute("aria-hidden", "false");
        $("#pickerMask").classList.add("is-open");
        // 打開時直接定位，不要有捲動動畫
        Object.keys(wheels).forEach((key) => {
          scrollToValue(key, P[key], false);
          markCenter(key);
        });
        updatePreview();
      }

      function closePicker(apply) {
        if (!P.open) return;
        if (apply) {
          RG.draft[P.target] = toIso(P);
          renderRangeFields(); // 會一併檢查開始是否晚於結束
        }
        P.open = false;
        picker.classList.remove("is-open");
        picker.setAttribute("aria-hidden", "true");
        $("#pickerMask").classList.remove("is-open");
        $(P.target === "start" ? "#startBtn" : "#endBtn").focus({ preventScroll: true });
      }

      function initPicker() {
        $("#pickerClose").addEventListener("click", () => closePicker(false));
        $("#pickerCancel").addEventListener("click", () => closePicker(false));
        $("#pickerMask").addEventListener("click", () => closePicker(false));
        $("#pickerOk").addEventListener("click", () => closePicker(true));

        const hasScrollEnd = "onscrollend" in window;
        Object.entries(wheels).forEach(([key, wheel]) => {
          let raf;
          let timer;
          wheel.addEventListener("scroll", () => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(() => {
              markCenter(key);
              updatePreview();
            });
            // 不支援 scrollend 時，用 120ms 防抖判斷捲動停止
            if (!hasScrollEnd) {
              clearTimeout(timer);
              timer = setTimeout(() => commit(key), 120);
            }
          });
          if (hasScrollEnd)
            wheel.addEventListener("scrollend", () => commit(key));
          // 點擊非中間的選項：平滑捲動到該選項
          wheel.addEventListener("click", (e) => {
            const item = e.target.closest(".wheel-item");
            if (item && Number(item.dataset.v) !== centerValue(key)) {
              scrollToValue(key, Number(item.dataset.v), true);
            }
          });
        });
      }


      /* =========================================================
       * 啟動
       * ========================================================= */
      function init() {
        renderNav();
        renderView();
        renderChips();
        renderList({ animate: false });
        initFieldSheet();
        initRange();
        initPicker();

        // 沒有場域：大卡片的「選擇場域」打開場域面板
        $("#nfBtn").addEventListener("click", openFieldSheet);

        // 日期小標題黏在篩選區下方：量測篩選區高度寫入 --filter-h
        const bar = $("#filterBar");
        new ResizeObserver(() =>
          document.documentElement.style.setProperty("--filter-h", `${bar.offsetHeight}px`),
        ).observe(bar);

        searchInput.addEventListener("input", () => {
          F.query = searchInput.value;
          searchClear.hidden = !F.query;
          renderList({ scroll: true });
        });
        searchClear.addEventListener("click", (e) => {
          e.preventDefault();
          searchInput.value = "";
          searchInput.dispatchEvent(new Event("input"));
          searchInput.focus({ preventScroll: true });
        });

        $("#testSeg").addEventListener("click", (e) => {
          const btn = e.target.closest(".seg-btn");
          if (btn && btn.dataset.test !== F.test) setTest(btn.dataset.test);
        });

        $("#dateChips").addEventListener("click", (e) => {
          if (e.target.closest("#customClear")) return setRange("all");
          const btn = e.target.closest("[data-range]");
          if (!btn) return;
          if (btn.dataset.range === "custom") return openRangeSheet();
          if (btn.dataset.range !== F.range) setRange(btn.dataset.range);
        });

        // 點整列或「鑑測結果」按鈕；空狀態的「清除篩選」
        list.addEventListener("click", (e) => {
          if (e.target.closest('[data-act="clear-filters"]')) return clearFilters();
          const row = e.target.closest(".rec-row");
          if (row) openRecord(row.dataset.id);
        });
        list.addEventListener("keydown", (e) => {
          if (e.target.classList?.contains("rec-row") && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            e.target.click();
          }
        });

        // Esc：日期選擇 → 日期範圍面板 → 場域面板
        document.addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          if (P.open) closePicker(false);
          else if (RG.open) closeRangeSheet();
          else if (S.open) closeFieldSheet();
        });
      }
      init();
    </script>
  </body>
</html>
