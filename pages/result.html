<html lang="zh-Hant">
  <head>

    <style>
      /* =========================================================
       * SPPB 鑑測結果頁：共用樣式在 css/result.css；這裡只有 SPPB 卡片內容（VIVIFRAIL、總分、雷達圖、測量數據）
       * ========================================================= */
      /* 「結果總覽」標題列：標題靠左、VIVIFRAIL 等級靠右，垂直置中；放不下時 JS 加 .is-stacked，改放在標題下方一行、靠左 */
      .card-head--vivi {
        align-items: center;
        justify-content: space-between;
        gap: calc(16 * var(--cu));
      }
      .card-head--vivi.is-stacked {
        flex-direction: column;
        align-items: flex-start;
        gap: calc(10 * var(--cu));
      }
      /* VIVIFRAIL 等級（沿用原本頁首標籤的設計，縮小到和標題列協調）：等級色外框、字母方塊、等級名稱 */
      .vivi {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: calc(14 * var(--u));
        padding: calc(4 * var(--u)) calc(4 * var(--u)) calc(4 * var(--u)) calc(18 * var(--u));
        border-radius: calc(22 * var(--u));
        background: var(--chip);
        border: max(2px, calc(3 * var(--u))) solid var(--level);
        white-space: nowrap;
      }
      .vivi-k {
        font-size: max(12px, var(--fmin), calc(18 * var(--u))); /* 手機卡片內不強制 16px，但至少 12px 才讀得到 */
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .vivi-v {
        font-size: max(16px, calc(32 * var(--u)));
        font-weight: 700;
        line-height: 1.25;
      }
      .vivi-letter {
        flex: 0 0 auto;
        width: max(32px, calc(64 * var(--u)));
        height: max(32px, calc(64 * var(--u)));
        border-radius: calc(16 * var(--u));
        background: var(--level);
        color: var(--letter, #fff);
        display: grid;
        place-items: center;
        font-size: max(16px, calc(38 * var(--u)));
        font-weight: 700;
        line-height: 1;
      }
      .split {
        margin-top: auto;
        padding-top: calc(24 * var(--cu));
        border-top: calc(2 * var(--cu)) solid var(--divider);
        display: grid;
        grid-template-columns: 1fr calc(2 * var(--cu)) 1fr;
        align-items: center;
        text-align: center;
      }
      .split-line {
        align-self: stretch;
        background: var(--divider);
      }
      .big-score {
        font-size: max(var(--fmin), calc(100 * var(--cu)));
      }
      .big-of {
        font-size: max(var(--fmin), calc(36 * var(--cu)));
        font-weight: 700;
        color: var(--faint);
      }


      /* 卡片 2：雷達圖＋三項分數 */
      .radar {
        display: block;
        width: calc(520 * var(--cu));
        margin: calc(14 * var(--cu)) auto 0;
      }
      .total {
        margin-top: calc(6 * var(--cu));
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: calc(18 * var(--cu));
      }
      .total .big {
        font-size: max(var(--fmin), calc(110 * var(--cu)));
      }
      .total .big small {
        font-size: 0.4em;
        color: var(--faint);
      }
      .total-k {
        font-size: max(var(--fmin), var(--fs-body));
        color: var(--muted);
      }
      .rows {
        margin-top: auto;
      }
      .item-row {
        display: flex;
        align-items: center;
        gap: calc(24 * var(--cu));
        padding: calc(20 * var(--cu)) 0;
        border-top: calc(2 * var(--cu)) solid var(--divider);
      }
      .item-ico {
        flex: 0 0 auto;
        width: calc(72 * var(--cu));
        height: calc(72 * var(--cu));
        border-radius: calc(22 * var(--cu));
        background: var(--forest);
        color: #d9b77a;
        display: grid;
        place-items: center;
        font-size: max(var(--fmin), calc(38 * var(--cu)));
      }
      .item-name {
        flex: 1;
        font-size: max(var(--fmin), var(--fs-lead));
        font-weight: 700;
      }
      .item-score {
        font-size: max(var(--fmin), calc(64 * var(--cu)));
        line-height: 1;
        color: var(--forest);
      }
      .item-score small {
        margin-left: calc(4 * var(--cu));
        font-family: var(--font-sans);
        font-size: max(var(--fmin), var(--fs-body));
        font-weight: 700;
        color: var(--faint);
      }

      /* 卡片 3：測量數據 */
      .measure {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: calc(24 * var(--cu));
        padding: calc(30 * var(--cu)) 0;
      }
      .measure + .measure {
        border-top: calc(2 * var(--cu)) solid var(--divider);
      }
      .measure-k {
        font-size: max(var(--fmin), calc(36 * var(--cu)));
        font-weight: 700;
        white-space: nowrap;
      }
      .measure-v {
        font-size: max(var(--fmin), calc(80 * var(--cu)));
        line-height: 1;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      /* 「無法完成」「—」：文字，較小、不顯示單位 */
      .measure-v.is-text {
        font-family: var(--font-sans);
        font-size: max(var(--fmin), calc(40 * var(--cu)));
        font-weight: 700;
        color: var(--muted);
      }
      .measure-v small {
        margin-left: calc(8 * var(--cu));
        font-family: var(--font-sans);
        font-size: max(var(--fmin), var(--fs-button));
        font-weight: 700;
        color: var(--brass-text);
      }

    </style>
  </head>
  <body>
    <div class="page" id="page" hidden>
      <!-- 頁首：返回（左）、「報告」說明＋箭頭＋QR Code 小卡（右） -->
      <header class="header">
        <button class="home-btn press" id="homeBtn" type="button" aria-label="回首頁">
          <i class="ti ti-home"></i>
        </button>
        <button class="back-pill press" id="backBtn" type="button" hidden>
          <i class="ti ti-chevron-left"></i>受測名單
        </button>
        <!-- 姓名（含稱謂）與檢測日期：暫時隱藏，保留原始碼，之後可能再打開
        <div class="who">
          <h1 class="who-name serif" id="whoName"></h1>
          <div class="who-date">檢測日期 <b id="whoDate"></b></div>
        </div>
        -->
        <a class="report" id="qrCard" href="detail-sppb.html?preview=1&amp;from=result" aria-label="開啟 SPPB 詳細報告" draggable="false">
          <span class="report-hint" aria-hidden="true">
            <span class="report-text">
              <span class="report-title serif">報告</span>
              <span class="report-sub">手機掃描看詳細內容</span>
            </span>
            <svg class="report-arrow" focusable="false">
              <line x1="4%" y1="50%" x2="94%" y2="50%" />
              <line x1="94%" y1="50%" x2="76%" y2="18%" />
              <line x1="94%" y1="50%" x2="76%" y2="82%" />
            </svg>
          </span>
          <span class="qr-card"><img id="reportQr" alt="" draggable="false" /></span>
        </a>
      </header>

      <!-- 風險切換示範鈕（js/result-common.js；DEMO_RISK_SWITCH）：只切換畫面，不寫回紀錄 -->
      <div class="demo-risk" id="demoRisk" role="group" aria-label="示範：切換風險等級" hidden data-html2canvas-ignore></div>

      <!-- 卡片舞台：六張排成一圈 -->
      <main class="stage" id="stage" aria-roledescription="輪播">
        <!-- 卡片 1：結果總覽 -->
        <section class="card" data-i="0" aria-label="結果總覽">
          <div class="card-head card-head--vivi" id="viviHead">
            <h2 class="card-title serif">結果總覽</h2>
            <div class="vivi" id="vivi">
              <div>
                <div class="vivi-k">VIVIFRAIL 等級</div>
                <div class="vivi-v" id="viviText"></div>
              </div>
              <div class="vivi-letter" id="viviLetter"></div>
            </div>
          </div>
          <div class="sub">跌倒風險評估</div>
          <svg class="gauge" id="gauge" viewBox="0 0 760 362" role="img" aria-label="跌倒風險半圓圖"></svg>
          <div class="gauge-text" id="gaugeText"></div>
          <div class="risk" id="risk">
            <span class="risk-dot"></span>
            <div>
              <div class="risk-title" id="riskTitle"></div>
              <div class="risk-desc" id="riskDesc"></div>
            </div>
          </div>
          <div class="split">
            <div>
              <div class="big"><span class="big-score serif" id="score1"></span><span class="big-of"> /12</span></div>
              <div class="split-k">滿分 12 分</div>
            </div>
            <span class="split-line"></span>
            <!-- 同齡比較（js/result-common.js renderPeer）：與 result-gait.html 同一段 -->
            <div id="peerBox">
              <div class="big big-peer serif" id="peer"></div>
              <div class="split-k ink">優於同齡長者</div>
            </div>
          </div>
        </section>

        <!-- 卡片 2：詳細數據 · 圖表 -->
        <section class="card" data-i="1" aria-label="詳細數據 圖表">
          <div class="card-head">
            <h2 class="card-title serif">詳細數據</h2>
            <span class="card-kind">· 圖表</span>
          </div>
          <svg class="radar" id="radar" viewBox="0 0 520 320" role="img" aria-label="三項分數雷達圖"></svg>
          <div class="total">
            <div class="big serif" id="score2"></div>
            <div class="total-k">滿分 12 分</div>
          </div>
          <div class="rows" id="itemRows"></div>
        </section>

        <!-- 卡片 3：詳細數據 · 數據 -->
        <section class="card" data-i="2" aria-label="詳細數據 數據">
          <div class="card-head">
            <h2 class="card-title serif">詳細數據</h2>
            <span class="card-kind">· 數據</span>
          </div>
          <div class="sub">測量數據</div>
          <div id="measures"></div>
        </section>

        <!-- 卡片 4：推薦商品（js/recommend.js，與行走頁相同） -->
        <section class="card" data-i="3" id="recCard" aria-label="推薦商品"></section>

        <!-- 卡片 5：最新消息（getLatestNews()，與行走頁相同） -->
        <section class="card" data-i="4" id="newsCard" aria-label="最新消息"></section>

        <!-- 卡片 6：推薦影片（js/video.js，與詳細報告共用；整張不存進圖片） -->
        <section class="card" data-i="5" id="videoCard" aria-label="推薦影片" data-html2canvas-ignore></section>
      </main>

      <!-- 底部列：頁數圓點＋滑動提示（水平置中） -->
      <footer class="foot">
        <nav class="pager" aria-label="頁面切換">
          <div class="dots" id="dots" role="tablist" data-html2canvas-ignore></div>
          <div class="hint" id="hint" aria-hidden="true" data-html2canvas-ignore>
            <i class="ti ti-hand-finger hand"></i>
            <i class="ti ti-chevrons-left chev to-left"></i>左右滑動查看<i class="ti ti-chevrons-right chev to-right"></i>
          </div>
        </nav>
      </footer>

    <div class="toast" id="toast"></div>

    <script>
      // 報告 QR Code 圖片（之後會依 record 替換）
      const REPORT_QR_SRC = '../img/qrcode-demo.png';
      // 點 QR Code 小卡開啟的詳細報告（之後接 API 時換成帶 token 的網址）
      const REPORT_DETAIL_URL = "detail-sppb.html?preview=1&from=result";

      /* =========================================================
       * 設定區：受測人員、鑑測紀錄與其他頁重複，之後改成共用設定或 API
       * ========================================================= */
      const CONFIG = {
        subjects: [
          {
            id: "s001",
            code: "A001",
            name: "林淑芬",
            birth: "1948-03-12",
            gender: "女",
            source: "import",
            done: { sppb: "14:05" },
          },
          {
            id: "s002",
            code: "A002",
            name: "王小明",
            birth: "1954-07-21",
            gender: "男",
            source: "import",
            done: {},
          },
          {
            id: "s003",
            code: "A003",
            name: "陳美玉",
            birth: "1945-01-30",
            gender: "女",
            source: "import",
            done: { sppb: "13:52" },
          },
          {
            id: "s004",
            code: "A004",
            name: "張志明",
            birth: "1957-05-08",
            gender: "男",
            source: "import",
            done: {},
          },
        ],

        // 鑑測紀錄（假資料）：{ id, subjectId, test, date, time, retest }
        // date 依今天往前推算；今天這 12 筆與 roster.html 已完成 SPPB 的人員和時間相同
        // retest：同一個人同一天同一項測驗的第二次
        // 假資料階段：同一份紀錄套用到每個場域
        // TODO：之後改成依場域從 API 取得，例如 fetch(`/api/fields/${field.id}/records`)
        records: [
          // 今天：與名單頁已完成 SPPB 的 2 位相同（同一人、同時間）
          { id: "r001", subjectId: "s001", test: "sppb", date: daysAgo(0), time: "14:05" },
          { id: "r002", subjectId: "s003", test: "sppb", date: daysAgo(0), time: "13:52" },
          // 過去 60 天
          { id: "r101", subjectId: "s002", test: "gait", date: daysAgo(1), time: "15:20" },
          { id: "r102", subjectId: "s004", test: "sppb", date: daysAgo(3), time: "10:40" },
          { id: "r103", subjectId: "s004", test: "sppb", date: daysAgo(3), time: "11:05", retest: true },
          { id: "r104", subjectId: "s001", test: "gait", date: daysAgo(9), time: "09:30" },
          { id: "r105", subjectId: "s003", test: "gait", date: daysAgo(17), time: "14:15" },
          { id: "r106", subjectId: "s002", test: "sppb", date: daysAgo(26), time: "10:10" },
          { id: "r107", subjectId: "s001", test: "sppb", date: daysAgo(40), time: "13:45" },
          { id: "r108", subjectId: "s003", test: "sppb", date: daysAgo(55), time: "11:20" },
        ],
      };

      // 鑑測結果（假資料）
      // TODO：之後依紀錄從 API 取得，例如 fetch(`/api/records/${record.id}/result`)
      const RESULT = {
        score: 9, // SPPB 總分 0～12
        items: { balance: 3, chair: 3, walk: 3 }, // 三項分數 0～4
        // 測量數值（秒）：站姿 null = 沒有做；起坐 null = 無法完成
        stand: { side: 10, semi: 10, tandem: 10 },
        walk: 4.82,
        chair: 12.5,
      };
      // 測量數據卡的五列：秒數一位小數照原本格式（10 → "10"）；沒有做「—」；起坐、步行無法完成「無法完成」
      function buildMeasures(d) {
        const sec = (v, none) => (v === null || v === undefined ? { value: none, unit: "", text: true } : { value: String(v), unit: "秒" });
        return [
          { label: "步行速度", ...sec(d.walk, "無法完成") },
          { label: "五次起坐測試", ...sec(d.chair, "無法完成") },
          { label: "並排站立", ...sec(d.stand.side, "—") },
          { label: "半並排站立", ...sec(d.stand.semi, "—") },
          { label: "直線站立", ...sec(d.stand.tandem, "—") },
        ];
      }

      /* SPPB 總分 → 跌倒風險等級（key 對應 js/risk.js 的 RISK；文字和顏色在那裡，不可更改）；min～max 為各等級的分數區間 */
      const RISK_RANGES = [
        { key: "danger", min: 0, max: 2 },
        { key: "high", min: 3, max: 5 },
        { key: "mid", min: 6, max: 8 },
        { key: "low", min: 9, max: 11 },
        { key: "vlow", min: 12, max: 12 },
      ];
      const VIVIFRAIL = [
        { letter: "A", max: 3, text: "A級 (失能者)", color: "#DC3545" },
        { letter: "B", max: 6, text: "B級 (衰弱者)", color: "#FFC107", letterColor: "#3a2a00" }, // 黃底用深色字母
        { letter: "C", max: 9, text: "C級 (衰弱前期者)", color: "#0D6EFD" },
        { letter: "D", max: 12, text: "D級 (健康者)", color: "#198754" },
      ];
      const riskOf = (score) => RISK_RANGES.find((l) => score <= l.max);
      const viviOf = (score) => VIVIFRAIL.find((l) => score <= l.max);


      // 共用小工具、資料讀取（紀錄、受測者含一體機）、半圓圖、頁首、輪播：js/result-common.js

      /* 跌倒風險半圓圖（js/result-common.js drawGauge）：指針在所屬等級的那一段裡依分數換算位置
       *   區間只有 1 個分數 → 段的正中央；3 個分數 → 段內 1/6、3/6、5/6，分數越高越靠左 */
      function needleAngle(score) {
        const level = riskOf(score);
        const k = SEG_ORDER.indexOf(level.key);
        const count = level.max - level.min + 1;
        const slot = level.max - score; // 0 = 最高分（最靠左）
        const f = (2 * slot + 1) / (2 * count); // 段內位置（由左算起）
        return 180 - 36 * k - 36 * f;
      }

      /* 雷達圖：平衡（上）、起坐（右下）、步行（左下），最大值 4，四層三角形格線 */
      function drawRadar(items) {
        const cx = 260, cy = 212, R = 196;
        const axes = [
          { key: "balance", deg: 90 },
          { key: "chair", deg: -30 },
          { key: "walk", deg: 210 },
        ];
        const poly = (r) => axes.map((a) => pt(cx, cy, r, a.deg).map((v) => v.toFixed(1)).join(",")).join(" ");
        let html = "";
        for (let k = 1; k <= 4; k++) html += `<polygon points="${poly((R * k) / 4)}" fill="none" stroke="rgba(31,59,51,0.16)" stroke-width="2" />`;
        axes.forEach((a) => {
          const [x, y] = pt(cx, cy, R, a.deg);
          html += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(31,59,51,0.16)" stroke-width="2" />`;
        });
        const data = axes.map((a) => pt(cx, cy, (R * Math.max(0, Math.min(4, items[a.key]))) / 4, a.deg));
        html += `<polygon points="${data.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="rgba(31,59,51,0.14)" stroke="#1f3b33" stroke-width="5" stroke-linejoin="round" />`;
        data.forEach(([x, y]) => (html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="#b08d57" stroke="#1f3b33" stroke-width="3" />`));
        $("#radar").innerHTML = html;
      }

      /* =========================================================
       * 填入內容
       * ========================================================= */
      /* data：RESULT（紀錄）或 DEMO.sppb[i]（示範鈕）；norm：同齡比較分類 */
      function renderResult(data, norm) {
        const { score } = data;

        const v = viviOf(score);
        const vivi = $("#vivi");
        vivi.style.setProperty("--level", v.color);
        vivi.style.setProperty("--letter", v.letterColor || "#fff");
        $("#viviText").textContent = v.text;
        $("#viviLetter").textContent = v.letter;

        // 跌倒風險：半圓圖、「風險等級：短名稱」、風險說明（完整名稱）
        drawGauge($("#gauge"));
        setNeedle($("#gauge"), needleAngle(score));
        renderRiskBlock(riskOf(score).key);
        // 同齡比較：讀紀錄的 norm；沒有時依風險等級推示範值（TODO：之後改成 API 回傳的值）
        renderPeer($("#peerBox"), norm);
        $("#score1").textContent = score;

        drawRadar(data.items);
        $("#score2").innerHTML = `${score} <small>/12</small>`;
        const ITEMS = [
          { key: "balance", name: "平衡", icon: "ti-stretching" },
          { key: "chair", name: "起坐", icon: "ti-armchair" },
          { key: "walk", name: "步行", icon: "ti-walk" },
        ];
        $("#itemRows").innerHTML = ITEMS.map(
          (it) => `
          <div class="item-row">
            <span class="item-ico"><i class="ti ${it.icon}"></i></span>
            <span class="item-name">${it.name}</span>
            <span class="item-score serif">${data.items[it.key]}<small>/4</small></span>
          </div>`,
        ).join("");

        $("#measures").innerHTML = buildMeasures(data)
          .map(
            (m) => `
          <div class="measure">
            <span class="measure-k">${esc(m.label)}</span>
            <span class="measure-v serif${m.text ? " is-text" : ""}">${esc(m.value)}${m.unit ? `<small>${esc(m.unit)}</small>` : ""}</span>
          </div>`,
          )
          .join("");
        // 推薦商品：依風險等級（1–5）
        renderRecommend($("#recCard"), SEG_ORDER.indexOf(riskOf(score).key) + 1, recordSeed);
        renderCareCard(SEG_ORDER.indexOf(riskOf(score).key) + 1); // 照護服務卡：危險等級時插在第 2 張（js/referral.js）
        fitVivi();
      }
      let recordSeed = "";


      // 「結果總覽」標題列：標題＋VIVIFRAIL 放不下（標題會被擠壓）時，VIVIFRAIL 改放在標題下方一行、靠左
      function fitVivi() {
        const head = $("#viviHead");
        head.classList.remove("is-stacked");
        if (head.scrollWidth > head.clientWidth + 1) head.classList.add("is-stacked");
      }

      /* =========================================================
       * 啟動
       * ========================================================= */
      function init() {
        const params = new URLSearchParams(location.search);
        const recordId = params.get("record");
        let record = null;
        let subject;
        let date;
        if (recordId) {
          record = allRecords().find((r) => r.id === recordId && r.test === "sppb");
          subject = record && findSubject(record);
          if (!record || !subject) {
            showToast("找不到鑑測紀錄");
            setTimeout(() => (location.href = "report.html"), 1500);
            return;
          }
          date = record.date;
        } else {
          // 從網站地圖預覽：第一位受測者、今天
          subject = findSubject(null);
          date = isoOf(new Date());
        }

        // 左上角：從測驗完成進入是「‹ 受測名單」（回到這個場域的 SPPB 名單）；一體機回到歡迎頁（js/result-common.js）
        initHeader("sppb", record, params);
        initQrLink(REPORT_QR_SRC, REPORT_DETAIL_URL);
        renderWho(subject, date);
        recordSeed = record?.id || "preview"; // 產生示範券號用：同一筆紀錄每次打開都一樣
        renderResult(RESULT, normOf(record, riskOf(RESULT.score).key));
        renderNewsOne($("#newsCard"), getLatestNews());
        renderVideoCard($("#videoCard"));
        // 風險切換示範鈕：換成該等級的示範數據（最新消息不變）；不寫回紀錄
        initDemoRisk(SEG_ORDER.indexOf(riskOf(RESULT.score).key), (lv) => renderResult(DEMO.sppb[lv], demoNorm(SEG_ORDER[lv])));
        showPage(fitVivi); // 字型載入後寬度會變，再量一次
        initCarousel({ onMeasure: fitVivi });
      }
      init();
    </script>
  </body>
</html>
