<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="../img/logo.png" />
    <link rel="apple-touch-icon" href="../img/logo.png" />
    <title>建豐健康科技 - 讀取健保卡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" />
    <style>
      /* =========================================================
       * 瓷白森林 Porcelain Forest — 一體機健保卡流程頁（直式平板專用，基準 1032 × 1376）
       * 讀取中 → 讀取成功／讀取失敗，三個狀態在同一頁切換
       * 內容集中在畫面上方約 60%
       * ========================================================= */
      :root {
        --bg: #ece7df; /* 暖瓷白：頁面底色 */
        --card: #f7f4ee; /* 卡片底色 */
        --line: #d9cfbe; /* 邊框 */
        --line-soft: #c7bba6;
        --forest: #1f3b33; /* 森林綠：主色 */
        --brass: #b08d57; /* 黃銅：重點色 */
        --brass-light: #d6b67f;
        --brass-text: #8f6e3c; /* 淺底上的黃銅文字 */
        --ink: #1a2420;
        --muted: #6f6656;
        --on-forest: #f6f1e8;

        --font-sans: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
        --font-serif: "Noto Serif TC", "Songti TC", serif;
        /* 縮放單位：1032 × 1376 時 1 --u = 1px；依「寬度」與「高度 × 0.75」中較小者等比縮放 */
        --u: calc(min(100vw, 100dvh * 0.75) / 1032);
        --pad: calc(48 * var(--u)); /* 左右外距 */

        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        /* 一體機：防止長按選字與系統選單 */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      img {
        -webkit-user-drag: none;
      }
      button {
        font: inherit;
        color: inherit;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--brass);
        outline-offset: 4px;
      }
      .serif {
        font-family: var(--font-serif);
        font-weight: 600;
      }

      /* 實心圖示：tabler-icons-filled 的樣式表和一般版共用 .ti 與同名 class，不能整份載入；
       * 只載入字型檔，自訂需要的 ti-circle-check-filled（在 core 檔） */
      @font-face {
        font-family: "tabler-icons-filled";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.52.0/dist/fonts/tabler-icons-filled.core.woff2") format("woff2");
      }
      .ti.ti-circle-check-filled::before {
        font-family: "tabler-icons-filled" !important;
      }
      .ti-circle-check-filled::before {
        content: "\f704";
      }

      /* ===== 版面：內容靠上，下半部留白 ===== */
      .page {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: calc(env(safe-area-inset-top) + 32 * var(--u)) max(var(--pad), calc((100vw - 1032 * var(--u)) / 2 + var(--pad))) 0;
        overflow: hidden;
      }

      /* ===== 頂部：左 Logo＋公司名稱（同 kiosk.html）、右展示用按鈕（DEMO_TOOLS） ===== */
      .top {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: calc(20 * var(--u));
      }
      .brand {
        flex: none;
        display: flex;
        align-items: center;
        gap: calc(20 * var(--u));
      }
      .logo {
        flex: none;
        width: calc(88 * var(--u));
        height: calc(88 * var(--u));
        display: grid;
        place-items: center;
        background: var(--card);
        border: max(1px, calc(2 * var(--u))) solid var(--line);
        border-radius: calc(24 * var(--u));
      }
      .logo img {
        width: 78%;
        height: 78%;
        object-fit: contain;
      }
      .brand-name {
        font-size: max(18px, calc(36 * var(--u)));
        line-height: 1.2;
        white-space: nowrap;
      }

      /* 展示用按鈕：虛線框、淡黃銅底，刻意和正式按鈕不同（正式上線 DEMO_TOOLS = false 時不顯示） */
      .demo {
        display: flex;
        gap: calc(12 * var(--u));
      }
      .demo-btn {
        display: inline-flex;
        align-items: center;
        gap: calc(6 * var(--u));
        min-height: 44px;
        height: calc(60 * var(--u));
        padding: 0 calc(22 * var(--u));
        border-radius: 999px;
        border: max(1.5px, calc(2 * var(--u))) dashed var(--brass);
        background: #faf6ee;
        color: var(--brass-text);
        font-size: max(18px, calc(22 * var(--u)));
        font-weight: 700;
        white-space: nowrap;
      }
      .demo-btn .ti {
        font-size: max(20px, calc(26 * var(--u)));
      }
      .demo-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ===== 中央大卡片 ===== */
      .card {
        flex: none;
        margin-top: calc(28 * var(--u));
        padding: calc(40 * var(--u)) calc(48 * var(--u));
        border-radius: calc(44 * var(--u));
        background: var(--card);
        border: calc(2 * var(--u)) solid var(--brass);
        box-shadow: 0 calc(24 * var(--u)) calc(48 * var(--u)) calc(-24 * var(--u)) rgba(31, 59, 51, 0.35);
      }
      /* 狀態：同一時間只顯示一個，切換時淡入 */
      .state {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .state.is-on {
        display: flex;
        animation: state-in 0.45s var(--ease-out);
      }
      @keyframes state-in {
        from {
          opacity: 0;
          transform: translateY(calc(16 * var(--u)));
        }
      }
      .state-title {
        margin: 0;
        font-size: calc(72 * var(--u));
        line-height: 1.2;
        color: var(--forest);
      }
      .state-sub {
        margin: calc(8 * var(--u)) 0 0;
        font-size: max(18px, calc(32 * var(--u)));
        font-weight: 700;
        line-height: 1.4;
        color: var(--muted);
      }

      /* ----- 狀態 1：讀取中 ----- */
      .reading-icon {
        position: relative;
        width: calc(200 * var(--u));
        height: calc(200 * var(--u));
        display: grid;
        place-items: center;
        margin-top: calc(12 * var(--u));
        border-radius: 50%;
        background: #f1ebe0;
        color: var(--forest);
        font-size: calc(100 * var(--u));
      }
      /* 外圈黃銅進度環：持續旋轉 */
      .reading-icon::after {
        content: "";
        position: absolute;
        inset: calc(-12 * var(--u));
        border-radius: 50%;
        border: calc(7 * var(--u)) solid rgba(176, 141, 87, 0.18);
        border-top-color: var(--brass);
        border-right-color: var(--brass);
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .reading .state-title {
        margin-top: calc(40 * var(--u));
      }
      .dots {
        display: flex;
        gap: calc(16 * var(--u));
        margin-top: calc(20 * var(--u));
      }
      .dots span {
        width: calc(16 * var(--u));
        height: calc(16 * var(--u));
        border-radius: 50%;
        background: var(--brass);
        opacity: 0.25;
        animation: dot 1.2s ease-in-out infinite;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes dot {
        0%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      .warn {
        display: flex;
        align-items: center;
        gap: calc(14 * var(--u));
        margin-top: calc(32 * var(--u));
        padding: calc(18 * var(--u)) calc(32 * var(--u));
        border-radius: calc(20 * var(--u));
        background: #fbf0dc;
        color: #8a5a12;
        font-size: max(18px, calc(32 * var(--u)));
        font-weight: 700;
        line-height: 1.35;
      }
      .warn .ti {
        font-size: calc(40 * var(--u));
      }

      /* ----- 狀態 2：圖示＋文字橫排的標頭 ----- */
      .head {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(28 * var(--u));
        text-align: left;
      }
      .head-icon {
        flex: none;
        width: calc(120 * var(--u));
        height: calc(120 * var(--u));
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: calc(76 * var(--u));
      }
      .ok .head-icon {
        background: #e6f0ea;
        color: #2f7a52;
      }
      .ok .state-title {
        font-size: calc(66 * var(--u));
        line-height: 1.15;
      }
      .ok .state-sub {
        margin-top: calc(2 * var(--u));
        line-height: 1.3;
      }

      /* 請取回健保卡：滿寬深綠條，外框發光脈衝 */
      .take {
        align-self: stretch;
        display: flex;
        align-items: center;
        gap: calc(24 * var(--u));
        margin-top: calc(20 * var(--u));
        padding: calc(14 * var(--u)) calc(36 * var(--u));
        border-radius: calc(28 * var(--u));
        border: calc(3 * var(--u)) solid var(--brass);
        background: var(--forest);
        color: var(--on-forest);
        text-align: left;
        animation: glow 1.8s ease-out infinite;
      }
      @keyframes glow {
        0% {
          box-shadow: 0 0 0 0 rgba(214, 182, 127, 0.7);
        }
        70%,
        100% {
          box-shadow: 0 0 0 calc(16 * var(--u)) rgba(214, 182, 127, 0);
        }
      }
      .take > .ti {
        flex: none;
        color: var(--brass-light);
        font-size: calc(72 * var(--u));
      }
      .take-title {
        display: block;
        font-size: calc(52 * var(--u));
        line-height: 1.2;
      }
      .take-sub {
        display: block;
        margin-top: calc(4 * var(--u));
        font-size: max(18px, calc(28 * var(--u)));
        font-weight: 700;
        color: var(--brass-light);
      }

      /* ----- 狀態 3：讀取失敗（與讀取中相同，內容置中） ----- */
      .fail-icon {
        width: calc(180 * var(--u));
        height: calc(180 * var(--u));
        display: grid;
        place-items: center;
        margin-top: calc(12 * var(--u));
        border-radius: 50%;
        background: #fbe7e4;
        color: #a33a2c;
        font-size: calc(110 * var(--u));
      }
      .fail .state-title {
        margin-top: calc(36 * var(--u));
      }
      .fail-desc {
        margin: calc(12 * var(--u)) 0 0;
        font-size: max(18px, calc(38 * var(--u)));
        font-weight: 700;
        line-height: 1.4;
        color: var(--muted);
      }
      /* 按鈕區：第一列「重新讀取」滿寬；第二列「返回」「改用訪客模式」等寬 */
      .fail-btns {
        align-self: stretch;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: calc(20 * var(--u));
        margin-top: calc(44 * var(--u));
      }
      .fail-btns .btn-retry {
        grid-column: 1 / -1;
        height: calc(150 * var(--u));
        font-size: calc(50 * var(--u));
      }
      .fail-btns .btn-retry .ti {
        font-size: calc(56 * var(--u));
      }
      .fail-btns .btn-ghost {
        font-size: calc(42 * var(--u));
      }
      .fail-btns .btn-ghost .ti {
        font-size: calc(46 * var(--u));
      }

      /* ----- 手機號碼（選填）：不是文字輸入框（不觸發系統鍵盤），點擊開啟自製數字鍵盤 ----- */
      .phone {
        align-self: stretch;
        margin-top: calc(20 * var(--u));
        text-align: left;
      }
      .phone-label {
        display: flex;
        align-items: center;
        gap: calc(14 * var(--u));
        margin-bottom: calc(10 * var(--u));
        font-size: max(18px, calc(34 * var(--u)));
        font-weight: 700;
        line-height: 1.3;
        color: var(--forest);
      }
      .phone-opt {
        padding: calc(2 * var(--u)) calc(18 * var(--u));
        border-radius: 999px;
        background: #f1ebe0;
        color: var(--brass-text);
        font-size: max(18px, calc(26 * var(--u)));
      }
      .phone-field {
        display: flex;
        align-items: center;
        gap: calc(20 * var(--u));
        height: calc(120 * var(--u));
        padding: 0 calc(32 * var(--u));
        border-radius: calc(28 * var(--u));
        border: calc(3 * var(--u)) solid #d9cfbe;
        background: #f7f4ee;
        cursor: pointer;
        touch-action: manipulation;
      }
      .phone-field .ti {
        flex: none;
        color: var(--brass);
        font-size: calc(60 * var(--u));
      }
      .phone-value {
        font-size: max(18px, calc(36 * var(--u)));
        font-weight: 700;
        color: #8c8373;
        white-space: nowrap;
      }
      .phone-field.has-value .phone-value {
        font-family: var(--font-serif);
        font-weight: 600;
        font-size: calc(52 * var(--u));
        color: var(--forest);
        font-variant-numeric: tabular-nums;
      }
      .phone-field.is-error {
        border-color: #b5473a;
      }
      .phone-error {
        margin: calc(8 * var(--u)) 0 0;
        font-size: max(18px, calc(28 * var(--u)));
        font-weight: 700;
        line-height: 1.3;
        color: #a33a2c;
      }
      .phone-error[hidden] {
        display: none;
      }

      /* ----- 自製數字鍵盤（對話框） ----- */
      .pad-mask {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: rgba(20, 30, 26, 0.45);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.25s,
          visibility 0s 0.25s;
      }
      .pad-mask.is-open {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.25s;
      }
      .pad {
        width: calc(660 * var(--u));
        padding: calc(40 * var(--u)) calc(40 * var(--u)) calc(44 * var(--u));
        border-radius: calc(44 * var(--u));
        background: var(--card);
        box-shadow: 0 calc(30 * var(--u)) calc(80 * var(--u)) calc(-30 * var(--u)) rgba(0, 0, 0, 0.45);
        outline: none;
        transform: scale(0.94);
        transition: transform 0.3s var(--ease-out);
      }
      .pad-mask.is-open .pad {
        transform: none;
      }
      .pad-title {
        margin: 0;
        font-size: calc(44 * var(--u));
        line-height: 1.25;
        color: var(--forest);
        text-align: center;
      }
      .pad-show {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: calc(16 * var(--u));
        height: calc(104 * var(--u));
        margin: calc(20 * var(--u)) 0;
        padding: 0 calc(28 * var(--u));
        border-radius: calc(24 * var(--u));
        border: calc(3 * var(--u)) solid #d9cfbe;
        background: #f7f4ee;
      }
      .pad-num {
        font-size: calc(58 * var(--u));
        line-height: 1;
        color: var(--forest);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .pad-count {
        flex: none;
        font-size: max(18px, calc(26 * var(--u)));
        font-weight: 700;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      /* 已滿 10 位：輕微左右晃動 */
      .pad-show.is-shake {
        animation: pad-shake 0.35s ease;
      }
      @keyframes pad-shake {
        20%,
        60% {
          transform: translateX(calc(-10 * var(--u)));
        }
        40%,
        80% {
          transform: translateX(calc(10 * var(--u)));
        }
      }
      .pad-keys {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: calc(16 * var(--u));
      }
      .pad-key {
        height: calc(110 * var(--u));
        display: grid;
        place-items: center;
        border-radius: calc(26 * var(--u));
        border: 2px solid var(--line);
        background: #fffdf9;
        color: var(--ink);
        font-size: calc(54 * var(--u));
        font-weight: 700;
        line-height: 1;
        touch-action: manipulation;
        transition: transform 0.12s var(--ease-out);
      }
      .pad-key:active {
        transform: scale(0.94);
      }
      .pad-del {
        background: #e6dccb;
        border-color: #d9cfbe;
      }
      .pad-done {
        background: var(--forest);
        border-color: var(--forest);
        color: #fff;
      }

      /* 按鈕列 */
      .btns {
        align-self: stretch;
        display: grid;
        gap: calc(20 * var(--u));
        margin-top: calc(28 * var(--u));
      }
      .ok .btns {
        grid-template-columns: 1fr 1.6fr;
        margin-top: calc(22 * var(--u));
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(12 * var(--u));
        height: calc(130 * var(--u));
        border-radius: 999px;
        font-size: calc(46 * var(--u));
        font-weight: 700;
        white-space: nowrap;
        transition: transform 0.2s var(--ease-out);
      }
      .btn .ti {
        font-size: calc(52 * var(--u));
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-ghost {
        border: 2px solid var(--line-soft);
        background: var(--card);
        color: var(--forest);
      }
      .btn-primary {
        border: calc(3 * var(--u)) solid var(--brass);
        background: linear-gradient(135deg, #2e5649 0%, var(--forest) 55%, #172d27 100%);
        color: var(--on-forest);
        box-shadow: 0 calc(16 * var(--u)) calc(32 * var(--u)) calc(-16 * var(--u)) rgba(31, 59, 51, 0.6);
      }
      .btn-primary .ti {
        color: var(--brass-light);
      }

      /* ===== 減少動態：直接切換；發光、進度環、圓點都靜止 ===== */
      @media (prefers-reduced-motion: reduce) {
        .state.is-on,
        .reading-icon::after,
        .dots span,
        .take {
          animation: none;
        }
        .dots span {
          opacity: 1;
        }
        .btn,
        .pad,
        .pad-mask,
        .pad-mask.is-open,
        .pad-key {
          transition: none;
        }
        .pad,
        .pad-key:active {
          transform: none;
        }
        .pad-show.is-shake {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <!-- 頂部：Logo＋公司名稱；右邊展示用按鈕（DEMO_TOOLS） -->
      <header class="top">
        <div class="brand">
          <div class="logo"><img src="../img/logo.png" alt="" draggable="false" /></div>
          <span class="brand-name serif">建豐健康科技</span>
        </div>
        <div class="demo" id="demo">
          <button class="demo-btn" type="button" data-demo="ok"><i class="ti ti-circle-check" aria-hidden="true"></i>模擬成功</button>
          <button class="demo-btn" type="button" data-demo="fail"><i class="ti ti-alert-circle" aria-hidden="true"></i>模擬失敗</button>
        </div>
      </header>

      <section class="card" aria-live="polite">
        <!-- 狀態 1：讀取中 -->
        <div class="state reading" id="stReading">
          <div class="reading-icon" aria-hidden="true"><i class="ti ti-id"></i></div>
          <h1 class="state-title serif">正在讀取健保卡</h1>
          <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="warn"><i class="ti ti-alert-triangle" aria-hidden="true"></i>讀取中，請勿取出健保卡</p>
        </div>

        <!-- 狀態 2：讀取成功 -->
        <div class="state ok" id="stOk">
          <div class="head">
            <div class="head-icon" aria-hidden="true"><i class="ti ti-circle-check-filled"></i></div>
            <div>
              <h1 class="state-title serif">讀取成功</h1>
              <p class="state-sub">可以開始測驗了</p>
            </div>
          </div>
          <div class="take">
            <i class="ti ti-id" aria-hidden="true"></i>
            <div>
              <span class="take-title serif">請取回您的健保卡</span>
              <span class="take-sub">讀卡機在螢幕下方</span>
            </div>
          </div>
          <!-- 手機號碼（選填）：不用 input，避免觸發系統鍵盤 -->
          <div class="phone">
            <div class="phone-label">手機號碼<span class="phone-opt">選填</span></div>
            <div class="phone-field" id="phoneField" role="button" tabindex="0" aria-haspopup="dialog" aria-label="輸入手機號碼，選填" aria-describedby="phoneValue phoneError">
              <i class="ti ti-device-mobile" aria-hidden="true"></i>
              <span class="phone-value" id="phoneValue"></span>
            </div>
            <p class="phone-error" id="phoneError" role="alert" hidden>手機號碼需為 09 開頭的 10 位數</p>
          </div>
          <div class="btns">
            <button class="btn btn-ghost" type="button" data-act="back"><i class="ti ti-arrow-left" aria-hidden="true"></i>返回</button>
            <button class="btn btn-primary" type="button" data-act="start"><i class="ti ti-walk" aria-hidden="true"></i>開始測驗</button>
          </div>
        </div>

        <!-- 狀態 3：讀取失敗 -->
        <div class="state fail" id="stFail">
          <div class="fail-icon" aria-hidden="true"><i class="ti ti-alert-circle"></i></div>
          <h1 class="state-title serif">讀取失敗</h1>
          <p class="fail-desc">請取出健保卡，再重新插入一次</p>
          <div class="fail-btns">
            <button class="btn btn-primary btn-retry" type="button" data-act="retry"><i class="ti ti-refresh" aria-hidden="true"></i>重新讀取</button>
            <button class="btn btn-ghost" type="button" data-act="back"><i class="ti ti-arrow-left" aria-hidden="true"></i>返回</button>
            <button class="btn btn-ghost" type="button" data-act="guest"><i class="ti ti-user-circle" aria-hidden="true"></i>改用訪客模式</button>
          </div>
        </div>
      </section>
    </main>

    <!-- 自製數字鍵盤 -->
    <div class="pad-mask" id="padMask" aria-hidden="true">
      <div class="pad" id="pad" role="dialog" aria-modal="true" aria-labelledby="padTitle" tabindex="-1">
        <h2 class="pad-title serif" id="padTitle">輸入手機號碼</h2>
        <div class="pad-show" id="padShow">
          <span class="pad-num serif" id="padNum" aria-live="polite"></span>
          <span class="pad-count" id="padCount"></span>
        </div>
        <div class="pad-keys" id="padKeys"></div>
      </div>
    </div>

    <script>
      /* =========================================================
       * 設定
       * ========================================================= */
      // 展示用按鈕「模擬成功／模擬失敗」（右上角）；正式上線改為 false，按鈕完全不顯示
      const DEMO_TOOLS = true;
      // 模擬讀卡資料（之後改成讀卡機服務回傳的資料）
      const DEMO_CARD = { name: "王小明", gender: "男", birth: { rocYear: 50, month: 3, day: 15 }, id: "A123456789" };
      const SIM_READ_MS = 2500; // 模擬：讀取需要的時間
      const READ_TIMEOUT_MS = 15000; // 讀取逾時：15 秒都沒有結果就當作讀取失敗
      const IDLE_MS = 90000; // 成功、失敗畫面閒置多久自動回到 kiosk.html（讀取中不計）
      const HOME_URL = "kiosk.html";
      const GUEST_URL = "kiosk-guest.html";
      const TEST_URL = "assess.html?test=gait&kiosk=1&src=card";
      const CARD_KEY = "kf.kioskCard";
      const PENDING_KEY = "kf.cardPending"; // 插卡時由 kiosk.html 的 onCardInserted 暫存（身分證已遮罩），同意後在這裡使用

      const $ = (s) => document.querySelector(s);
      // 模擬結果：網址帶 ?card=fail 時，第一次讀取失敗、重新讀取後成功
      const failFirst = new URLSearchParams(location.search).get("card") === "fail";

      // 一體機：關閉長按系統選單
      document.addEventListener("contextmenu", (e) => e.preventDefault());

      const store = {
        save(v) {
          try {
            sessionStorage.setItem(CARD_KEY, JSON.stringify(v));
          } catch {}
        },
        clear() {
          try {
            sessionStorage.removeItem(CARD_KEY);
          } catch {}
        },
      };

      // 插卡暫存的卡片資料：讀取成功後就清掉
      const pending = {
        get() {
          try {
            const v = JSON.parse(sessionStorage.getItem(PENDING_KEY));
            return v?.name && v.birth ? v : null;
          } catch {
            return null;
          }
        },
        clear() {
          try {
            sessionStorage.removeItem(PENDING_KEY);
          } catch {}
        },
      };

      /* ===== 身分證遮罩（A12****789）；姓名不在這頁顯示 ===== */
      const maskId = (id) => (id && id.length > 6 ? id.slice(0, 3) + "*".repeat(id.length - 6) + id.slice(-3) : "");

      /* ===== 狀態切換 ===== */
      let state = "";
      let card = null; // 讀到的卡片資料
      function show(next) {
        state = next;
        const id = { reading: "#stReading", ok: "#stOk", fail: "#stFail" }[next];
        document.querySelectorAll(".state").forEach((el) => el.classList.toggle("is-on", el === $(id)));
        // 展示用按鈕：讀取中停用，避免連點
        document.querySelectorAll("[data-demo]").forEach((b) => (b.disabled = next === "reading"));
        document.title = `建豐健康科技 - ${{ reading: "讀取健保卡", ok: "讀取成功", fail: "讀取失敗" }[next]}`;
        if (next === "reading") stopIdle();
        else resetIdle();
      }

      /* =========================================================
       * 讀卡：目前為模擬（約 2.5 秒後回傳插卡暫存的資料，沒有才用 DEMO_CARD；?card=fail 時第一次失敗）
       * 之後改成讀卡機服務：readCard() 回傳 Promise<卡片資料>，失敗時 reject
       * 15 秒沒有結果視為讀取失敗
       * ========================================================= */
      let attempt = 0;
      // forced：展示用按鈕指定的結果（"ok"／"fail"）；沒有指定時照模擬規則
      function readCard(forced) {
        attempt += 1;
        const fail = forced ? forced === "fail" : failFirst && attempt === 1;
        return new Promise((resolve, reject) => setTimeout(() => (fail ? reject(new Error("read failed")) : resolve((!forced && pending.get()) || DEMO_CARD)), SIM_READ_MS));
      }
      let readToken = 0;
      function startRead(forced) {
        const token = ++readToken; // 新的讀取開始後，前一次還沒回來的結果一律忽略
        card = null;
        store.clear();
        resetPhone();
        show("reading");
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), READ_TIMEOUT_MS));
        Promise.race([readCard(forced), timeout]).then(
          (data) => {
            if (token !== readToken) return;
            card = data;
            pending.clear();
            show("ok");
          },
          () => {
            if (token === readToken) show("fail");
          },
        );
      }

      /* =========================================================
       * 手機號碼（選填）＋自製數字鍵盤
       * 只能輸入數字、最多 10 位；刪除鍵刪最後一位、長按 0.6 秒清除全部
       * 「完成」、點遮罩、Esc 都會關閉並保留已輸入的號碼；實體鍵盤：數字、Backspace、Enter（完成）、Esc
       * ========================================================= */
      const PHONE_LEN = 10;
      const CLEAR_HOLD_MS = 600;
      const phoneOk = (v) => v === "" || /^09\d{8}$/.test(v);
      const formatPhone = (v) => [v.slice(0, 4), v.slice(4, 7), v.slice(7)].filter(Boolean).join("-");
      let phone = "";
      let padOpen = false;
      function setPhone(v) {
        phone = v;
        $("#phoneField").classList.toggle("has-value", v !== "");
        $("#phoneValue").textContent = v ? formatPhone(v) : "點這裡輸入手機號碼";
        $("#padNum").textContent = formatPhone(v);
        $("#padCount").textContent = `${v.length} / ${PHONE_LEN}`;
      }
      function setPhoneError(on) {
        $("#phoneField").classList.toggle("is-error", on);
        $("#phoneError").hidden = !on;
      }
      function resetPhone() {
        closePad();
        setPhone("");
        setPhoneError(false);
      }
      function openPad() {
        padOpen = true;
        setPhoneError(false);
        $("#padMask").classList.add("is-open");
        $("#padMask").setAttribute("aria-hidden", "false");
        document.querySelector(".page").inert = true;
        $("#pad").focus({ preventScroll: true });
      }
      function closePad() {
        if (!padOpen) return;
        padOpen = false;
        $("#padMask").classList.remove("is-open");
        $("#padMask").setAttribute("aria-hidden", "true");
        document.querySelector(".page").inert = false;
        $("#phoneField").focus({ preventScroll: true });
      }
      function pressDigit(d) {
        if (phone.length < PHONE_LEN) return setPhone(phone + d);
        const show = $("#padShow");
        show.classList.remove("is-shake");
        void show.offsetWidth; // 重新開始晃動
        show.classList.add("is-shake");
      }
      const pressDelete = () => setPhone(phone.slice(0, -1));
      function initPhone() {
        $("#padKeys").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, "del", 0, "done"]
          .map((k) =>
            k === "del"
              ? '<button class="pad-key pad-del" type="button" data-key="del" aria-label="刪除，長按清除全部"><i class="ti ti-backspace" aria-hidden="true"></i></button>'
              : k === "done"
                ? '<button class="pad-key pad-done" type="button" data-key="done">完成</button>'
                : `<button class="pad-key" type="button" data-key="${k}">${k}</button>`,
          )
          .join("");
        setPhone("");

        const field = $("#phoneField");
        field.addEventListener("click", openPad);
        field.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" && e.key !== " ") return;
          e.preventDefault();
          e.stopPropagation(); // 同一次按鍵不要再傳給鍵盤的「Enter＝完成」
          resetIdle();
          openPad();
        });

        // 長按刪除 0.6 秒：清除全部（放開時的 click 不再刪一位）
        const del = document.querySelector(".pad-del");
        let holdTimer;
        let cleared = false;
        del.addEventListener("pointerdown", () => {
          cleared = false;
          clearTimeout(holdTimer);
          holdTimer = setTimeout(() => {
            cleared = true;
            setPhone("");
          }, CLEAR_HOLD_MS);
        });
        ["pointerup", "pointerleave", "pointercancel"].forEach((t) => del.addEventListener(t, () => clearTimeout(holdTimer)));

        $("#padMask").addEventListener("click", (e) => {
          if (e.target === $("#padMask")) return closePad();
          const key = e.target.closest("[data-key]")?.dataset.key;
          if (!key) return;
          if (key === "done") closePad();
          else if (key === "del") {
            if (cleared) cleared = false;
            else pressDelete();
          } else pressDigit(key);
        });
        document.addEventListener("keydown", (e) => {
          if (!padOpen || e.ctrlKey || e.metaKey || e.altKey) return;
          if (/^[0-9]$/.test(e.key)) pressDigit(e.key);
          else if (e.key === "Backspace") pressDelete();
          else if (e.key === "Enter" || e.key === "Escape") closePad();
          else if (e.key === "Tab") {
            // Tab 只在鍵盤的按鍵之間移動
            const keys = [...document.querySelectorAll(".pad-key")];
            const i = keys.indexOf(document.activeElement);
            keys[(i + (e.shiftKey ? (i < 0 ? 0 : -1) : 1) + keys.length) % keys.length].focus();
          } else return;
          e.preventDefault();
        });
      }

      /* ===== 按鈕 ===== */
      function goHome() {
        store.clear();
        pending.clear();
        resetPhone();
        location.href = HOME_URL;
      }
      function startTest() {
        if (!card) return;
        if (!phoneOk(phone)) return setPhoneError(true);
        // 身分證只存遮罩後的值
        store.save({
          name: card.name,
          gender: card.gender,
          birth: { ...card.birth },
          idMasked: card.idMasked ?? maskId(card.id),
          phone, // 純數字；沒填時為空字串
          readAt: new Date().toISOString(),
        });
        location.href = TEST_URL;
      }
      document.addEventListener("click", (e) => {
        const act = e.target.closest("[data-act]")?.dataset.act;
        if (act === "back") goHome();
        else if (act === "start") startTest();
        else if (act === "retry") startRead();
        const demo = e.target.closest("[data-demo]")?.dataset.demo;
        if (demo && DEMO_TOOLS) startRead(demo); // 任何狀態：立刻回到讀取中，2.5 秒後進入指定結果
        else if (act === "guest") {
          store.clear();
          pending.clear();
          resetPhone();
          location.href = GUEST_URL;
        }
      });

      /* ===== 閒置：成功、失敗畫面 90 秒沒有操作就回到 kiosk.html（清除讀卡資料）；讀取中不計 ===== */
      let idleTimer;
      function stopIdle() {
        clearTimeout(idleTimer);
      }
      function resetIdle() {
        clearTimeout(idleTimer);
        if (state === "reading") return;
        idleTimer = setTimeout(goHome, IDLE_MS);
      }
      ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => document.addEventListener(t, resetIdle, { passive: true }));

      if (!DEMO_TOOLS) $("#demo").remove(); // 正式上線：展示用按鈕完全不顯示
      initPhone();
      startRead();
      // 從瀏覽器上一頁回來（頁面快取）：重新讀卡，不留下前一位的號碼
      addEventListener("pageshow", (e) => {
        if (e.persisted) startRead();
      });
    </script>
  </body>
</html>
